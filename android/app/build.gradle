plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.dividetask.crimsonsteel"
    compileSdk 35

    defaultConfig {
        applicationId "com.dividetask.crimsonsteel"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.002"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

// The UI uses only the Android framework (no AndroidX), so the only
// runtime dependency is the Kotlin standard library the plugin adds.
dependencies {
    testImplementation "junit:junit:4.13.2"
}
