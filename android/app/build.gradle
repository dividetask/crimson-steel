plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.dividetask.crimsonsteel"
    compileSdk 35

    defaultConfig {
        applicationId "com.dividetask.crimsonsteel"
        minSdk 22 // Fire 7 (2017): Fire OS 5, Android 5.1
        targetSdk 35
        // versionCode: timestamp-based, always increasing across branches.
        // versionName: predicted APK filename (vMAJOR.MINOR.apk = newest committed
        // APK minor + 1), a per-commit letter (a, b, c… for each commit pushed
        // before a new APK lands; resets to 'a' once a new APK is built), and the
        // 4-char hash of the commit Gradle built from. The first two are set by
        // hand; the hash is added at build time because a commit can't contain
        // its own hash. (Rules: CLAUDE.md → Android build versioning.)
        versionCode((int) (System.currentTimeMillis() / 60000))
        def versionBase = "v0.061 a"
        def commitHash = "unknown"
        try {
            def process = ["git", "rev-parse", "--short=4", "HEAD"].execute()
            process.waitFor()
            def out = process.text.trim()
            if (out) commitHash = out
        } catch (ignored) { }
        versionName "${versionBase} (${commitHash})"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

// The UI and networking use only the Android framework (no AndroidX), so the
// only runtime dependency is the Kotlin standard library the plugin adds.
dependencies {
    testImplementation "junit:junit:4.13.2"
    // android.jar only stubs org.json; unit tests need the real implementation.
    testImplementation "org.json:json:20240303"
}
