plugins {
    id "com.android.application"
}

android {
    namespace "com.dividetask.crimsonsteel"
    compileSdk 35

    defaultConfig {
        applicationId "com.dividetask.crimsonsteel"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.001"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies yet: the splash screen uses only the Android framework.
