plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.dividetask.crimsonsteel"
    compileSdk 35

    defaultConfig {
        applicationId "com.dividetask.crimsonsteel"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.005"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

// The UI and networking use only the Android framework (no AndroidX), so the
// only runtime dependency is the Kotlin standard library the plugin adds.
dependencies {
    testImplementation "junit:junit:4.13.2"
    // android.jar only stubs org.json; unit tests need the real implementation.
    testImplementation "org.json:json:20240303"
}
