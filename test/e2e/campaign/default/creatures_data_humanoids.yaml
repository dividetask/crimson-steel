# Loaded via the standard creatures_data_*.example.{yaml,json} glob.
# Each template's `tags` include `enemy_template` plus
# `category:humanoids`; the Character Sheets page's Roster Sidebar uses
# that category tag to group templates and encounter tables under the
# matching heading.

