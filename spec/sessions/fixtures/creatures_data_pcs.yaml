# Session Test party — a frozen roster (see docs/project/session_tests.md).
#
# Never the live campaign, and never the shipped examples: these five are
# chosen so every Spell the Session Tests cast has someone who knows it.
#
#   1  Ash Windmere    bard 3     — Skill checks, Timely Inspiration
#   3  Lira Duskmoor   wizard 6   — Grease, Create Pit, Standard Shield
#   7  Thora Stoneveil cleric 4   — Shield of Faith, Spiritual Weapon,
#                                   the low Heal / Ward tiers
#   8  Garroth Vask    barbarian 4 — the party's damage sponge
#   9  Sister Auria    cleric 12  — every Heal and every Ward tier, so
#                                   "all the healing Spells" and "all the
#                                   ward Spells" have a caster who can
#                                   reach the top of both axes.

