# Loot Routing — File Write Rules
#
# When a character, the party, or a ground pile gains or modifies an
# item, this file determines which YAML file the change is written to.
#
# Precedence, highest first:
#   1. `character_overrides` — keyed by character ID. If a character's
#      ID appears here, their inventory lives in the specified file.
#   2. `group_overrides` — keyed by group ID. If a character belongs to
#      a group listed here (and is not covered by a character override),
#      their inventory lives in the specified file. Groups are defined
#      elsewhere (the character module) — this file only references
#      their IDs.
#   3. `party_file` — where the party's shared inventory is written.
#   4. `ground_file` — where new ground piles and their updates are
#      written.
#   5. `default_file` — fallback for anything not matched above.
#
# All files referenced here are read during the multi-file load pass
# described in `loot.yaml`'s header (base file + `loot-*.yaml` glob).
# That means adding a file here automatically makes it part of the
# load set — no separate registration step.

default_file: loot.yaml

party_file: loot.yaml

ground_file: loot.yaml

character_overrides:
  # Example — remove or edit for your own campaign:
  # alice: loot-party.yaml
  # borin: loot-party.yaml

group_overrides:
  # Example — remove or edit for your own campaign:
  # player_characters: loot-party.yaml
  # vrakkas_hand: loot-monsters.yaml
  # town_merchants: loot-shops.yaml
