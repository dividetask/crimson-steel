# Equipment Configuration
#
# Defines the weapons, armor, ammunition, currencies, magical
# properties, and naming rules used throughout the game.
#
# This file describes what items CAN exist. Specific instances
# (a particular +1 Flaming Longsword in Alice's inventory) live in
# loot.yaml — not here.
#
# ---------------------------------------------------------------------
# Pricing
#
# All prices are in gold pieces (gp) as decimal numbers. Currency
# exchange is 1 gp = 10 sp = 100 cp. Prices may be fractional
# (e.g. 0.25 gp for a single magical arrow).

# =====================================================================
# CURRENCY
# =====================================================================

Currency:
  Gold:
    symbol: gp
    value_in_gold: 1.0
  Silver:
    symbol: sp
    value_in_gold: 0.1
  Copper:
    symbol: cp
    value_in_gold: 0.01

# =====================================================================
# TIER PRICING (shared)
# =====================================================================
#
# The additional cost (in gp) of making any weapon, armor, or
# ammunition magical. Tier 0 is non-magical and has no additional
# cost. Consumed by weapons, armor, and ammunition alike.

Tier Surcharges:
  0: 0
  1: 250
  2: 1000
  3: 4000
  4: 16000
  5: 80000

# =====================================================================
# NAMING CONVENTION
# =====================================================================
#
# How a magical item's display name is constructed when no explicit
# name override is set on the item instance.
#
# Format: <tier_prefix> <property_prefixes...> <item_name> <property_suffixes...>
#
# - tier_prefix is "+N" for any magical item (tier >= 1). Omitted for
#   tier 0 (non-magical) items.
# - property_prefixes and property_suffixes come from the `display`
#   block on each property (see Weapon Properties and Armor Properties).
#   A property may indicate a word and a position ('prefix' by default,
#   or 'suffix'). Multiple properties are applied in the order they
#   appear on the item instance. Words at the same position are
#   concatenated in that order.
# - Any item category listed in `tier_hidden_for` omits the tier_prefix
#   regardless of tier.

Naming Convention:
  tier_prefix_format: "+{tier}"
  tier_hidden_for:
    - Potion
  default_property_position: prefix

# =====================================================================
# WEAPONS
# =====================================================================

# ---------------------------------------------------------------------
# Weapon Category Defaults
#
# Each category specifies the default damage formula for weapons in it.
# `str` refers to the attacker's Strength score and is resolved by the
# character module. All formulas use integer division (`/` rounds down).

Weapon Category Defaults:
  Ranged:
    damage: "str / 4"
  One Handed:
    damage: "str / 4 - 2"
  Two Handed:
    damage: "str / 2 + 2"

# ---------------------------------------------------------------------
# Damage Type Defaults
#
# Each damage type specifies the default bleed and threshold values for
# weapons dealing that type. When a weapon has multiple damage types,
# the attack uses the highest bleed and the lowest threshold across
# those types.

Damage Type Defaults:
  Slashing:
    bleed: 7
    threshold: 5
  Bludgeoning:
    bleed: 5
    threshold: 3
  Piercing:
    bleed: 3
    threshold: 4

