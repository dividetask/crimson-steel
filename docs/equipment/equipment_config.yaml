# ---------------------------------------------------------------------
# Weapon Magical Properties
#
# Properties that can be applied to a weapon when it is made magical.
# Each property lists the minimum tier required, the cost in gp, which
# weapon categories it applies to, whether it accepts a subtype, and
# a display block describing how it contributes to the item's name.
#
# `display` fields:
#   word (required): the word the property contributes to the name.
#   position (optional, default 'prefix'): 'prefix' or 'suffix'.
#   For properties with subtypes, `display` is a map of subtype to
#     {word, position} instead.

Weapon Properties:

  Elemental:
    min_tier: 1
    cost: 500
    applies_to: [melee, ranged, ammo]
    has_subtype: true
    subtypes: [Fire, Acid, Electricity, Cold]
    display:
      Fire:
        word: Flaming
      Acid:
        word: Corrosive
      Electricity:
        word: Shocking
      Cold:
        word: Freezing

  Subdual:
    min_tier: 1
    cost: 250
    applies_to: [melee, ranged, ammo]
    has_subtype: false
    display:
      word: Merciful

  Emotional:
    min_tier: 1
    cost: 500
    applies_to: [melee, ranged, ammo]
    has_subtype: false
    display:
      word: Laughing

  Radiant:
    min_tier: 1
    cost: 500
    applies_to: [melee, ranged, ammo]
    has_subtype: false
    display:
      word: Radiant

  Necrotic:
    min_tier: 2
    cost: 2000
    applies_to: [melee, ranged, ammo]
    has_subtype: false
    display:
      word: Withering

  Vicious:
    min_tier: 2
    cost: 2000
    applies_to: [melee]
    has_subtype: false
    display:
      word: Vicious

# =====================================================================
# AMMUNITION
# =====================================================================
#
# Ammunition is sold in bundles of 20. `base_price` is the price of a
# full bundle of mundane ammunition. A single magical ammunition unit
# costs 1/100th of the equivalent magical weapon's total surcharge —
# that is, (tier surcharge + property costs) / 100 — plus the per-unit
# mundane cost (bundle_price / 20).
#
# Example: a Tier 1 Flaming Arrow. Magical surcharge = 250 (Tier 1)
# + 500 (Elemental Fire) = 750 gp. Per-unit magical cost = 7.5 gp.
# Mundane Arrow per-unit = 5 / 20 = 0.25 gp. Total = 7.75 gp.

Ammunition:

  Arrow:
    base_price: 5
    bundle_size: 20
    used_by: [Longbow, Shortbow]

  Bolt:
    base_price: 5
    bundle_size: 20
    used_by: [Crossbow]

  Blowgun dart:
    base_price: 2
    bundle_size: 20
    used_by: [Blowgun]

  Stone:
    base_price: 1
    bundle_size: 20
    used_by: [Sling]

# =====================================================================
# ARMOR
# =====================================================================

# ---------------------------------------------------------------------
# Armor Category Defaults

Armor Category Defaults:
  Light:
    damage_reduction: 1
    resilience_increment: 1
    category_level: 1
  Medium:
    damage_reduction: 3
    resilience_increment: 2
    category_level: 2
  Heavy:
    damage_reduction: 6
    resilience_increment: 3
    category_level: 3
  Shield:
    damage_reduction: null
    resilience_increment: null
    category_level: 1

# ---------------------------------------------------------------------
# Material Defaults

Material Defaults:
  Leather:
    hardness: 2
    hit_points: "5 * category_level"
  Metal:
    hardness: 10
    hit_points: "30 * category_level"
  Wood:
    hardness: 5
    hit_points: "10 * category_level"

# ---------------------------------------------------------------------
# Armor
#
# Non-magical armor has no resilience. Magical armor has resilience
# equal to the armor's Tier multiplied by its resilience_increment.

Armor:

  # --- Light ---

  Leather armor:
    category: Light
    material: Leather
    base_price: 10

  Chain shirt:
    category: Light
    material: Metal
    base_price: 100

  # --- Medium ---

  Hide armor:
    category: Medium
    material: Leather
    base_price: 15

  Chain mail:
    category: Medium
    material: Metal
    base_price: 150

  # --- Heavy ---

  Plate mail:
    category: Heavy
    material: Metal
    base_price: 500

  # --- Shield ---

  Light wooden shield:
    category: Shield
    material: Wood
    base_price: 3

  Light shield:
    category: Shield
    material: Metal
    base_price: 8

  Tower shield:
    category: Shield
    material: Metal
