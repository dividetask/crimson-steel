# Loot — Inventory and Item Tracking (sample)
#
# Tracks who owns what. Item definitions — what weapons, armor,
# ammunition, currencies, and magical properties exist — live in
# `equipment_config.yaml`. This file only tracks quantities.
#
# ---------------------------------------------------------------------
# Multi-file loading
#
# The loader reads `loot.yaml` first, then every file matching
# `loot-*.yaml` in the same directory (e.g. `loot-party.yaml`,
# `loot-monsters.yaml`, `loot-shops.yaml`). All entries are
# concatenated. If the same character (or party slot, or ground
# location) appears in multiple files, their inventories are
# concatenated. Stacks within an inventory may then be merged
# normally by the merge rule below.
#
# Where new items are written back is governed by `loot_routing.yaml`,
# which maps character IDs and group IDs to specific files. Entries
# not covered by the routing rules default to `loot.yaml`.
#
# ---------------------------------------------------------------------
# No persistent references
#
# Items are never referenced by persistent IDs. An item is referenced
# by its position in its owner's list, and that index is only valid
# during the operation that looks it up. Nothing stores "item #3"
# across server restarts, save files, or requests.
#
# ---------------------------------------------------------------------
# Stack identity and merging
#
# Two stacks are considered identical (and will be merged) when every
# identity field matches exactly:
#   item, tier, properties (in order), stored_spell, durability_damage,
#   name (override).
# If any of these differ, they remain separate stacks.
#
# ---------------------------------------------------------------------
# Zero-quantity stacks
#
# Stacks with quantity 0 are NOT automatically removed. A cleanup pass
# (typically run at server restart) removes them. Code reading
# inventory must filter `quantity > 0` before treating a stack as
# owned.
#
# ---------------------------------------------------------------------
# Fields per item entry (all optional unless noted)
#
#   item:              REQUIRED. Name of the weapon, armor, ammunition,
#                      or currency as defined in equipment_config.yaml.
#   quantity:          How many are in this stack. Defaults to 1.
#   tier:              Magical tier. Defaults to 0.
#   properties:        List of applied magical properties. Each entry
#                      is either a property name string or a mapping
#                      with `name` and `subtype`.
#   stored_spell:      The spell currently held in a Spell Storing or
#                      Spell Crystal item. Each such item holds at
#                      most one spell. Absent or blank means expended.
#   durability_damage: Damage the item has taken. Defaults to 0.
#   name:              Display-name override. When omitted, the name
#                      is generated from the item's properties per
#                      the Naming Convention in equipment_config.yaml.
#   restock_target:    Desired stack quantity. When the restock action
#                      is invoked, the owner attempts to buy
#                      `(restock_target - quantity)` units. Defaults
#                      to 0.

# =====================================================================
# Characters
# =====================================================================

characters:

  alice:
    inventory:

      - item: Long sword
        tier: 1
        properties:
          - name: Elemental
            subtype: Fire
        # Generated display name: "+1 Flaming Long sword"

      - item: Chain shirt

      - item: Shortbow

      - item: Arrow
        quantity: 18
        restock_target: 40

      - item: Arrow
        quantity: 3
        tier: 1
        properties:
          - name: Elemental
            subtype: Fire
        # Separate stack from mundane arrows — tier and properties
        # differ.

      - item: Gold
        quantity: 147.5

  borin:
    inventory:

      - item: Great Axe
        tier: 2
        properties:
          - name: Vicious
        name: "Skullsplitter"
        # Explicit name override wins over the generated name.

      - item: Plate mail
        tier: 1
        properties:
          - name: Fortification
        durability_damage: 12

      - item: Gold
        quantity: 34

  cleric_elara:
    inventory:

      - item: Mace
        tier: 1
        properties:
          - name: Radiant

      - item: Chain mail
        tier: 1
        properties:
          - name: Spell Storing 1
        stored_spell: "Cure Light Wounds"

      - item: Light wooden shield

      - item: Gold
        quantity: 52
      - item: Silver
        quantity: 8

# =====================================================================
# Party
# =====================================================================
#
# Items the group shares without assigning ownership to any one
# character.

party:
  inventory:

    - item: Healing Potion
      quantity: 3

    - item: Gold
      quantity: 400

    - item: Rope
      quantity: 2

    - item: Bolt
      quantity: 60
      restock_target: 120

# =====================================================================
# Ground piles
# =====================================================================
#
# Items on the ground at a named location. Locations are free-form
# strings.

ground_piles:

  - location: "Goblin cave — entrance"
    inventory:
      - item: Shortbow
      - item: Arrow
        quantity: 11
      - item: Dagger
        quantity: 2
      - item: Gold
        quantity: 8
      - item: Silver
        quantity: 23

  - location: "Abandoned shrine — altar"
    inventory:
      - item: Mace
        tier: 1
        properties:
          - name: Radiant
      - item: Leather armor
        durability_damage: 5
