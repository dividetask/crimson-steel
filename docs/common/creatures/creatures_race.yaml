# Creature Race Configuration
#
# Each entry is a Race Entry. A Creature's `race:` field names one entry;
# the catalog walks the entry's `parent:` chain (leaf → root) to resolve
# the effective Race. Field rules during chain walk:
#   first-in-chain wins: size, speed
#   accumulate: attribute_adjustments
#   concatenate-with-dedup (child wins on duplicate name): abilities
#
# `abilities` lists support context entries — a bare `{min_level: N}`
# becomes the rolling default `min_level` for following ability
# entries until the next context entry. Context entries are
# flattened at config-load time.
#
# The shipped entries below are placeholders — sizes and speeds are
# set where tests or example data depend on them; attribute_adjustments
# and abilities are left empty for the campaign to fill in.

# --- Roots -------------------------------------------------------------

humanoid:
  size: medium
  speed: 30

undead:
  size: medium
  speed: 30
  abilities:
    - name: undead_traits
      min_level: 0

# --- Humanoid races ----------------------------------------------------
human:
  parent: humanoid
  abilities: []

dwarf:
  parent: humanoid
  speed: 20
  abilities:
    - name: poison_resistance
      min_level: 0

hill_dwarf:
  parent: dwarf
  abilities: []

elf:
  parent: humanoid
  abilities:
    - name: enchantment_resistance
      min_level: 0

high_elf:
  parent: elf
  abilities: []

wood_elf:
  parent: elf
  speed: 35
  abilities: []

half_elf:
  parent: humanoid
  abilities: []

half_orc:
  parent: humanoid
  abilities: []

# Full-blooded orc. +4 Str/Con, -2 Int/Wis/Cha; low-light vision and
# Ferocity (fights on past 0 HP). Medium / speed 30 from humanoid.
orc:
  parent: humanoid
  attribute_adjustments: { str: 4, con: 4, int: -2, wis: -2, cha: -2 }
  abilities:
    - name: low_light_vision
      min_level: 0
    - name: ferocity
      min_level: 0

halfling:
  parent: humanoid
  speed: 25
  abilities: []

satyr:
  parent: humanoid
  speed: 35
  abilities:
    - name: enchantment_resistance
      min_level: 0

# -4 Str/Con/Int/Cha, -2 Wis, +4 Dex. Small, low-light vision, and the
# Fast Movement trait (+10 ft).
goblin:
  parent: humanoid
  size: small
  speed: 25
  attribute_adjustments: { str: -4, con: -4, int: -4, cha: -4, wis: -2, dex: 4 }
  abilities:
    - name: low_light_vision
      min_level: 0
    - name: fast_movement
      min_level: 0

# -4 Str, -2 Con/Wis, +2 Dex/Int. Small, speed 30. Low-light vision,
# scaled hide (+1 damage reduction / resilience), light sensitivity, and
# Trapfinding.
kobold:
  parent: humanoid
  size: small
  speed: 30
  attribute_adjustments: { str: -4, con: -2, wis: -2, dex: 2, int: 2 }
  abilities:
    - name: low_light_vision
      min_level: 0
    - name: scaled_hide
      min_level: 0
    - name: light_sensitivity
      min_level: 0
    - name: Trapfinding
      min_level: 0

# --- Fey races ---------------------------------------------------------

fey:
  size: small
  speed: 30
  abilities: []

sprite:
  parent: fey
  size: tiny
  speed: 20
  abilities: []

pixie:
  parent: fey
  size: tiny
  speed: 20
  abilities: []

dryad:
  parent: fey
  size: medium
  speed: 30
  abilities: []

brownie:
  parent: fey
  size: small
  speed: 25
  abilities: []

# --- Animal races ------------------------------------------------------
# `beast` is the root Animal race; every beast is one of its subtypes
# (canine, spider, ...). Subtypes set their own speed and grant a Natural
# Attack Talent (Canine Bite / Spider Bite) whose `grants_equipment` names
# the Bite weapon in the Equipment catalog. The bite is offered as an
# attack but is never carried as an inventory item.

beast:
  size: medium
  speed: 30
  abilities: []

# Size-keyed beast templates. Every beast inherits its attribute
# adjustments from one of these and then its concrete subtype
# (canine, spider, ...) layers on speed and a Natural Attack. All
# beasts take -8 Int (the min-1 Effective Attribute clamp keeps the
# score at 1) and -4 Wis/Cha.
tiny_beast:
  parent: beast
  size: tiny
  attribute_adjustments: { str: -6, con: -6, dex: 6, wis: -4, cha: -4, int: -8 }

small_beast:
  parent: beast
  size: small
  attribute_adjustments: { str: -4, con: -4, dex: 4, wis: -4, cha: -4, int: -8 }

medium_beast:
  parent: beast
  size: medium
  attribute_adjustments: { dex: 2, wis: -4, cha: -4, int: -8 }

large_beast:
  parent: beast
  size: large
  attribute_adjustments: { str: 4, con: 4, wis: -4, cha: -4, int: -8 }
  abilities:
    - name: natural_armor_2
      min_level: 0

canine:
  parent: medium_beast
  speed: 40
  abilities:
    - name: Canine Bite
      min_level: 0

spider:
  parent: medium_beast
  speed: 20
  abilities:
    - name: Spider Bite
      min_level: 0
