# Creature Race Configuration
#
# Each entry is a Race Entry. A Creature's `race:` field names one entry;
# the catalog walks the entry's `parent:` chain (leaf → root) to resolve
# the effective Race. Field rules during chain walk:
#   first-in-chain wins: size, speed
#   accumulate: attribute_adjustments
#   concatenate-with-dedup (child wins on duplicate name): abilities
#
# `abilities` lists support context entries — a bare `{min_level: N}`
# becomes the rolling default `min_level` for following ability
# entries until the next context entry. Context entries are
# flattened at config-load time.
#
# The shipped entries below are placeholders — sizes and speeds are
# set where tests or example data depend on them; attribute_adjustments
# and abilities are left empty for the campaign to fill in.

# --- Roots -------------------------------------------------------------

humanoid:
  size: medium
  speed: 30

undead:
  size: medium
  speed: 30
  abilities:
    - name: undead_traits
      min_level: 0

# --- Humanoid races ----------------------------------------------------
human:
  parent: humanoid
  attribute_adjustments:
    all: 1
  abilities: []

dwarf:
  parent: humanoid
  speed: 20
  abilities:
    - name: poison_resistance
      min_level: 0

hill_dwarf:
  parent: dwarf
  attribute_adjustments:
    con: 2
    wis: 2
  abilities: []

mountain_dwarf:
  parent: dwarf
  attribute_adjustments:
    str: 2
    con: 2
  abilities: []

elf:
  parent: humanoid
  abilities:
    - name: enchantment_resistance
      min_level: 0

high_elf:
  parent: elf
  attribute_adjustments:
    dex: 2
    int: 2
  abilities: []

wood_elf:
  parent: elf
  speed: 35
  attribute_adjustments:
    dex: 2
    wis: 2
  abilities: []

# Not a playable sub-race (absent from character_creation.yaml's
# Playable Races) — exists for NPCs such as the Eladrin nobles.
eladrin:
  parent: elf
  attribute_adjustments:
    dex: 2
    cha: 2
  abilities: []

gnome:
  parent: humanoid
  size: small
  speed: 25
  abilities: []

forest_gnome:
  parent: gnome
  attribute_adjustments:
    dex: 2
    int: 2
  abilities: []

rock_gnome:
  parent: gnome
  attribute_adjustments:
    con: 2
    int: 2
  abilities: []

half_elf:
  parent: humanoid
  abilities: []

half_orc:
  parent: humanoid
  abilities: []

# Full-blooded orc. +4 Str/Con, -2 Int/Wis/Cha; low-light vision and
# Ferocity (fights on past 0 HP). Medium / speed 30 from humanoid.
orc:
  parent: humanoid
  attribute_adjustments: { str: 4, con: 4, int: -2, wis: -2, cha: -2 }
  abilities:
    - name: low_light_vision
      min_level: 0
    - name: ferocity
      min_level: 0

halfling:
  parent: humanoid
  speed: 25
  attribute_adjustments:
    cha: 2
    dex: 2
  abilities: []

satyr:
  parent: humanoid
  speed: 35
  attribute_adjustments:
    dex: 2
    cha: 2
  abilities:
    - name: enchantment_resistance
      min_level: 0

# -4 Str/Con/Int/Cha, -2 Wis, +4 Dex. Small, low-light vision, and the
# Fast Movement trait (+10 ft).
goblin:
  parent: humanoid
  size: small
  speed: 25
  attribute_adjustments: { str: -4, con: -4, int: -4, cha: -4, wis: -2, dex: 4 }
  abilities:
    - name: low_light_vision
      min_level: 0
    - name: fast_movement
      min_level: 0

# -4 Str, -2 Con/Wis, +2 Dex/Int. Small, speed 30. Low-light vision,
# scaled hide (+1 damage reduction / resilience), light sensitivity, and
# Trapfinding.
kobold:
  parent: humanoid
  size: small
  speed: 30
  attribute_adjustments: { str: -4, con: -2, wis: -2, dex: 2, int: 2 }
  abilities:
    - name: low_light_vision
      min_level: 0
    - name: scaled_hide
      min_level: 0
    - name: light_sensitivity
      min_level: 0
    - name: Trapfinding
      min_level: 0

# +14 Str/Con, -4 Dex/Int/Wis/Cha. Large, speed 30 from humanoid.
# Thick hide grants +4 natural armor; fights with a natural Slam.
ogre:
  parent: humanoid
  size: large
  attribute_adjustments: { str: 14, con: 14, dex: -4, int: -4, wis: -4, cha: -4 }
  abilities:
    - name: Ogre Slam
      min_level: 0
    - name: natural_armor_4
      min_level: 0

# A shapechanger that wears other people's faces, steals their memories,
# and reads their surface thoughts. +8 Str, +2 Dex/Con/Int, +4 Wis/Cha.
# Medium / speed 30 from humanoid.
doppelganger:
  parent: humanoid
  attribute_adjustments: { str: 8, dex: 2, con: 2, int: 2, wis: 4, cha: 4 }
  abilities:
    - name: absorb_persona
      min_level: 0
    - name: surface_thoughts
      min_level: 0
    - name: change_shape
      min_level: 0
    - name: borrowed_talent
      min_level: 0

# Disciplined martial goblinoids — the bulk of the slavers' hill-fort
# garrison. +2 Str/Con, low-light vision. Medium / speed 30 from humanoid.
hobgoblin:
  parent: humanoid
  attribute_adjustments: { str: 2, con: 2 }
  abilities:
    - name: low_light_vision
      min_level: 0

# Hyena-headed raiders; hired muscle from the surrounding tribes. +4 Str,
# +2 Con, -2 Int/Cha, low-light vision. Medium / speed 30 from humanoid.
gnoll:
  parent: humanoid
  attribute_adjustments: { str: 4, con: 2, int: -2, cha: -2 }
  abilities:
    - name: low_light_vision
      min_level: 0

# Ogre-mage: a large, cunning spellcaster-brute. +8 Str, +6 Con, +2 Int/Cha,
# low-light vision. Large / speed 30 from humanoid. Its innate magic
# (invisibility, flight, regeneration, cone of cold) is run by the DM.
oni:
  parent: humanoid
  size: large
  attribute_adjustments: { str: 8, con: 6, int: 2, cha: 2 }
  abilities:
    - name: low_light_vision
      min_level: 0

# Serpent-haired gazer. +2 Dex, +4 Cha. Medium / speed 30 from humanoid.
# The petrifying gaze is run as a DM-narrated effect, not a coded ability.
medusa:
  parent: humanoid
  attribute_adjustments: { dex: 2, cha: 4 }
  abilities: []

# --- Fey races ---------------------------------------------------------

fey:
  size: small
  speed: 30
  abilities: []

# A fey race (parent: fey). Not playable. Size set to medium — the noble
# Sidhe are human-sized, unlike the small fey root.
sidhe:
  parent: fey
  size: medium
  attribute_adjustments:
    dex: 2
    cha: 2
  abilities: []

# --- Animal races ------------------------------------------------------
# `beast` is the root Animal race; every beast is one of its subtypes
# (canine, spider, ...). Subtypes set their own speed and grant a Natural
# Attack Talent (Canine Bite / Spider Bite) whose `grants_equipment` names
# the Bite weapon in the Equipment catalog. The bite is offered as an
# attack but is never carried as an inventory item.

beast:
  size: medium
  speed: 30
  abilities: []

# Size-keyed beast templates. Every beast inherits its attribute
# adjustments from one of these and then its concrete subtype
# (canine, spider, ...) layers on speed and a Natural Attack. All
# beasts take -8 Int (the min-1 Effective Attribute clamp keeps the
# score at 1) and -4 Wis/Cha.
tiny_beast:
  parent: beast
  size: tiny
  attribute_adjustments: { str: -6, con: -6, dex: 6, wis: -4, cha: -4, int: -8 }

small_beast:
  parent: beast
  size: small
  attribute_adjustments: { str: -4, con: -4, dex: 4, wis: -4, cha: -4, int: -8 }

medium_beast:
  parent: beast
  size: medium
  attribute_adjustments: { dex: 2, wis: -4, cha: -4, int: -8 }

large_beast:
  parent: beast
  size: large
  attribute_adjustments: { str: 4, con: 4, wis: -4, cha: -4, int: -8 }
  abilities:
    - name: natural_armor_2
      min_level: 0

canine:
  parent: medium_beast
  speed: 40
  abilities:
    - name: Canine Bite
      min_level: 0

spider:
  parent: medium_beast
  speed: 20
  abilities:
    - name: Spider Bite
      min_level: 0

# A large man-eating ape (parent: large_beast). Inherits +4 Str/Con and
# natural_armor_2. Roams the hill fort hunting prisoners. Tears into prey
# with a powerful Slam and a crushing Bite.
carnivorous_ape:
  parent: large_beast
  size: large
  abilities:
    - name: Ape Slam
      min_level: 0
    - name: Ape Bite
      min_level: 0

# A fort guard-hound (parent: canine). +2 Str/Con over the canine baseline;
# inherits the Canine Bite.
war_dog:
  parent: canine
  attribute_adjustments: { str: 2, con: 2 }

# A burrowing, acid-spitting ambusher that erupts from beneath the hill
# fort's courtyard mud. Parented to the `beast` root (not large_beast) so
# its hand-set stat block stands as written, without the bestial -8 Int.
# Large, with a tough carapace (natural armor), an acid-sheathed Bite
# (Ankheg Bite), and a once-per-encounter acid spit. The spit and the
# carapace/belly AC split are run by the DM.
ankheg:
  parent: beast
  size: large
  abilities:
    - name: natural_armor_2
      min_level: 0
    - name: Ankheg Bite
      min_level: 0
    - name: spit_acid
      min_level: 0

# A large, frost-breathing dire wolf. Parented to the `beast` root (not
# large_beast) so it keeps a near-human cunning: only -2 Int, not the
# bestial -8. +6 Str / +4 Con, speed 50, natural armor, and a Bite. Its
# frost breath is run by the DM.
winter_wolf:
  parent: beast
  size: large
  speed: 50
  attribute_adjustments: { str: 6, con: 4, int: -2 }
  abilities:
    - name: natural_armor_2
      min_level: 0
    - name: Canine Bite
      min_level: 0
    - name: frost_breath
      min_level: 0
