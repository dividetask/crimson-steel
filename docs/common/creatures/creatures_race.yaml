# Creature Race Configuration
#
# Each entry is a Race Entry. A Creature's `race:` field names one entry;
# the catalog walks the entry's `parent:` chain (leaf → root) to resolve
# the effective Race. Field rules during chain walk:
#   first-in-chain wins: size, speed
#   accumulate: attribute_adjustments
#   concatenate-with-dedup (child wins on duplicate name): abilities
#
# `abilities` lists support context entries — a bare `{min_level: N}`
# becomes the rolling default `min_level` for following ability
# entries until the next context entry. Context entries are
# flattened at config-load time.
#
# The shipped entries below are placeholders — sizes and speeds are
# set where tests or example data depend on them; attribute_adjustments
# and abilities are left empty for the campaign to fill in.

# --- Roots -------------------------------------------------------------

humanoid:
  size: medium
  speed: 30

undead:
  size: medium
  speed: 30
  abilities:
    - name: undead_traits
      min_level: 0

# --- Humanoid races ----------------------------------------------------
human:
  parent: humanoid
  attribute_adjustments:
    all: 1
  abilities: []

dwarf:
  parent: humanoid
  speed: 20
  abilities:
    - name: poison_resistance
      min_level: 0

hill_dwarf:
  parent: dwarf
  attribute_adjustments:
    con: 2
    wis: 2
  abilities: []

mountain_dwarf:
  parent: dwarf
  attribute_adjustments:
    str: 2
    con: 2
  abilities: []

elf:
  parent: humanoid
  abilities:
    - name: enchantment_resistance
      min_level: 0

high_elf:
  parent: elf
  attribute_adjustments:
    dex: 2
    int: 2
  abilities: []

wood_elf:
  parent: elf
  speed: 35
  attribute_adjustments:
    dex: 2
    wis: 2
  abilities: []

# Not a playable sub-race (absent from character_creation.yaml's
# Playable Races) — exists for NPCs such as the Eladrin nobles.
eladrin:
  parent: elf
  attribute_adjustments:
    dex: 2
    cha: 2
  abilities: []

gnome:
  parent: humanoid
  size: small
  speed: 25
  abilities: []

forest_gnome:
  parent: gnome
  attribute_adjustments:
    dex: 2
    int: 2
  abilities: []

rock_gnome:
  parent: gnome
  attribute_adjustments:
    con: 2
    int: 2
  abilities: []

half_elf:
  parent: humanoid
  abilities: []

half_orc:
  parent: humanoid
  abilities: []

halfling:
  parent: humanoid
  speed: 25
  attribute_adjustments:
    cha: 2
    dex: 2
  abilities: []

satyr:
  parent: humanoid
  speed: 35
  attribute_adjustments:
    dex: 2
    cha: 2
  abilities:
    - name: enchantment_resistance
      min_level: 0

goblin:
  parent: humanoid
  size: small
  speed: 25
  abilities: []

# --- Fey races ---------------------------------------------------------

fey:
  size: small
  speed: 30
  abilities: []

# A fey race (parent: fey). Not playable. Size set to medium — the noble
# Sidhe are human-sized, unlike the small fey root.
sidhe:
  parent: fey
  size: medium
  attribute_adjustments:
    dex: 2
    cha: 2
  abilities: []

sprite:
  parent: fey
  size: tiny
  speed: 20
  abilities: []

pixie:
  parent: fey
  size: tiny
  speed: 20
  abilities: []

dryad:
  parent: fey
  size: medium
  speed: 30
  abilities: []

brownie:
  parent: fey
  size: small
  speed: 25
  abilities: []

# --- Animal races ------------------------------------------------------
# `beast` is the root Animal race; every beast is one of its subtypes
# (canine, spider, ...). Subtypes set their own speed and grant a Natural
# Attack Talent (Canine Bite / Spider Bite) whose `grants_equipment` names
# the Bite weapon in the Equipment catalog. The bite is offered as an
# attack but is never carried as an inventory item.

beast:
  size: medium
  speed: 30
  abilities: []

canine:
  parent: beast
  speed: 40
  abilities:
    - name: Canine Bite
      min_level: 0

spider:
  parent: beast
  speed: 20
  abilities:
    - name: Spider Bite
      min_level: 0
