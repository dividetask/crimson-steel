# Creature Race Configuration
#
# Each entry is a Race Entry. A Creature's `race:` field names one entry;
# the catalog walks the entry's `parent:` chain (leaf → root) to resolve
# the effective Race. Field rules during chain walk:
#   first-in-chain wins: size, speed
#   accumulate: attribute_adjustments
#   concatenate-with-dedup (child wins on duplicate name): abilities
#
# `abilities` lists support context entries — a bare `{min_level: N}`
# becomes the rolling default `min_level` for following ability
# entries until the next context entry. Context entries are
# flattened at config-load time.
#
# The shipped entries below are placeholders — sizes and speeds are
# set where tests or example data depend on them; attribute_adjustments
# and abilities are left empty for the campaign to fill in.

# --- Roots -------------------------------------------------------------

