# Rise of the Slavelords — Creature Templates
#
# Crimson Steel's Rise-of-the-Slavelords campaign cast: slaver
# captains, lieutenants, merchant escorts, and the orc / half-orc
# soldiers they travel with. Pairs with the Caravan Ambush and
# Stockade Patrol random encounter tables in random_encounter_tables.yaml.
#
# Loaded via the standard creatures_data_*.example.{yaml,json} glob.
# Each template's `tags` include `enemy_template` plus
# `category:rise_of_the_slavelords`.

name: Rise of the Slavelords

characters:

  - id: 350
    name: Slaver Merchant
    metadata:
      creature_token: "/images/icons/human token.webp"
    group: enemy
    tags: [enemy_template, category:rise_of_the_slavelords]
    race: human
    attributes: { str: 12, dex: 12, con: 12, int: 13, wis: 11, cha: 14 }
    advancement:
      classes:
        rogue: 2

  - id: 351
    name: Slaver Lieutenant
    metadata:
      creature_token: "/images/icons/human token.webp"
    group: enemy
    tags: [enemy_template, category:rise_of_the_slavelords]
    race: human
    attributes: { str: 15, dex: 13, con: 14, int: 11, wis: 11, cha: 12 }
    advancement:
      classes:
        fighter: 3

  - id: 352
    name: Half-Orc Soldier
    metadata:
      creature_token: "/images/icons/orc rogue.webp"
    group: enemy
    tags: [enemy_template, category:rise_of_the_slavelords]
    race: half_orc
    attributes: { str: 15, dex: 12, con: 14, int: 9, wis: 10, cha: 8 }
    advancement:
      classes:
        fighter: 1

  - id: 353
    name: Orc Interpreter
    metadata:
      creature_token: "/images/icons/orc rogue.webp"
    group: enemy
    tags: [enemy_template, category:rise_of_the_slavelords]
    race: half_orc
    attributes: { str: 12, dex: 12, con: 12, int: 12, wis: 10, cha: 10 }
    advancement:
      classes:
        rogue: 1

  - id: 354
    name: Stockade Guard
    metadata:
      creature_token: "/images/icons/human token.webp"
    group: enemy
    tags: [enemy_template, category:rise_of_the_slavelords]
    race: human
    attributes: { str: 14, dex: 12, con: 14, int: 10, wis: 12, cha: 10 }
    advancement:
      classes:
        fighter: 2

  # Tier-1 slaver. Race is rolled at spawn (50% orc, else equal
  # human/elf/dwarf) via race_table; base 10s before racial modifiers and
  # the Tier-1 inherent bonus. Gear (race-aware) is rolled from the
  # slaver_loadout Equipment Loot Table. All slavers worship Mortheth.
  - id: 355
    name: Slaver
    metadata:
      creature_token: "/images/icons/human token.webp"
      deity: Mortheth
    group: enemy
    tags: [enemy_template, category:rise_of_the_slavelords]
    race: orc
    tier: 1
    attributes: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 }
    advancement:
      classes:
        warrior: 1
    equipment_table: slaver_loadout
    race_table:
      - { race: orc,   chance: 0.5 }
      - { race: human, chance: 0.1667 }
      - { race: elf,   chance: 0.1667 }
      - { race: dwarf, chance: 0.1666 }
