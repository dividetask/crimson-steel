# Creature Advancement Configuration

# Tier breakpoint lists keyed by Tag. Index 0 is the Total Class
# Level required to reach Tier 0 (always 0); index 1 is the level
# required for Tier 1, etc. A Creature with multiple matching Tags
# takes the MAXIMUM Tier across them. A Creature with no Tag that
# matches any list here takes the MINIMUM Tier across every list
# (the cautious fallback for an unclassified Creature).
Tier Breakpoints:
  player_character: [0, 1, 4, 8, 16, 30]
  hero:             [0, 1, 4, 8, 16, 30]
  boss:             [0, 1, 4, 8, 16, 30]
  noble:            [0, 2, 5, 9, 12, 20]
  commoner:         [0, 4, 12, 16, 25, 40]
  animal:           [0, 4, 8, 12, 16, 20]

# Class definitions. Each Class declares its progression rules
# (bonus_skills, mana_per_level), Save Attribute categorization,
# proficiency lists, and ability_progression.
#
# Proficiency lists use the project's three Proficiency Categories:
#   - Aligned (the fast rate, formula in creatures_config.yaml)
#   - Unaligned (the medium rate)
#   - Opposed (the slow rate)
#
# A Class declares EXACTLY ONE of `aligned_proficiencies` or
# `unaligned_proficiencies` at the root — that declaration sets the
# default rule for unmentioned Skills. `opposed_proficiencies` is
# always an explicit override list.
#
# Saves declare their Aligned and Opposed lists explicitly. Every
# Save Attribute that doesn't appear in either list is Unaligned by
# the default rule that applies when `aligned` (or `opposed`) is
# named — but the project convention is to enumerate all six.
#
# Archetypes (a Class with `parent_class:`) inherit absent fields
# from their parent and override or extend the per-category lists.
# A Creature cannot hold levels in both a parent Class and one of
# its Archetypes simultaneously — see Archetype Exclusivity in the
# design.
#
# Skill lists may name bare Set Skill keys (ending `_`); a Set
# Instance whose prefix matches the list is treated the same way.
#
# Spellcasting Classes additionally declare a `spell_selection` block
# that drives the Character Creation Spell Selection step. Fields:
#   mode    — one of:
#               points  the Creature spends a point pool on spells; each
#                       spell costs `cost` points (a formula in `tier`).
#               count   the Creature picks a fixed NUMBER of spells.
#               tiered_count  the Creature picks a number of spells of EACH
#                       Spell Tier (Bard). `tiers` lists the Tiers tracked and
#                       `by_level` gives the per-Tier counts at each class
#                       level (positional with `tiers`); creation uses the
#                       CREATION_LEVEL row as the per-Tier caps.
#               domain  the Creature picks a deity + domain instead of
#                       individual spells (Cleric); the domain's spell
#                       list is granted via deities.yaml.
#               auto    every spell matching `filter` is granted
#                       automatically; the Creature picks nothing and the
#                       Spell Selection step is skipped.
#   budget  — formula in `level` giving the point pool (points) or the
#             number of spells (count). Evaluated at the Creature's level.
#   cost    — points mode only: formula in `tier` for one spell's cost.
#             The result is floored to an integer, so a Tier 0 spell
#             costs 1 (not 1.5).
#   tiers / by_level — tiered_count mode only: the Spell Tiers tracked and the
#             number of each known per class level (see the Bard).
#   filter  — which Catalog spells are selectable. `any` allows every
#             spell; otherwise the value is a casting-skill key and a
#             spell qualifies when one of its `skills` starts with it
#             (e.g. `perform` matches the `perform_` Set Skill).
# A Class with no `spell_selection` block is a non-caster and the Spell
# Selection step is skipped for it.

Classes:

  barbarian:
    martial_advancement: aligned
    bonus_skills: 2
    mana_per_level: 1
    saves:
      aligned: []
      opposed: [dex, int, wis, cha]
    ability_progression:
      "1": [rage, fast_movement]
      "2": [uncanny_dodge, primal_tenacity, combat_feat]
    aligned_proficiencies:
      - animal_handling
      - athletics
      - craft_
      - healing
      - intimidate
      - nature
      - perception

  berserker:
    parent_class: barbarian
    ability_progression:
      "3": [reckless_attacks]
      "4": [mindless_rage]

  weretouched_barbarian:
    parent_class: barbarian
    ability_progression:
      "3": [lycanthropic_rage]
      "5": [lycanthropic_resistance]

  bloodrager:
    parent_class: barbarian
    martial_advancement: unaligned
    mana_per_level: 2
    ability_progression:
      "3": [bloodrager_spellcasting]
    aligned_proficiencies:
      - evocation
    spell_selection:
      mode: tiered_count
      filter: arcana
      tiers: [0, 1]
      by_level:
        "1": [0, 0]
        "2": [0, 0]
        "3": [3, 1]
        "4": [4, 1]
        "5": [5, 1]
        "6": [6, 2]

  bard:
    martial_advancement: unaligned
    bonus_skills: 4
    mana_per_level: 2
    saves:
      aligned: []
      opposed: [str, con, int, wis]
    ability_progression:
      "1": [magical_performance, bardic_spellcasting, bardic_inspiration]
      "2": [jack_of_all_trades, better_lucky_than_good, performance_feat]
      "3": [silver_tongue, unsettling_words]
      "4": [versatile_performance]
    unaligned_proficiencies:
      - restricted_magic
      - survival
    spell_selection:
      mode: tiered_count
      filter: perform
      tiers: [0, 1, 2]
      by_level:
        "1": [4, 2, 0]
        "2": [5, 3, 0]
        "3": [6, 4, 0]
        "4": [6, 5, 0]
        "5": [6, 6, 0]
        "6": [6, 6, 2]

  cleric:
    martial_advancement: unaligned
    bonus_skills: 2
    mana_per_level: 4
    saves:
      aligned: []
      opposed: [str, dex, con, int]
    ability_progression:
      "1": [see_injury, improved_healing, domain]
      "2": [channel_divinity, turn_undead, casting_feat]
      "5": [destroy_undead]
    granted_spells:
      - Heal
      - Ward
      - Standard Surgery
    spell_selection:
      mode: domain
    aligned_proficiencies:
      - appraisal
      - arcana
      - craft_
      - invocation
      - history
      - invocation
      - linguistics
      - nobility
      - persuasion
      - planes
      - profession_
      - restricted_magic
      - religion
      - sense_motive

  druid:
    martial_advancement: unaligned
    bonus_skills: 4
    mana_per_level: 4
    saves:
      aligned: []
      opposed: [str, dex, con, cha]
    ability_progression:
      "1": [druidic_spellcasting]
    spell_selection:
      mode: auto
      filter: nature
    aligned_proficiencies:
      - animal_handling
      - healing
      - nature
      - perception
      - religion
      - survival

  fighter:
    martial_advancement: aligned
    bonus_skills: 2
    mana_per_level: 1
    saves:
      aligned: []
      opposed: [dex, int, wis, cha]
    ability_progression:
      "1": [weapon_training, armor_training]
    aligned_proficiencies:
      - acrobatics
      - animal_handling
      - athletics
      - history
      - intimidate
      - nature
      - perception

  warrior:
    npc_class: true
    martial_advancement: aligned
    bonus_skills: 2
    mana_per_level: 1
    saves:
      aligned: []
      opposed: [dex, int, wis, cha]
    aligned_proficiencies:
      - acrobatics
      - animal_handling
      - athletics
      - history
      - intimidate
      - nature
      - perception

  feral:
    npc_class: true
    martial_advancement: aligned
    bonus_skills: 2
    mana_per_level: 1
    saves:
      aligned: []
      opposed: [dex, int, wis, cha]
    aligned_proficiencies:
      - acrobatics
      - animal_handling
      - athletics
      - history
      - intimidate
      - nature
      - perception

  rogue:
    martial_advancement: unaligned
    bonus_skills: 4
    mana_per_level: 1
    saves:
      aligned: []
      opposed: [str, con, wis, cha]
    ability_progression:
      "1": [trapfinding, sneak_attack, thieves_cant]
      "2": [danger_sense]
    unaligned_proficiencies:
      - arcana
      - healing
      - nature
      - religion
      - restricted_magic
      - survival

  arcane_trickster:
    parent_class: rogue
    bonus_skills: 4
    mana_per_level: 2
    ability_progression:
      "3": [arcane_spellcasting, combat_trickery, mage_hand_legerdemain]
    aligned_proficiencies:
      - arcana
    spell_selection:
      mode: tiered_count
      filter: any
      tiers: [0, 1]
      by_level:
        "1": [0, 0]
        "2": [0, 0]
        "3": [3, 3]
        "4": [4, 3]
        "5": [4, 4]

  poisoner:
    parent_class: rogue
    ability_progression:
      "3": [precise_poisoner, poison_crafter]

  ranger:
    parent_class: druid
    martial_advancement: aligned

  monk:
    martial_advancement: aligned
    bonus_skills: 4
    mana_per_level: 2
    saves:
      aligned: []
      opposed: [str, con, int, cha]
    ability_progression:
      "1": [stunning_strike, ki_pool]
    aligned_proficiencies:
      - acrobatics
      - athletics
      - perception
      - sense_motive
      - stealth

  wizard:
    martial_advancement: opposed
    bonus_skills: 2
    mana_per_level: 4
    saves:
      aligned: []
      opposed: [str, dex, con, cha]
    ability_progression:
      "1": [arcane_spellcasting]
    spell_selection:
      mode: points
      budget: "5 + level * level"
      cost: "1 + tier"
      filter: any
    aligned_proficiencies:
      - arcana
      - history
      - investigation
      - linguistics
      - planes
      - religion

  sorcerer:
    martial_advancement: opposed
    bonus_skills: 2
    mana_per_level: 4
    saves:
      aligned: [con, cha]
      opposed: [str, dex, int, wis]
    ability_progression:
      "1": [arcane_spellcasting]
    spell_selection:
      mode: count
      budget: "4 * level"
      filter: any
    aligned_proficiencies:
      - arcana
      - deception
      - intimidate
      - persuasion
      - planes
      - religion

  commoner:
    npc_class: true
    martial_advancement: opposed
    bonus_skills: 2
    mana_per_level: 0
    saves:
      aligned: []
      opposed: [dex, int, wis, cha]
    aligned_proficiencies:
      - athletics
      - craft_
      - perception
      - profession_

  paragon:
    npc_class: true
    martial_advancement: aligned
    bonus_skills: 4
    mana_per_level: 1
    saves:
      aligned: [str, con]
      opposed: [dex, int, wis, cha]
    aligned_proficiencies:
      - athletics
      - acrobatics
      - escape_artist
      - larceny
      - ride
      - sleight_of_hand
      - local_lore
      - stealth
      - arcana
      - history
      - investigation
      - healing
      - invocation
      - nature
      - perception
      - profession_
      - deception
      - disguise
      - perform_
      - persuasion
      - evocation

HP Formula:
  - "con / 2"   # Tier 0
  - "con"       # Tier 1
  - "2 * con"   # Tier 2
  - "3 * con"   # Tier 3
  - "4 * con"   # Tier 4
  - "5 * con"   # Tier 5

Mana Base Formula:
  - "int / 4"   # Tier 0
  - "int / 2"   # Tier 1
  - "int"       # Tier 2
  - "2 * int"   # Tier 3
  - "3 * int"   # Tier 4
  - "4 * int"   # Tier 5
