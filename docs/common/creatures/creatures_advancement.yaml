# Creature Advancement Configuration

# Tier breakpoint lists keyed by Tag. Index 0 is the Total Class
# Level required to reach Tier 0 (always 0); index 1 is the level
# required for Tier 1, etc. A Creature with multiple matching Tags
# takes the MAXIMUM Tier across them. A Creature with no Tag that
# matches any list here takes the MINIMUM Tier across every list
# (the cautious fallback for an unclassified Creature).
Tier Breakpoints:
  player_character: [0, 1, 4, 8, 16, 30]
  hero:             [0, 1, 4, 8, 16, 30]
  boss:             [0, 1, 4, 8, 16, 30]
  noble:            [0, 2, 5, 9, 12, 20]
  commoner:         [0, 4, 12, 16, 25, 40]
  animal:           [0, 4, 8, 12, 16, 20]

# Spell Tier Tracks. Class Level required to access Spells of each
# Tier, indexed Tier 0..5. A Class names its track via
# `spell_tier_track`; a single-class caster's accessible Spell Tier is
# the highest index whose breakpoint is ≤ its Class Level on that
# track. `null` means the Tier is never accessible on that track.
# The Fast track is identical to the `hero` Tier Breakpoints, so a
# single-class Fast caster's track-Tier equals its Creature Tier.
# Consumption (gating which Spells a caster may cast) is deferred —
# this is documented reference data only for now.
Spell Tier Tracks:
  fast:   [0, 1, 4, 8, 16, 30]
  medium: [0, 1, 6, 11, 19, 33]
  slow:   [3, 5, 9, 16, 33, null]

# Universal Granted Abilities. Every Creature gains these regardless
# of Race or Class. Surfaced by *Get Granted Abilities* with
# `source = universal`.
Universal Granted Abilities:
  - Power Strike

# Class definitions. Each Class declares its progression rules
# (bonus_skills, mana_per_level), Save Attribute categorization,
# proficiency lists, and ability_progression.
#
# Proficiency lists use the project's three Proficiency Categories:
#   - Aligned (the fast rate, formula in creatures_config.yaml)
#   - Unaligned (the medium rate)
#   - Opposed (the slow rate)
#
# A Class declares EXACTLY ONE of `aligned_proficiencies` or
# `unaligned_proficiencies` at the root — that declaration sets the
# default rule for unmentioned Skills. `opposed_proficiencies` is
# always an explicit override list.
#
# Saves declare their Aligned and Opposed lists explicitly. Every
# Save Attribute that doesn't appear in either list is Unaligned by
# the default rule that applies when `aligned` (or `opposed`) is
# named — but the project convention is to enumerate all six.
#
# Archetypes (a Class with `parent_class:`) inherit absent fields
# from their parent and override or extend the per-category lists.
# A Creature cannot hold levels in both a parent Class and one of
# its Archetypes simultaneously — see Archetype Exclusivity in the
# design.
#
# Martial is a Skill (catalog entry in proficiencies/skills.yaml).
# Each Class categorizes it like any other Skill — there is no
# separate `martial_advancement` field. Per-weapon and per-armor
# bonuses come from Abilities (Weapon Training, Armor Training,
# etc.) as Modifier entries on the Granted Ability.
#
# Skill lists may name bare Set Skill keys (ending `_`); a Set
# Instance whose prefix matches the list is treated the same way.

Classes:

  barbarian:
    martial_advancement: aligned
    bonus_skills: 2
    mana_per_level: 1
    saves:
      aligned: [str, con]
      opposed: [dex, int, wis, cha]
    ability_progression:
      "1": [rage, fast_movement, reckless_attacks]
      "2": [uncanny_dodge, primal_tenacity, combat_feat]
      "3": [mindless_rage]
    aligned_proficiencies:
      - animal_handling
      - athletics
      - craft_
      - healing
      - intimidate
      - nature
      - perception

  bard:
    martial_advancement: unaligned
    bonus_skills: 4
    mana_per_level: 2
    spell_tier_track: medium
    saves:
      aligned: [dex, cha]
      opposed: [str, con, int, wis]
    ability_progression:
      "1": [magical_performance, bardic_spellcasting, bardic_inspiration]
      "2": [jack_of_all_trades, better_lucky_than_good, performance_feat]
      "3": [silver_tongue, unsettling_words]
      "4": [versatile_performance]
    unaligned_proficiencies:
      - restricted_magic
      - survival

  cleric:
    martial_advancement: unaligned
    bonus_skills: 2
    mana_per_level: 4
    spell_tier_track: fast
    saves:
      aligned: [wis, cha]
      opposed: [str, dex, con, int]
    ability_progression:
      "1": [see_injury, improved_healing, combat_healing, domain]
      "2": [channel_divinity, turn_undead, casting_feat]
    granted_spells:
      # Every Cleric gains these regardless of deity / domain.
      - Heal
      - Ward
      - Standard Surgery
    # Domain-specific spells are looked up via the Creature's `choices.deity`
    # and `choices.domain` keys against `creatures/deities.yaml`.
    aligned_proficiencies:
      - appraisal
      - arcana
      - craft_
      - healing
      - history
      - linguistics
      - nobility
      - persuasion
      - planes
      - profession_
      - restricted_magic
      - religion
      - sense_motive

  druid:
    martial_advancement: unaligned
    bonus_skills: 4
    mana_per_level: 2
    spell_tier_track: fast
    saves:
      aligned: [int, wis]
      opposed: [str, dex, con, cha]
    ability_progression:
      "1": [druidic_spellcasting, wild_kinship, favored_terrain]
    # Wild Kinship is the umbrella animal-bond system: the Druid picks an
    # animal at Class Levels 1, 2, 4, 8, and 16 (order matters — unlock
    # cadence and speed advancement walk the list). The animal catalog
    # (`creatures/druid_animals.yaml`) is provided separately.
    granted_spells:
      - Speak with Plants
      - Speak with Animals
      - Command Animal
      - Call Animal
      - Animal Eyes
      - Bark Skin
      - Regeneration
      - Entangle
    aligned_proficiencies:
      - animal_handling
      - healing
      - nature
      - perception
      - religion
      - survival

  # Archetype of Druid. Inherits the Druid's progression and adds an
  # Animal Companion at Class Level 4; overrides mana_per_level up to 4.
  # Picks a single Cleric domain via `choices.domain` from this
  # restricted list: Light, Darkness, Life, Death, Chaos, Healing,
  # Plague, Nature, Tempest, Travel, Strength, Peace, Protection,
  # Vengeance, Truth, Trickery, Madness, Ruin.
  domain_druid:
    parent_class: druid
    mana_per_level: 4
    ability_progression:
      "4": [animal_companion]

  # Archetype of Druid. Inherits the Druid's progression and adds the
  # Hybrid Form extension to Wild Kinship at Class Level 4; overrides
  # martial_advancement to aligned.
  weredruid:
    parent_class: druid
    martial_advancement: aligned
    ability_progression:
      "4": [hybrid_form]

  fighter:
    martial_advancement: aligned
    bonus_skills: 2
    mana_per_level: 1
    saves:
      aligned: [str, con]
      opposed: [dex, int, wis, cha]
    ability_progression:
      "1": [weapon_training, armor_training]
      "2": [ignore_pain]
    aligned_proficiencies:
      - acrobatics
      - animal_handling
      - athletics
      - history
      - intimidate
      - nature
      - perception

  ranger:
    martial_advancement: aligned
    bonus_skills: 4
    mana_per_level: 2
    spell_tier_track: slow
    saves:
      aligned: [str, dex]
      opposed: [con, int, wis, cha]
    ability_progression:
      "1": [ranger_spellcasting]
    aligned_proficiencies:
      - animal_handling
      - athletics
      - healing
      - nature
      - perception
      - stealth
      - survival

  rogue:
    martial_advancement: unaligned
    bonus_skills: 4
    mana_per_level: 1
    saves:
      aligned: [dex, int]
      opposed: [str, con, wis, cha]
    ability_progression:
      "1": [trapfinding, sneak_attack, thieves_cant]
      "2": [danger_sense]
    unaligned_proficiencies:
      - arcana
      - healing
      - nature
      - religion
      - restricted_magic
      - survival

  arcane_trickster:
    parent_class: rogue
    bonus_skills: 4
    mana_per_level: 2
    ability_progression:
      "1": [arcane_spellcasting]
      "2": [combat_trickery, mage_hand_legerdemain]
    aligned_proficiencies:
      - arcana

  monk:
    martial_advancement: aligned
    bonus_skills: 4
    mana_per_level: 2
    saves:
      aligned: [dex, str]
      opposed: [con, int, wis, cha]
    ability_progression:
      "1": [unarmored_movement, unarmed_parry, flurry_of_blows, mystic_strike]
      "2": [counter_strike, evasion, danger_sense]
      "4": [imbued_strike]
    aligned_proficiencies:
      - acrobatics
      - athletics
      - perception
      - sense_motive
      - stealth

  wizard:
    martial_advancement: opposed
    bonus_skills: 2
    mana_per_level: 4
    spell_tier_track: fast
    saves:
      aligned: [int, wis]
      opposed: [str, dex, con, cha]
    ability_progression:
      "1": [arcane_spellcasting]
    aligned_proficiencies:
      - arcana
      - history
      - investigation
      - linguistics
      - planes
      - religion

  healer:
    martial_advancement: unaligned
    bonus_skills: 2
    mana_per_level: 4
    spell_tier_track: fast
    saves:
      aligned: [wis, int]
      opposed: [str, dex, con, cha]
    ability_progression:
      "1": [see_injury, improved_healing, healers_satchel]
    granted_spells:
      # Plus future healing-tagged Spells.
      - Heal
      - Standard Surgery
    aligned_proficiencies:
      - craft_
      - healing
      - history
      - nature
      - religion
      - sense_motive

  sorcerer:
    martial_advancement: opposed
    bonus_skills: 2
    mana_per_level: 4
    spell_tier_track: fast
    saves:
      aligned: [con, cha]
      opposed: [str, dex, int, wis]
    ability_progression:
      "1": [evocation_spellcasting]
    # Casts via the `evocation` skill only (not arcana); knows 4 Spells
    # per accessible Tier. Picks live under `choices.spellcasting`.
    aligned_proficiencies:
      - arcana
      - evocation
      - history
      - linguistics
      - persuasion
      - planes

  artificer:
    martial_advancement: unaligned
    bonus_skills: 2
    mana_per_level: 4
    spell_tier_track: fast
    saves:
      aligned: [int, wis]
      opposed: [str, dex, con, cha]
    ability_progression:
      "1": [temp_scroll_creation, ritual_gold_waiver]
    # Casts via inscribed temporary scrolls; does not learn normal
    # arcane_spellcasting.
    aligned_proficiencies:
      - appraisal
      - arcana
      - craft_
      - history
      - investigation
      - linguistics
      - planes
      - profession_

  # NPC-only Class. No ability_progression.
  noble:
    martial_advancement: unaligned
    bonus_skills: 4
    mana_per_level: 2
    saves:
      aligned: [wis, cha]
      opposed: [str, dex, con, int]
    aligned_proficiencies:
      - appraisal
      - deception
      - history
      - linguistics
      - nobility
      - perform_
      - persuasion
      - restricted_magic
      - ride
      - sense_motive

  # NPC-only Class. No ability_progression.
  serf:
    martial_advancement: opposed
    bonus_skills: 2
    mana_per_level: 1
    saves:
      aligned: [str, con]
      opposed: [dex, int, wis, cha]
    aligned_proficiencies:
      - athletics
      - craft_
      - profession_

  # NPC-only Class. No ability_progression.
  expert:
    martial_advancement: unaligned
    bonus_skills: 6
    mana_per_level: 2
    saves:
      aligned: [int, cha]
      opposed: [str, dex, con, wis]
    aligned_proficiencies:
      - appraisal
      - craft_
      - healing
      - investigation
      - linguistics
      - perception
      - profession_
      - sense_motive

# HP and Mana formulas, indexed by Tier. The string is evaluated
# against the Creature's Effective Attributes (`str`, `dex`, ...);
# `tier` follows the project-wide Tier 0 → 0.5 convention. Result
# is floored.
#
# `mana_per_level` on each Class contributes additively on top of
# the per-Tier Mana base formula.
HP Formula:
  - "con / 2"   # Tier 0
  - "con"       # Tier 1
  - "2 * con"   # Tier 2
  - "3 * con"   # Tier 3
  - "4 * con"   # Tier 4
  - "5 * con"   # Tier 5

Mana Base Formula:
  - "int / 4"   # Tier 0
  - "int / 2"   # Tier 1
  - "int"       # Tier 2
  - "2 * int"   # Tier 3
  - "3 * int"   # Tier 4
  - "4 * int"   # Tier 5
