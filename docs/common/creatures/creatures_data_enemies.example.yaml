# Crimson Steel — Enemy roster (example data).
#
# Holds two kinds of entries (both share the same schema):
#
#   * Enemy templates — long-lived catalog entries that Random Encounter Tables
#     and the DM enemy sidebar reference. Tagged `enemy_template` plus
#     one or more `category:<bucket>` tags. Conventionally id 100..999.
#
#   * Spawned enemies — instance records created when an Random Encounter Table
#     resolves or the DM adds a creature from a template. Each spawn is
#     a distinct Creature with its own ID (no two Combatants share a
#     Creature record). Spawns are typically deleted by the post-combat
#     loot stub (Equipment) once the DM marks them for removal. They
#     conventionally start at id 1000.
#
# See `creatures_data_pcs.example.yaml` for the full Creature schema.

characters:

  - id: 100
    name: Pirate
    metadata:
      creature_token: "/images/icons/human token.png"
    group: enemy
    tags: [enemy_template, category:general]
    race: human
