# Fey Favors — Creature Templates
#
# Crimson Steel's fey campaign cast: low-CR Tier-1 sprites, pixies,
# dryads, and brownies. The "Favors" theme leans on bargains the
# party can strike with the fey — most encounters from this bucket
# resolve through Persuasion / Insight checks rather than combat.
#
# Loaded via the standard creatures_data_*.example.{yaml,json} glob.
# Each template's `tags` include `enemy_template` plus
# `category:fey_favors`.

name: Fey Favors

characters:

