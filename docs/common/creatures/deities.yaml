# Deities and Domains catalog.
#
# Two top-level catalogs:
#
#   Domains: domain name -> { spells: [list], channel_divinity: <name> }
#     The full set of domains a Cleric may draw from, independent of
#     deity. `spells` are the domain's bonus spells (granted to any
#     Cleric who picks the domain). `channel_divinity` names the
#     domain's 1st-level Channel Divinity Talent (see talents.yaml);
#     it is granted ONLY when the domain is one of the Cleric's own
#     deity's `domains`. A domain with no `spells`/`channel_divinity`
#     has not been mechanically defined yet.
#
#   Deities: deity name -> { domains: [list], anathema: [list],
#                            channel_divinity: <name> }
#     `domains` are the deity's favored domains; `anathema` are the
#     domains opposed to the deity, which its Clerics may NOT choose.
#     `channel_divinity` names the deity's 4th-level Channel Divinity
#     Talent, granted at Cleric level 4.
#
# Cleric domain rules:
#   - A Cleric chooses three domains (`choices.domains: [a, b, c]`;
#     the legacy single `choices.domain: a` is still accepted).
#   - Every chosen domain grants its `spells`.
#   - A chosen domain that is one of the deity's `domains` ALSO grants
#     that domain's `channel_divinity` Talent.
#   - A chosen domain that is NOT one of the deity's `domains` grants
#     spells only (no Channel Divinity).
#   - A Cleric may not choose a domain in the deity's `anathema`.
#   - At Cleric level 4 the Cleric gains the deity's `channel_divinity`.
#
# Channel Divinity mana: every Channel Divinity Talent costs 1 mana
# (inherited from the base Channel Divinity Talent) except a deity's
# 4th-level Channel Divinity, which costs 4.

Domains:
  Artifice: {}
  Chaos:
    channel_divinity: Touch of Chaos
  Cunning: {}
  Darkness: {}
  Death: {}
  Despair: {}
  Earth: {}
  Fire:
    channel_divinity: Flame Devotion
  Glory:
    spells:
      - Trivial Ward
      - Lesser Ward
      - Standard Ward
      - Improved Ward
      - Advanced Ward
      - Superior Ward
    channel_divinity: Glorious Charge
  Greed: {}
  Healing:
    spells:
      - Heal Petty Wounds
      - Heal Lesser Wounds
      - Heal Simple Wounds
      - Heal Moderate Wounds
      - Heal Advanced Wounds
      - Heal Extreme Wounds
  Hearth: {}
  Hope: {}
  Humility: {}
  Knowledge: {}
  Life: {}
  Light: {}
  Madness: {}
  Nature: {}
  Order: {}
  Harmony: {}
  Plague: {}
  Protection: {}
  Ruin: {}
  Secrets: {}
  Strength:
    channel_divinity: Strength Devotion
  Tempest: {}
  Travel: {}
  Trickery: {}
  Truth: {}
  Vengeance: {}
  War:
    spells:
      - Divine Favor
      - Shield of Faith
      - Spiritual Hammer
      - Silence
      - Lesser Shield
      - Standard Shield
      - Greater Shield
    channel_divinity: Martial Devotion
  Water: {}
  Wisdom: {}

Deities:

  Karthak:
    domains: [Strength, Glory, Chaos, War, Fire]
    anathema: [Humility, Harmony, Despair, Knowledge, Cunning]
    channel_divinity: Karthak's Resolve

  Kesser:
    domains: [Hope, Chaos, Secrets, Greed]
    anathema: [Wisdom, Order, Hearth, Truth, Knowledge]
    channel_divinity: Kesser's Gambit
