# General Red Tier — Creature Templates
#
# Crimson Steel's "general use" Red Tier (Tier 1) enemy templates.
# Spiders, wolves, goblins, and cultists — the staple low-level
# adversaries the DM pulls from when stocking a generic encounter.
#
# Loaded via the standard creatures_data_*.example.{yaml,json} glob.
# Each template's `tags` include `enemy_template` plus
# `category:general_red_tier`; the Character Sheets page's Roster
# Sidebar uses that category tag to group templates and encounter
# tables under the matching heading.

name: General Red Tier

characters:

  - id: 300
    name: Medium Spider
    group: enemy
    tags: [enemy_template, category:general_red_tier]
    race: beast
    attributes: { str: 9, dex: 14, con: 11, int: 1, wis: 10, cha: 2 }
    advancement:
      classes:
