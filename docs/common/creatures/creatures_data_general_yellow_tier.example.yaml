# General Yellow Tier — Creature Templates
#
# Crimson Steel's "general use" Yellow Tier (Tier 2) enemy templates.
# Yellow is the Tier-2 band in the UI Tier Color mapping (red = Tier 0,
# orange = Tier 1, yellow = Tier 2; see docs/common/ui/ui_conventions.md).
# These are the step-up adversaries the DM reaches for once a Red or
# Orange Tier encounter no longer threatens the party.
#
# Loaded via the standard creatures_data_*.example.{yaml,json} glob.
# Each template's `tags` include `enemy_template` plus
# `category:general_yellow_tier`; the Character Sheets page's Roster
# Sidebar uses that category tag to group templates and encounter tables
# under the matching heading.

name: General Yellow Tier

characters:

  # The Cloaker — a Large aberration that lurks overhead disguised as a
  # hanging black cloak, then drops to engulf and smother lone prey. Stats
  # and abilities are adapted from the D&D 5e and Pathfinder stat blocks
  # (Damage Transfer, Moan, Phantasms / Shadow Shift, Engulf, blindsense),
  # rescaled to a Tier-2 threat. Its identity stats live on the `cloaker`
  # race entry (creatures_race.yaml), so the base attributes here are the
  # neutral 10s the race then adjusts. `tier: 2` is an explicit Tier
  # Override — the Cloaker reads as Yellow regardless of its Class Level.
  # The two Tier-2 chosen inherent bonuses go to Str and Dex (its crushing
  # smother-grab and gliding agility).
  - id: 320
    name: Cloaker
    metadata:
      creature_token: "/images/icons/Collection/Abberations/abberant prowler.png"
    group: enemy
    tags: [enemy_template, category:general_yellow_tier]
    race: cloaker
    tier: 2
    attributes: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 }
    advancement:
      classes:
        feral: 5
      tier_attribute_advancement: [str, dex]
