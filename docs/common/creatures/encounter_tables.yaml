# Encounter Tables — Catalog
#
# Loaded by the Creatures domain. Each entry: encounter table ID
# (snake_case) -> { name, category, rolls }. See `creatures_design.md`
# for the Encounter Table / Encounter Row / Spawn Ref schemas; row
# shapes (Guaranteed / Independent Chance / Weighted Choice / Gated
# Weighted Choice with `when` / `as`) mirror Equipment's Loot Roll
# Row.
#
# The `category` field associates each table with one of the
# template categories declared in the creatures_data_*.example.yaml
# files (e.g. `category:general_red_tier`). The Character Sheets
# page's Roster Sidebar groups templates and encounter tables by
# this category — both surface under the same heading.
#
# Rolling a table calls Roll Encounter, which calls Spawn Creature From
# Template once per concrete spawn. The new Creature IDs are returned
# to the caller, which is then expected to add each as a Combatant via
# Combat's Add Combatant.

slave_lords_caravan:
  name: "Caravan ambush"
  category: rise_of_the_slavelords
  rolls:
    # Always two grunts.
    - spawn:
        - template_id: "101"
          count: 2

    # 60% chance of a captain leading them.
    - chance: 0.6
      as: has_captain
      spawn:
        - template_id: "102"
          count: 1

    # If a captain showed up, also add a war-dog at his heels.
    - when: { has_captain: true }
      spawn:
        - template_id: "105"
          count: 1

    # Always a few slaves in tow — noncombatants.
    - spawn:
        - template_id: "104"
          count: "1d4 + 1"

