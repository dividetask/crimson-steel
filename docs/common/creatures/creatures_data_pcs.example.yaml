# Crimson Steel — Player Character roster (example data).
#
# This is one of three creatures data files (`creatures_data_*.example.yaml`)
# the Creatures domain loads. All three share a single integer ID space.
# PCs conventionally take ids 1..99; enemies 100..1999; NPCs 2000+.
# Loading is order-independent — IDs collide across files only by mistake.
#
# The party is four members — one each of Bard, Wizard, Cleric, and
# Barbarian. Other adventurers live in the NPC file.
#
# Schema (one entry per character under `characters:`):
#   id          integer, unique across all creatures_data files.
#   name        character name.
#   player      name of the player running the character (PC only).
#   race        race key matching races.yaml. Sub-races (hill_dwarf,
#               high_elf, …) inherit from their parent race.
#   tags        optional, default `[player_character]`. Tags matching
#               keys in advancement.yaml's `tier_advancement` contribute
#               a breakpoint list; highest tier wins. Descriptive tags
#               (NPC, Ally, Enemy) have no effect on tier.
#   tier        optional. Hardcodes the tier; bypasses Advancement.
#   attributes  six base ability scores (str, dex, con, int, wis, cha).
#   advancement optional. Tracks classes and tier-up choices. Keys:
#                 tier_attribute_advancement
#                   optional flat list of attribute keys — focused-bonus
#                   picks made at each tier-up, in order. The first
#                   `focused_attribute_count` are tier 2's, next chunk
#                   tier 3's, etc. May be pre-filled.
#                 classes
#                   map of class key (matching advancement.yaml) to:
#                     * integer — shorthand for level count, no skills.
#                     * map with:
#                         level   integer level in the class.
#                         skills  list of skill keys advancing.
#                         choices map. Per-Class catalog choices. Common
#                                 keys: `spellcasting: [<spell>, ...]` (the
#                                 spells the player picked for the class's
#                                 Spellcasting-type ability — Bardic
#                                 Spellcasting, Arcane Spellcasting, etc.),
#                                 `deity` + `domain` (Cleric), Bard's
#                                 Versatile Performance subject. Free-form
#                                 — the granting Class interprets each key.

characters:
  - id: 1
    name: Ash Windmere
    player: Sam
    race: human
    attributes:
      str: 10
      dex: 14
      con: 12
      int: 13
      wis: 16
