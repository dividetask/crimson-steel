# Random Encounter Tables — Catalog
#
# Loaded by the Creatures domain. Each entry: random encounter table
# ID (snake_case) -> { name, category, rolls }. See `creatures_design.md`
# for the Random Encounter Table / Random Encounter Row / Spawn Ref
# schemas; row shapes (Guaranteed / Independent Chance / Weighted
# Choice / Gated Weighted Choice with `when` / `as`) mirror Equipment's
# Loot Roll Row.
#
# The `category` field associates each table with one of the
# template categories declared in the creatures_data_*.example.yaml
# files (e.g. `category:general_red_tier`). The Character Sheets
# page's Roster Sidebar groups templates and Random Encounter Tables
# by this category — both surface under the same heading.
#
# Rolling a table calls Roll Random Encounter, which calls Spawn Creature From
# Template once per concrete spawn. The new Creature IDs are returned
# to the caller, which is then expected to add each as a Combatant via
# Combat's Add Combatant.

slave_lords_caravan:
  name: "Caravan ambush"
  category: rise_of_the_slavelords
  rolls:
    - spawn:
        - { template_id: "350", count: 1 }
    - spawn:
        - { template_id: "103", count: "1d4 + 2" }
    - chance: 0.5
      spawn:
        - { template_id: "108", count: "1d2" }
    - spawn:
        - { template_id: "353", count: 1 }
        - { template_id: "109", count: "1d2" }
    - spawn:
        - { template_id: "104", count: "1d4 + 1" }

