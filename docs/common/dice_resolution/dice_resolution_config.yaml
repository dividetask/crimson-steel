# Dice Resolution Configuration

# Number of sides on each die. All dice in the system use this value.
Die Size: 10

# Single-character labels for die values 10+ in an Dice Result String.
# Values 1-9 use '1'-'9'. Values 10+ use characters from this string.
# If this string is too short to cover every possible values then 
# instead use A,B,C … Z. Boot errors if encoding is non-monotonic
Dice Result String Encoding: "X"

# Default Target Number before any modifiers.
Base Target Number: 8

# Target Number Bounds. Bonuses below this become Starting Successes, 
# Penalties above this become Starting Failures (1 per overflow point).
Minimum Target Number: 3
Maximum Target Number: 9

# Lowest permitted Dice Count, and the range of Dice Count
# Maximum Dice Count = Minimum Dice Count + Dice Count Range − 1.
Minimum Dice Count: 6
Dice Count Range: 5

# Default Successes required for a typical Check.
Default Success Threshold: 2

# Default excess of Failures over Successes for a Fumble.
Default Fumble Threshold: 2
