# Crimson Steel — Combat tunables.
#
# State (combatants, initiative, time tick, etc.) lives in
# `combat_data.json`, not here. This file is rules only.
#
# All keys use Title Case as referenced from the design / glossary
# / tests. Override files in `data/` follow the convention in
# `file_conventions.md`.

# ---- Initiative ----

# Attribute consulted to determine initiative dice count.
# `dice_count = floor(attribute / Initiative Divisor)`.
Initiative Attribute: wis
Initiative Divisor: 2

# ---- Combat Pool ----
#
# Combatant pool size is computed in two stages:
#
#   budget = floor((martial_proficiency_ranks
#                   + floor(attribute / Combat Pool Divisor))
#                  / Turns Per Round[tier])
#
# Then the budget buys pool points in tiers of size Combat Pool Step.
# The first Step points are free; the next Step cost 1 budget each;
# the next cost 2 each; and so on. Combat Pool is the largest count
# whose total cost fits the budget. Leftover budget that can't afford
# the next point is discarded. Every combatant is guaranteed at
# least Combat Pool Step points.
Combat Pool Attribute: wis
Combat Pool Divisor: 2
Combat Pool Step: 4

# Turns per round indexed by Tier (Tier 0 → index 0). A Tier beyond
# the array length is an error — extend this list rather than
# relying on a default.
# Tier Reference  0  1  2  3  4  5
Turns Per Round: [1, 1, 1, 2, 4, 8]

# ---- Action Economy ----
#
# Every action is Main, Bonus, Free, or Reaction. Reactions are a
# distinct category with their own scoping rules (one allowance per
# Main Action taken; spent only against the action that granted it).
#
# Free actions cost 0 dice and are unlimited. Bonus and Main
# actions specify a *minimum* dice cost; combatants may spend more
# above the minimum to improve outcomes.

Free Action Minimum: 0
Reaction Action Minimum: 2
Bonus Action Minimum: 2
Main Action Minimum: 4

# ---- Attacker Bonuses ----
#
# Bonuses on the *attacker's* to-hit Roll triggered by the defender's
# state. (Despite the defender-side trigger, the bonus accrues to the
# attacker, so naming them "Defensive Bonuses" would be misleading.)
# Whether these stack with each other (or with same-type bonuses from
# other sources) is a Roll Resolution rule, not Combat's.

# Applied when the defender takes no Defensive Action against the
# incoming attack. Suppressed by abilities like Uncanny Dodge.
Flatfooted Bonus:
  type: Circumstance
  amount: 1

# Applied when the defender has not yet acted in the active Combat.
# Unaware combatants are also Flatfooted; both bonus entries qualify
# simultaneously. Abilities suppressing Flatfooted also suppress
# Unaware.
Unaware Bonus:
  type: Circumstance
  amount: 2

# ---- Set-Value Spend ----
#
# Optional dice-spend mechanic: a combatant may pay extra dice from
# their Combat Pool to fix the value of dice they would otherwise
# have rolled randomly. Used to guarantee Critical results against
# Paralyzed defenders and similar cases.
#
# The value each prerolled die takes is Dice Resolution's Die Size,
# queried at use time — no separate entry here, since duplicating
# Die Size would let the two values drift.

# Extra dice paid per prerolled die. Default 1:1.
Set Value Spend Ratio: 1

# ---- Channeling and Concentration ----
#
# Channeled spells require a Main Action each turn from the caster
# (the cast itself counts as the first turn's channel). The
# Combatant chooses how many dice to spend, from Main Action
# Minimum up to Combat Pool Remaining; Dice Cap does not apply to
# channeling. Maintain-mode spells always cost exactly Main Action
# Minimum dice. Auto-mode spells require no channel after the cast.
#
# Damage taken while a Concentration is held triggers a
# Concentration Save; failure ends the spell and loses any Reservoir
# the spell held. The save uses the same skill the spell was cast
# with (provided by the spell domain on Begin Concentration). The
# Roll picks up a Circumstance Penalty equal to
# `spell_tier + damage_dealt`. Target Number is Dice / Check
# Resolution's concern — Combat hands them a Roll with the penalty
# already on it.

# ---- Falling Damage ----
#
# Falling damage is modeled like weapon damage: it has a Threshold
# (used by Runtime Bucketing), causes Bleed equal to a flat amount
# plus the damage dealt, and is reduced by Acrobatics. Each Success
# on an optional Acrobatics check reduces the damage by 1 (clamped
# at zero).
#
# Per-hazard modifiers: callers (e.g. a spiked pit) may supply a
# Falling Damage Modifier that adjusts the per-10-feet figure
# upward (spikes) or downward (cushioned floor). The base value is
# always Falling Damage Per 10 Feet; the modifier is added on top.

Falling Damage Per 10 Feet: 2
Falling Damage Threshold: 5
Falling Damage Bleed Constant: 0   # actual bleed = Bleed Constant + damage dealt

# ---- Trigger Conditions ----
#
# Canonical catalog of Trigger Condition names that Abilities may
# reference in their Trigger Specs (see abilities_design.md, Trigger
# Spec). At load time, Combat checks every Trigger Spec's `condition`
# against this list. Unknown Conditions produce a load-time WARNING
# and never fire at runtime.
#
# Most Conditions are deliberately broad — they fire on a generic
# event and rely on the triggering Ability's description to tell
# the GM under what specific narrative or tactical circumstances
# the effect should land. The GM adjudicates.
Trigger Conditions:
  attack_hits: "Fires when an attack lands. The triggering Ability's description names any additional conditions (target Flatfooted, specific weapon or natural attack, repeat hit on the same target, etc.) and the GM adjudicates whether the trigger should fire."
  attack_action: "Fires when the actor takes an Attack action. The triggering Ability's description names any additional conditions and the GM adjudicates."
  rolled_a_one: "Fires when at least one die in the actor's Roll came up as a Failure (value 1)."

# ---- Damage Types ----
#
# Catalog of damage types. Each entry may have:
#   severity         — fixed Severity (minor/moderate/major) or
#                      `runtime_bucketed: true`
#   parent           — name of another damage type. Sub-type entries
#                      inherit severity and mechanics from the parent
#                      unless overridden.
#   mechanics        — list of Damage Type Mechanic entries (see
#                      below)
#
# Per-weapon bleed and threshold values live with the weapon entry
# (Equipment domain), not here. Combat reads them from the weapon
# when computing Runtime Bucketing.
#
# Recognized Mechanic kinds (combat consumes; conditions consumes
# `apply_acid_counter` and `inflict` via post-damage routing):
#   damage_per_hit           — additive per-hit damage
#   damage_multiplier        — multiplicative on raw damage
#   upgrade_severity         — promote damage to a higher Severity
#                              when a condition tag is matched
#   bonus_successes_from     — convert one of the target's stats
#                              (e.g. Metal Armor DR) into bonus
#                              successes
#   apply_acid_counter       — route damage to the Acid Counter
#                              (see Conditions)
#   inflict                  — apply a named effect on the target
#                              (e.g. Shock equal to damage)
#   critical_value           — overrides the attacker Roll's
#                              critical_modifier (see *Critical
#                              Modifier For* in design)

damage_types:

  # Physical damage is Runtime Bucketed. Bludgeoning, slashing, and
  # piercing are sub-types of physical — they exist as distinct
  # entries so other rules (resistances, weapon-type lookups) can
  # key off the specific name, but they share physical's mechanics.
  physical:
    severity: { runtime_bucketed: true }

  bludgeoning:
    parent: physical

  slashing:
    parent: physical

  piercing:
    parent: physical

  radiant:
    severity: moderate
    mechanics:
      - { kind: upgrade_severity, when: target_has_subtype:undead, to: major }

  # Elemental is a grouping-only parent. It carries no severity or
  # mechanics of its own — fire, cold, and acid all override. The
  # entry exists so future rules (elemental resistance, etc.) can
  # match a single name across the three children.
  elemental:

  fire:
    parent: elemental
    severity: moderate
    mechanics:
      - { kind: damage_per_hit, amount: 1 }

  cold:
    parent: elemental
    severity: minor
    mechanics:
      - { kind: inflict, effect: shock, amount: damage_dealt }

  acid:
    parent: elemental
    severity: moderate
    mechanics:
      - { kind: apply_acid_counter }

  electricity:
    parent: elemental
    severity: moderate
    mechanics:
      - { kind: bonus_successes_from, source: metal_armor_damage_reduction }

  emotional:
    severity: minor
    mechanics:
      - { kind: critical_value, amount: 3 }

# Armor keys whose wearers count as wearing Metal Armor for Damage
# Type interactions (notably Electricity). Placeholder until the
# Equipment domain owns this classification per-armor-entry.
Metal Armor Categories:
  - medium
  - heavy
