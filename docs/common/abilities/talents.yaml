# Talents — Catalog
# Catalog Abilities with type: talent. Loaded by the Abilities module.
# Schema in abilities_design.md (Catalog Ability common type); vocabulary
# in abilities_glossary.md.
#
# Talents typically omit `tier` — the using Creature's Tier supplies the
# value at evaluation time. Carry an explicit `tier` only when the Talent
# has its own Tier independent of the Creature, or when it uses a Tier-
# axis Variant.
#
# Two shapes appear here:
#   - Active talents with a normal activation pipeline (activation_time, range, target).
#   - Trigger talents with a `trigger:` field and no activation pipeline;
#     these fire automatically during another action (sneak_attack,
#     halfling_luck, monster trigger riders, etc.).
#
# Some talents have a Stateful counterpart whose per-Creature state lives
# in Conditions (rage timer, bardic luck pool). The talent here is the
# activation; the Stateful Ability entry in stateful_abilities.yaml
# carries the description of the persistent state.

# --- Active talents -----------------------------------------------------

Rage:
  type: talent
  activation_time: free
  range: Self
  target: self
  mana_cost: 1
  duration: "10 + level turns"
  effects:
    - "rage"
  effect_hash:
    level: level
  description: "You can spend a point of mana to enter a rage for 10 turns plus an additional turn per class level. At the end of your rage you are exhausted for 10 minutes. You can enter a rage as a free action but not if you are surprised. While raging you gain the following circumstantial bonuses: one point of damage reduction plus an additional point every 3 levels, and one point of damage resilience, plus an additional point every 2 levels. You also gain a number of rage powers based upon your level. You cannot enter a rage while fatigued or extend your rage unless a power specifically states otherwise."

Channel Divinity:
  type: talent
  skills: [invocation]
  mana_cost: 1
  description: "You gain a number of abilities from your god through your chosen domains, as well as several abilities granted regardless of domain choice."

Turn Undead:
  type: talent
  inherits_from: Channel Divinity
  activation_time: main
  range: Close
  target: "1+rank"
  save:
    - attribute: wis
      fail: panicked
      success: "0"
  duration: rank turns
  description: "All undead within 30 feet must make a Wisdom saving throw or become panicked."

Destroy Undead:
  type: talent
  inherits_from: Turn Undead
  description: "Undead of a lower Tier than you are instantly destroyed when they fail their Wisdom save against your Turn Undead ability. Undead of a lower Tier than you that succeed on their save take 1 point of radiant energy."

Improved Healing:
  type: talent
  description: "Your healing spells or rituals impose less magical saturation. Decrease the magical saturation of your spells by spell level times 2. Red spells (Cantrips) count as ½ level. Cannot reduce saturation below 1."

Domain:
  type: talent
  description: "You may choose 3 domains granted from your god. These domains cannot be anathema to your god. Each domain grants a number of spells known at each Tier. Choosing a domain in your deity's portfolio grants additional abilities. You may cast any Tier 0 or Tier 1 spells granted from your domain. At level 4 you may cast any Tier 2 spells granted by your domain. All spells gained through your domain must be cast using Invocation."

Martial Devotion:
  type: talent
  inherits_from: Channel Divinity
  activation_time: bonus
  range: Self
  target: self
  duration: "1 turn"
  effects:
    - martial_devotion
  description: "Gain the benefits of Weapon Training Special Ability."

Flame Devotion:
  type: talent
  inherits_from: Channel Divinity
  activation_time: reaction
  range: 15
  target: object
  duration: "1 turn"
  description: "A target weapon within 15 feet gains the Flaming property for one turn."

Touch of Chaos:
  type: talent
  inherits_from: Channel Divinity
  activation_time: reaction
  range: Close
  target: "1"
  save:
    - attribute: cha
      fail: confused
      success: "0"
  duration: "1 attack"
  description: "Force target creature to redirect their attack to a random creature in range instead."

Strength Devotion:
  type: talent
  inherits_from: Channel Divinity
  activation_time: main
  range: Self
  target: self
  duration: "1 minute"
  effects:
    - strength_devotion
  description: "Gain a +2 Morale bonus to Strength and Constitution."

Glorious Charge:
  type: talent
  inherits_from: Channel Divinity
  activation_time: bonus
  range: Self
  target: self
  duration: "1 attack"
  description: "Treat your Tier as 1 higher for a single attack."

Karthak's Resolve:
  type: talent
  inherits_from: Channel Divinity
  mana_cost: 4
  activation_time: reaction
  range: Self
  target: self
  duration: "1 turn"
  modifiers:
    - target: damage_resilience
      type: Morale
      add: 5
  description: "Gain a +5 Morale bonus to damage resilience. Usable only when fighting a higher-Tier creature, or when surrounded by multiple enemies with no allies within 15 feet."

Kesser's Gambit:
  type: talent
  inherits_from: Channel Divinity
  mana_cost: 4
  activation_time: reaction
  roll_table: Kesser Reversal Table
  description: "Kesser's deity Channel Divinity, gained at Cleric level 4. As a reaction triggered on an attack or spell roll, roll a d10 on the Kesser Reversal Table (see creatures_design.md). Channel Successes scale the table's entries."

Sneak Attack:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: bonus_damage
      damage: "1 + (level - 1) / 2"
  description: "Your weapon attacks deal a +1 competency bonus to damage against flat-footed creatures within 30 feet. This bonus increases by 1 at 3rd level and every 2 levels thereafter. Before rolling, you may impose an additional effect by increasing the attack's success requirement from 2 to 3. This additional effect allows the target to make a Constitution save with a penalty equal to your sneak attack bonus to negate the additional effects. Effects: increase bleeding by 10 per point of sneak attack damage, decrease the target's movement speed by half until healed."

Reckless Attacks:
  type: talent
  required_condition: rage
  modifiers:
    - target: combat_pool
      type: Circumstance
      add: level
  description: "Gain additional dice on your attacks equal to your class level when you spend all of your remaining combat pool on an attack action."

Primal Tenacity:
  type: talent
  required_condition: rage
  activation_time: reaction
  range: Self
  target: self
  mana_cost: 4
  duration: "1 attack"
  modifiers:
    - target: damage_reduction
      type: Circumstance
      add: 4
  description: "You can use your reaction to gain a +4 circumstantial bonus to your damage reduction against a single attack. Costs 4 mana."

# --- Barbarian archetype features -------------------------------------------
# Weretouched Barbarian. NOTE: the natural-attack grant (claws + bite) and the
# silver-weapon interactions below are described here but not yet wired into
# Combat — they are class-reference text pending engine support.
Lycanthropic Rage:
  type: talent
  required_condition: rage
  effect_hash:
    level: level
  description: "Gain two claws and a bite attack when raging. These attacks gain a +1 guidance bonus. At level 4 it increases to +2."

Lycanthropic Resistance:
  type: talent
  required_condition: rage
  description: "All damage reduction and damage reduction from rage is increased by 2. All damage from silver weapons bypasses damage reduction and damage resistance gained from rage. All damage from silver weapons is increased one step in severity."

# Bloodrager. The per-Tier arcana spell counts (Tier 0 = level capped at 6,
# Tier 1 = floor(level/3) capped at 4) and casting-while-raging are described
# here; wiring them into spell selection / casting is pending engine support.
Bloodrager Spellcasting:
  type: talent
  description: "Gain a number of arcana spells known that can be cast while raging. You know a number of Tier 0 spells equal to your class level (max 6) and a number of Tier 1 spells equal to 1/3 your level (max 4). These spells can only be cast using Evocation."

Trapfinding:
  type: talent
  effects:
    - "trapfinding"
  description: "Passively sense certain magical auras from traps and illusions, and gain a +1 competency bonus to perception against them. This increases by 1 at level 5 and every 5 class levels afterwards."
  modifiers:
    - target: skill
      type: Competency
      descriptors: [perception, traps, illusions]
      add: "1 + level / 5"

# Poisoner (Rogue archetype). Deep mechanics (crafting poisons, the sneak-
# attack potency rider) are class-reference text pending engine support.
Precise Poisoner:
  type: talent
  required_condition: sneak_attack
  description: "You gain an additional alternate effect when using sneak attack with a poisoned attack, whether from a spell or a poisoned weapon. You can choose to increase the affliction potency of your attack by 10 per point of sneak attack damage."

Poison Crafter:
  type: talent
  description: "You may make Nature (Survival) checks to create a simple poison. These poisons last 1 week and may only be used by you. They deal minor Dexterity damage with an affliction frequency of 1/round. Each Nature success gives a single dose. At level 5 you can choose to make Strength poisons instead."

Danger Sense:
  type: talent
  activation_time: reaction
  range: Self
  target: self
  mana_cost: 4
  duration: "1 attack"
  modifiers:
    - target: damage_resilience
      type: Luck
      add: 4
  description: "You can reflexively react to unseen dangers. When taking damage from any source, even when unaware, you can use your reaction to gain a +4 luck bonus to your damage resilience against that damage. Costs 4 mana."

Better Lucky Than Good:
  type: talent
  activation_time: reaction
  range: Self
  target: self
  duration: "1 turn"
  mana_cost: 4
  description: "Can be activated while unaware. Spend 4 mana to cause an attack or spell against you to roll with half as many dice."

Magical Performance:
  type: talent
  range: Self
  target: self
  duration: concentration
  skills: [perform_]
  description: "Create a magical performance using any perform skill to create magical effects depending upon the type of performance. Magical performances cost a main action and a point of mana each turn. You can only use this ability with perform skills advanced with this class, and perform skills used for magical performance cannot be advanced by any other class."

Bardic Spellcasting:
  type: talent
  description: "Learn a number of spells that can be cast as a main action while maintaining a magical performance. Spells need not be prepared each day. Casting outside a performance takes twice as long. See the table for the number of spells known."

Arcane Spellcasting:
  type: talent
  description: "Cast arcane spells."

Druidic Spellcasting:
  type: talent
  description: "Cast druidic spells drawn from the bond with nature."

Bardic Inspiration:
  type: talent
  activation_time: main
  range: Self
  target: self
  mana_cost: 1
  duration: "1 turn"
  skills: [perform_]
  description: "Use your magical performance to inspire your allies. Roll a perform check and gain a point of luck for each success rolled. Luck points gained in this manner last until the start of your next turn and can be spent to grant a luck bonus on another creature's check. You must decide how much luck you will spend on a check before the dice are rolled, and each point of luck will allow that creature to reroll a single die. Dice can never be rerolled more then once."
  channel:
    mode: reservoir
    description: "Make a Performance check; each Success grants one point of luck."
  reservoir:
    fill:
      source: check_successes
      ratio: 1
    discharge:
      action: reaction
      amount: "1..reservoir"
      description: "Spend luck to allow target roll to reroll low rolls."

Unsettling Words:
  type: talent
  inherits_from: Bardic Inspiration
  description: "Use your magical performance to distract your enemies. You may use luck points gained from Bardic Inspiration to force enemies to reroll dice. You must decide how much luck you will spend on a check before the dice are rolled, and each point of luck will allow you to force a creature to reroll a single die of your choice. Dice can never be rerolled more then once."

Combat Trickery:
  type: talent
  description: "Gain a number of arcane spells from the Trickery list as innate spells."

Mage Hand Legermain:
  type: talent
  description: "When you cast Mage Hand the hand can be invisible. Use it to stow or retrieve an item from a container worn or carried by another creature, or to use thieves' tools to pick locks and disarm traps at range."

Thieves Cant:
  type: talent
  description: "You know thieves' cant — a coded mix of dialect, jargon, and signs. Hide messages in normal conversation (twice as long to convey) and read the secret signs that mark danger, loot, or thieves' guild territory."

Spell-Like Ability (Enchantment/Illusion):
  type: talent
  description: "Choose an enchantment or illusion tier 0 spell from any list and cast it as a spell-like ability."

# --- Trigger talents: reroll, luck ---------------------------------------

Halfling Luck:
  type: talent
  trigger:
    on: attack_check
    condition: rolled_a_one
    effect:
      kind: scale
      scale: reroll_one_die
  description: "Once per check, reroll a single 1 rolled."

# --- Natural attacks -----------------------------------------------------

Natural Attack:
  type: talent
  description: "Grants one or more natural weapons (slam, claw, bite, horn, etc.)."
  grants_equipment: []   # filled in by the granting Class or Race; Equipment owns the weapon stat blocks.

Jaw Bite:
  type: talent
  description: "Grants the bite attack."
  grants_equipment: ["Bite (Jaws)"]

Fang Bite:
  type: talent
  description: "Grants the bite attack."
  grants_equipment: ["Bite (Fangs)"]

Slam:
  type: talent
  description: "Grants a slam natural weapon."
  grants_equipment: ["Slam"]

Claw:
  type: talent
  description: "Grants a raking claw natural weapon."
  grants_equipment: ["Claw"]

Tail Slap:
  type: talent
  description: "Grants a lashing tail natural weapon."
  grants_equipment: ["Tail Slap"]

Acid Bite:
  type: talent
  description: "Grants the acid bite natural attack."
  grants_equipment: ["Bite (Acid)"]

Rend:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: bonus_damage
      damage: "tier"
  description: "On a successful hit with two natural attacks against the same target on the same turn, deal additional damage equal to tier."

# --- Trigger talents tied to monster bites/slams -----------------------

Poison Bite:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: invoke_named_effect
      name: poison
  save:
    - attribute: con
      fail: poison
      success: "0"
  description: "Bite injects poison; target must save or take poison damage."

Ghoul Fever:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: invoke_named_effect
      name: ghoul_fever
  save:
    - attribute: con
      fail: ghoul_fever
      success: "0"
  description: "Disease inflicted on bite. Targets must make a Constitution save against contracting ghoul fever."

Ghoul Paralysis:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: invoke_named_effect
      name: paralyzed
  save:
    - attribute: con
      fail: paralyzed
      success: "0"
  description: "Bite or claw can paralyze the target on a failed save."

Energy Drain:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: invoke_named_effect
      name: energy_drain
  description: "Drains life force from a target on a successful slam attack."

Create Spawn:
  type: talent
  trigger:
    on: on_kill
    effect:
      kind: invoke_named_effect
      name: rise_as_undead
  description: "Creatures killed by this creature rise as undead under its control."
