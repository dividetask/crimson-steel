# Talents — Catalog
# Catalog Abilities with type: talent. Loaded by the Abilities module.
# Schema in abilities_design.md (Catalog Ability common type); vocabulary
# in abilities_glossary.md.
#
# Talents typically omit `tier` — the using Creature's Tier supplies the
# value at evaluation time. Carry an explicit `tier` only when the Talent
# has its own Tier independent of the Creature, or when it uses a Tier-
# axis Variant.
#
# Two shapes appear here:
#   - Active talents with a normal activation pipeline (activation_time, range, target).
#   - Trigger talents with a `trigger:` field and no activation pipeline;
#     these fire automatically during another action (sneak_attack,
#     halfling_luck, monster trigger riders, etc.).
#
# Some talents have a Stateful counterpart whose per-Creature state lives
# in Conditions (rage timer, bardic luck pool). The talent here is the
# activation; the Stateful Ability entry in stateful_abilities.yaml
# carries the description of the persistent state.

# --- Active talents -----------------------------------------------------

Rage:
  type: talent
  activation_time: free
  range: Self
  target: self
  mana_cost: 1
  duration: "con/2 + level turns"
  effects:
    - "rage"
  effect_hash:
    level: level
  description: "You can spend a point of mana to enter a rage for constitution/2 + class level turns. At the end of your rage you are exhausted for 10 minutes. You can enter a rage as a free action but not if you are surprised. While raging you gain the following Circumstance bonuses: one point of damage reduction plus an additional point every 3 levels, and one point of damage resilience plus an additional point every 2 levels. You also gain a number of rage powers based upon your level. You cannot enter a rage while fatigued, and you cannot extend an ongoing rage unless a power specifically states otherwise."

Channel Divinity:
  type: talent
  skills: [invocation]
  mana_cost: 1
  description: "Spend mana to invoke a divine effect from your domain."

Turn Undead:
  type: talent
  inherits_from: Channel Divinity
  activation_time: main
  range: Close
  target: "1+rank"
  save:
    - attribute: wis
      fail: frightened
      success: "0"
  duration: rank turns
  description: "Each affected undead must make a Wisdom save or be Frightened for the duration."

Martial Devotion:
  type: talent
  inherits_from: Channel Divinity
  activation_time: bonus
  range: Self
  target: self
  duration: "1 turn"
  effects:
    - martial_devotion
  description: "Gain the benefits of Weapon Training Special Ability."

Flame Devotion:
  type: talent
  inherits_from: Channel Divinity
  activation_time: reaction
  range: 15
  target: object
  duration: "1 turn"
  description: "A target weapon within 15 feet gains the Flaming property for one turn."

Touch of Chaos:
  type: talent
  inherits_from: Channel Divinity
  activation_time: reaction
  range: Close
  target: "1"
  save:
    - attribute: cha
      fail: confused
      success: "0"
  duration: "1 attack"
  description: "Force target creature to redirect their attack to a random creature in range instead."

Strength Devotion:
  type: talent
  inherits_from: Channel Divinity
  activation_time: main
  range: Self
  target: self
  duration: "1 minute"
  effects:
    - strength_devotion
  description: "Gain a +2 Morale bonus to Strength and Constitution."

Glorious Charge:
  type: talent
  inherits_from: Channel Divinity
  activation_time: bonus
  range: Self
  target: self
  duration: "1 attack"
  description: "Treat your Tier as 1 higher for a single attack for the rest of your turn."

Karthak's Resolve:
  type: talent
  inherits_from: Channel Divinity
  mana_cost: 4
  activation_time: reaction
  range: Self
  target: self
  duration: "1 turn"
  modifiers:
    - target: damage_resilience
      type: Morale
      add: 5
  description: "Gain a +5 Morale bonus to damage resilience. Usable only when fighting a higher-Tier creature, or when surrounded by multiple enemies with no allies within 15 feet."

Kesser's Gambit:
  type: talent
  inherits_from: Channel Divinity
  mana_cost: 4
  activation_time: reaction
  roll_table: Kesser Reversal Table
  description: "Kesser's deity Channel Divinity, gained at Cleric level 4. As a reaction triggered on an attack or spell roll, roll a d10 on the Kesser Reversal Table (see creatures_design.md). Channel Successes scale the table's entries."

Sneak Attack:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: bonus_damage
      damage: "1 + (level - 1) / 2"
  description: "Attacks deal extra damage against flat-footed creatures within 30 ft (+1 per 2 levels after 1st). Before rolling, you may impose an additional effect by raising the success requirement; the target then makes a Constitution save with a penalty equal to your sneak-attack bonus."

Reckless Attacks:
  type: talent
  required_condition: rage
  trigger:
    on: attack_action
    condition: attack_action
    effect:
      kind: bonus_dice
      dice: "level"
  description: "While raging: when taking a full attack action, gain an additional number of dice for that attack equal to your class level."

Primal Tenacity:
  type: talent
  required_condition: rage
  activation_time: reaction
  range: Self
  target: self
  mana_cost: 4
  duration: "1 attack"
  modifiers:
    - target: damage_reduction
      type: Morale
      add: 4
  description: "While raging: Gain a +4 Morale bonus to damage reduction against a single attack."

Trapfinding:
  type: talent
  effects:
    - "trapfinding"
  description: "Passively sense certain magical auras from traps and illusions, and gain a perception bonus against them."
  modifiers:
    - target: skill
      type: Competency
      descriptors: [perception, traps, illusions]
      add: "level / 5"

Danger Sense:
  type: talent
  activation_time: reaction
  range: Self
  target: self
  mana_cost: 4
  duration: "1 attack"
  modifiers:
    - target: damage_resilience
      type: Competency
      add: 4
  description: "Gain a +4 Competency bonus to damage resilience against a single attack."

Better Lucky Than Good:
  type: talent
  activation_time: reaction
  range: Self
  target: self
  duration: "1 turn"
  mana_cost: 4
  description: "Can be activated while unaware. Attacks against you (including spells) are made with half as many dice (min 3)."

Magical Performance:
  type: talent
  range: Self
  target: self
  duration: concentration
  skills: [perform_]
  description: "Learn a magical variant of any Performance skill, used both for mundane checks and to create a magical performance. Maintaining a performance takes a main action each turn."

Bardic Spellcasting:
  type: talent
  description: "Cast a number of bardic spells as a main action while performing. Spells need not be prepared each day. Casting outside a performance takes twice as long."

Arcane Spellcasting:
  type: talent
  description: "Cast arcane spells."

Druidic Spellcasting:
  type: talent
  description: "Cast druidic spells drawn from the bond with nature."

Bardic Inspiration:
  type: talent
  activation_time: main
  range: Self
  target: self
  mana_cost: 1
  duration: "1 turn"
  skills: [perform_]
  channel:
    mode: reservoir
    description: "Make a Performance check; each Success grants one point of luck."
  reservoir:
    fill:
      source: check_successes
      ratio: 1
    discharge:
      action: reaction
      amount: "1..reservoir"
      description: "Spend luck to allow target roll to reroll low rolls."

Unsettling Words:
  type: talent
  inherits_from: Bardic Inspiration
  description: "You may use luck from youur Bardic Inspiration to force target roll to reroll successes."

Combat Trickery:
  type: talent
  description: "Gain a number of arcane spells from the Trickery list as innate spells."

Mage Hand Legermain:
  type: talent
  description: "When you cast Mage Hand the hand can be invisible. Use it to stow or retrieve an item from a container worn or carried by another creature, or to use thieves' tools to pick locks and disarm traps at range."

Thieves Cant:
  type: talent
  description: "You know thieves' cant — a coded mix of dialect, jargon, and signs. Hide messages in normal conversation (twice as long to convey) and read the secret signs that mark danger, loot, or thieves' guild territory."

Spell-Like Ability (Enchantment/Illusion):
  type: talent
  description: "Choose an enchantment or illusion tier 0 spell from any list and cast it as a spell-like ability."

# --- Trigger talents: reroll, luck ---------------------------------------

Halfling Luck:
  type: talent
  trigger:
    on: attack_check
    condition: rolled_a_one
    effect:
      kind: scale
      scale: reroll_one_die
  description: "Once per check, reroll a single 1 rolled."

# --- Natural attacks -----------------------------------------------------

# Slam, Claws, Bite, Horns and similar natural weapons are Equipment, not
# Talents. The Natural Attack Talent is what grants a Creature access to
# them; the weapon stat blocks live in the Equipment domain (currently
# pending — names referenced from creature stubs and race configs will
# resolve to Equipment entries once that domain ships).
Natural Attack:
  type: talent
  description: "Grants one or more natural weapons (slam, claw, bite, horn, etc.)."
  grants_equipment: []   # filled in by the granting Class or Race; Equipment owns the weapon stat blocks.

# Concrete Natural Attack Talents granted by the beast subtypes. Each names
# the Bite weapon it confers via grants_equipment; the weapon (and, for the
# spider, its venom) lives in the Equipment catalog. The bite is offered as
# an attack but is never carried as inventory.
Canine Bite:
  type: talent
  description: "Grants the Bite (Jaws) natural weapon."
  grants_equipment: ["Bite (Jaws)"]

Spider Bite:
  type: talent
  description: "Grants the Bite (Fangs) natural weapon."
  grants_equipment: ["Bite (Fangs)"]

Rend:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: bonus_damage
      damage: "tier"
  description: "On a successful hit with two natural attacks against the same target on the same turn, deal additional damage equal to tier."

# --- Trigger talents tied to monster bites/slams -----------------------

Poison Bite:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: invoke_named_effect
      name: poison
  save:
    - attribute: con
      fail: poison
      success: "0"
  description: "Bite injects poison; target must save or take poison damage."

Ghoul Fever:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: invoke_named_effect
      name: ghoul_fever
  save:
    - attribute: con
      fail: ghoul_fever
      success: "0"
  description: "Disease inflicted on bite. Targets must make a Constitution save against contracting ghoul fever."

Ghoul Paralysis:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: invoke_named_effect
      name: paralyzed
  save:
    - attribute: con
      fail: paralyzed
      success: "0"
  description: "Bite or claw can paralyze the target on a failed save."

Energy Drain:
  type: talent
  trigger:
    on: on_hit
    condition: attack_hits
    effect:
      kind: invoke_named_effect
      name: energy_drain
  description: "Drains life force from a target on a successful slam attack."

Create Spawn:
  type: talent
  trigger:
    on: on_kill
    effect:
      kind: invoke_named_effect
      name: rise_as_undead
  description: "Creatures killed by this creature rise as undead under its control."
