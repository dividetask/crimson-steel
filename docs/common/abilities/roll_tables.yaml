# Ability Roll Tables — Catalog
#
# Named d-die tables an Ability rolls on when it fires. A Catalog
# Ability points at one of these by name through its `roll_table:`
# field (talents.yaml); Combat resolves the roll through the
# Abilities catalog (see `Abilities.roll_table`) and the combat
# Roll Table Stub (`docs/common/ui/encounter_roll_table_stub.md`).
#
# Schema, per table:
#   <Table Name>:
#     die: <integer>        — the die rolled (e.g. 10 for a d10)
#     entries:              — one entry per face, keyed 1..die
#       <face>:
#         name: <short label>
#         effect: <description>
#
# Entry text may reference **Channel Successes** — the Successes the
# channeler rolls when firing the Ability. The Stub fills in the
# concrete number beside the rolled entry; Combat does not yet apply
# the mechanical effect (the DM adjudicates it).

Kesser Reversal Table:
  die: 10
  entries:
    1:
      name: Disaster
      effect: "Channel Successes are added or subtracted, whichever is worse for the cleric, to all checks."
    2:
      name: Backfire
      effect: "Attack causes a magical explosion. The damage dealt is dealt again to all creatures within 30'. A Charisma check against Channel Successes can reduce the damage taken by half."
    3:
      name: Sympathy
      effect: "Both attacker, channeler, and target take the attack's damage in full. Channeler can choose to increase or decrease damage by Channel Successes but must make the same choice for all affected creatures."
    4:
      name: Counter
      effect: "The target gets a free weapon attack after this attack resolves with starting successes equal to Channel Successes."
    5:
      name: Wild Deflection
      effect: "Attack changes target to a random creature in range instead — channeler picks if ties."
    6:
      name: Reversal
      effect: "Attacker and target swap tiers and dice for the attack."
    7:
      name: Surprise
      effect: "Target is flatfooted for this attack and all dice spent on defence are lost. Channeler can choose to increase or reduce damage dealt by Channel Successes."
    8:
      name: Naked
      effect: "Attacker's sword and target's armor teleport to a random square within 30'. Both gain a Charisma save against Channel Successes to resist. If a weapon teleports, the attack still resolves with a natural attack instead."
    9:
      name: Lucky Break
      effect: "All creatures gain a luck bonus or penalty on their roll equal to Channel Successes."
    10:
      name: Crit
      effect: "Channel Successes are added or subtracted, whichever is best for the channeler, to all checks."
