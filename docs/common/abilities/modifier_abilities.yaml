# Always-On Modifier Abilities — Temporary catalog
#
# Granted Abilities whose mechanical behavior is purely an Always-On
# Modifier: a passive numeric bonus (or a passive flag that gates a
# conditional bonus). When the Modifiers domain exists this data migrates
# there and this file is deleted.
#
# Each entry shape:
#   <name>:
#     description: string
#     modifiers:
#       - target: string         # what the bonus applies to
#         type: string           # Bonus Type Name
#         descriptors: [...]     # optional scope tags
#         add: number | formula  # value; may reference `level`, `tier`
#
# Entries marked "modifiers-pending" have no clean numeric/Modifier-shape
# yet and only carry a description. They still belong to the Always-On
# Modifier flavor — the data shape just needs the Modifiers domain to
# land before it can be specified.

# --- Speed modifiers ----------------------------------------------------

fast_movement:
  description: "You gain a +10 morale bonus to speed."
  modifiers:
    - target: speed
      type: Morale
      add: 10

fleet_of_foot:
  description: "Base walking speed increases by 5 feet."
  modifiers:
    - target: speed
      type: Racial
      add: 5

# --- Combat numeric bonuses --------------------------------------------

weapon_training:
  description: "+1 attack bonus with all weapons in a chosen category, increasing by +1 every 4 levels."
  modifiers:
    - target: attack
      type: Competency
      descriptors: [chosen_weapon_category]
      add: "1 + level / 4"

armor_training:
  description: "+1 to damage reduction and resilience while wearing armor, increasing by +1 every 4 levels."
  modifiers:
    - target: damage_reduction
      type: Competency
      descriptors: [wearing_armor]
      add: "1 + level / 4"
    - target: damage_resilience
      type: Competency
      descriptors: [wearing_armor]
      add: "1 + level / 4"

natural_armor:
  description: "Grants a variable bonus to damage reduction. The exact amount is set by the granting Class or Race."
  modifiers:
    - target: damage_reduction
      type: Racial
      add: 0   # overridden by the granting Class or Race

natural_armor_2:
  description: "Thick hide grants +2 damage reduction."
  modifiers:
    - target: damage_reduction
      type: Racial
      add: 2

natural_armor_4:
  description: "Thick hide grants +4 damage reduction."
  modifiers:
    - target: damage_reduction
      type: Racial
      add: 4

ferocity:
  description: "+3 damage resilience."
  modifiers:
    - target: damage_resilience
      type: Racial
      add: 3

scaled_hide:
  description: "Tough reptilian scales grant +1 damage reduction and +1 damage resilience."
  modifiers:
    - target: damage_reduction
      type: Racial
      add: 1
    - target: damage_resilience
      type: Racial
      add: 1

# --- Skill / save modifiers --------------------------------------------

silver_tongue:
  description: "You gain a +1 competency bonus to persuasion and deception checks. This bonus applies when using versatile performance."
  modifiers:
    - target: skill
      type: Competency
      descriptors: [persuasion, deception]
      add: 1

fey_resistance:
  description: "+1 inherent bonus to being charmed; immune to magical sleep."
  modifiers:
    - target: save
      type: Inherent
      descriptors: [charm]
      add: 1
    - target: immunity
      type: Inherent
      descriptors: [magical_sleep]
      add: 1

poison_resistance:
  description: "+1 racial bonus on all saving throws against poison."
  modifiers:
    - target: save
      type: Racial
      descriptors: [poison]
      add: 1

enchantment_resistance:
  description: "+1 racial bonus on saving throws against enchantment effects."
  modifiers:
    - target: save
      type: Racial
      descriptors: [enchantment]
      add: 1

far_sight:
  description: "All distance penalties for sight-based perception checks are halved."
  modifiers:
    - target: skill_penalty
      type: Inherent
      descriptors: [perception, distance]
      add: -0.5

# --- Passive sensory / flag-style (modifiers-pending) -------------------

see_injury:
  description: "You can see injuries, afflictions, magical saturation, and the life energy flowing through all creatures including the negative life energy of undead. The range of this ability starts at 10 feet and increases by 5 feet every two levels. All creatures can attempt to hide this aura from you and automatically attempt to do so whenever they make a stealth check. This will allow you to make a heal check to identify the details of an affliction affecting a creature within range. This ability does not work if you are blinded."

darkvision:
  description: "See in darkness as if it were dim light, up to 60 feet."

low_light_vision:
  description: "See twice as far as a human in dim light."

frost_breath:
  description: "Once per encounter the creature can exhale a 30-foot cone of freezing air, dealing cold damage to everything caught in it (a Dexterity save halves the damage)."

spit_acid:
  description: "Once per encounter the creature can spit a stream of acid at a target, dealing 10 acid damage plus its successes on the attack (a Dexterity save halves the damage)."

keen_smell:
  description: "Keen sense of smell grants a bonus on Perception checks that rely on scent, and lets the creature track by smell."

pack_tactics:
  description: "The creature fights as a coordinated pack: it strikes with greater accuracy against any enemy that has one of the creature's allies adjacent to it."

trip_bite:
  description: "On a successful bite the creature can attempt to knock a Large or smaller target prone (the target resists with a Strength or Dexterity save)."

false_appearance:
  description: "While it remains motionless the creature is indistinguishable from an ordinary object — a cloaker looks like a dark leather cloak — until it moves or attacks. Creatures may make an Intelligence check to notice the inconsistency, as with an illusion."

moan:
  description: "The creature emits a subsonic moan. Each creature within 30 feet that can hear it must make a Wisdom save or be unnerved — frightened while the moan continues and briefly after. Allies of the moaning creature are unaffected."

phantasms:
  description: "The creature weaves illusory duplicates of itself (the cloaker's shadow shift). Attacks against it may strike a phantasm instead, obscuring which shape is real."

engulf:
  description: "The creature can wrap itself around a Medium or smaller target it hits, enveloping and grappling it. An engulfed victim is blinded, restrained, and unable to breathe until it escapes with a Strength or Dexterity save."

damage_transfer:
  description: "While it has a victim engulfed, the creature transfers half of any damage it takes to that victim instead of suffering it itself."

absorb_persona:
  description: "Learn the memories of a helpless creature, storing them as a Persona. Requires 1 day per level of the creature; the target gains a Charisma save to resist. You can store up to 1 Persona per two character levels — drop a stored Persona to make room for another."

surface_thoughts:
  description: "Glean the surface thoughts of all creatures within 30 feet. Creatures gain a Wisdom save to resist, but do not detect the intrusion unless you fumble the check."

change_shape:
  description: "Assume the form of any Persona you have stored. Changing form takes 1 minute."

borrowed_talent:
  description: "Gain the class abilities of a stored Persona, at a class level equal to the lower of half your character level or the Persona's own class level."

light_sensitivity:
  description: "Dazzled in bright light such as sunlight: takes a penalty on attack rolls and sight-based Perception checks while brightly illuminated."

uncanny_dodge:
  description: "You can enter a rage even if surprised. You are always considered to be dodging an attack even if you are unaware or do not have any dice to spend. You must be capable of moving, and some abilities negate this ability."

mindless_rage:
  description: "You cannot be charmed or frightened while raging. If you enter a rage while charmed or frightened then the effect is suspended for the duration of the rage."

fey:
  description: "Counts as a fey creature rather than humanoid. Vulnerable to attacks from cold iron weapons."

ghoul_stench:
  description: "Aura of stench imposing penalties on adjacent creatures. The penalty target and value are pending the Modifiers domain."

# --- Skill substitution / training rules (modifiers-pending) ------------

jack_of_all_trades:
  description: "You are considered trained with all skills and can act as though you have a number of ranks equal to half your level on skill checks without ranks except for restricted skills."

versatile_performance:
  description: "Choose one type of Perform skill and gain the ability to make performance checks with that skill in place of the performance's associated skills. If you are already trained in the associated skills you may retrain for free. The types of Perform and their associated skills are: Act (Deception, Disguise), Comedy (Deception, Intimidate), Dance (Acrobatics, Use Magic Device), Keyboard Instruments (Persuasion, Intimidate), Oratory (Persuasion, Sense Motive), Percussion (Handle Animal, Intimidate), Sing (Deception, Sense Motive), String (Deception, Persuasion), and Wind (Persuasion, Handle Animal)."

armor_proficiency_light:
  description: "Gain proficiency with light armor."

# --- Feat slot grants (modifiers-pending) -------------------------------

bonus_feat:
  description: "Choose any 1st-level feat."

bonus_racial_feat_halfling:
  description: "Choose any halfling feat."

bonus_racial_feat_gnome:
  description: "Choose any gnome feat."

performance_feat:
  description: "Choose a single feat from the Magical Performance Feat list."

combat_feat:
  description: "Gain a combat feat as a bonus."
