# Stateful Abilities — Temporary catalog
#
# Granted Abilities whose mechanical behavior is Stateful: they carry
# per-Creature mutable state (counters, timers, pools, persistent flags)
# that the Conditions domain will own once it's designed. Until then,
# this file holds the canonical name and display description so creature
# stubs have something to render.
#
# Each entry: name → { description }. When Conditions designs its catalog,
# these move into that catalog as Conditions Effect Names (or whatever
# Conditions chooses as the canonical home) and this file is deleted.

regeneration:
  description: "Each turn the creature mends minor damage equal to its tier plus 1 moderate damage — so faster, higher-tier creatures (which take several turns per round) heal multiple times a round. Each hour it also recovers 1 major damage. While regenerating the creature carries a visible regenerating condition. Regeneration stops working while the creature has unhealed acid or fire damage; that acid or fire damage still heals normally through natural healing, and once it is gone regeneration resumes."

undead_traits:
  description: "The creature has the immunities and weaknesses typical of the undead."
