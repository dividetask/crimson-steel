# Spells — Catalog
# Catalog Abilities with type: spell. Loaded by the Abilities module.
# Schema in abilities_design.md (Catalog Ability common type) and
# field glossary in abilities_glossary.md.
#
# Defaults (omit the field when it matches):
#   activation_time: main
#   skills: [arcana]
#   items: []
#   requires_willing: false (true when target: self)

Elemental Dart:
  type: spell
  tier: 0
  aspects: [fire, acid, electricity, cold]
  name: [Fire Dart, Acid Dart, Electricity Dart, Cold Dart]
  damage_type: [fire, acid, electricity, cold]
  school: resonance
  range: Close
  target: "1"
  attack_roll: true
  duration: rank turns
  channel:
    mode: fire
    apply_on_cast: true
    retarget: true
    attack_roll: true
    description: "Throw {aspect} dart at any valid target within range."
  description: "A ranged dart of {aspect}. Resolves as a ranged attack. While channeled, the caster may throw additional darts."

Heal:
  type: spell
  tier: [0, 1, 2, 3, 4, 5]
  school: pneumancy
  polarity: positive
  range: Touch
  target: "1"
  save:
    - attribute: wis
      fail: "0"
      success: halved
  duration: rank turns
  skills: [healing, nature, perform_]
  items: [potion, oil]
  suffix:
    - Petty Wounds
    - Lesser Wounds
    - Simple Wounds
    - Moderate Wounds
    - Advanced Wounds
    - Extreme Wounds
  effect_hash:
    minor_damage: [1, 4, 8, 16, 32, 64]
    moderate_damage: [0, 2, 4, 8, 16, 32]
    major_damage: [0, 0, 0, 1, 2, 4]
    minimum_saturation: "tier*2"
    saturation: "tier*5"
  channel:
    mode: fire
    apply_on_cast: true
    description: "Make a casting check; reduce the target's bleeding by tier*2 per success rolled."
    effect_hash:
      bleed_reduction: "tier*2*success"
  description: "Restores up to {minor_damage} minor damage, {moderate_damage} moderate damage, and {major_damage} major damage to the touched ally."

Vicious Mockery:
  type: spell
  tier: 0
  school: enchantment
  range: Close
  target: "1"
  save:
    - attribute: wis
      fail: flustered
      success: "0"
  duration: rank turns
  skills: [perform_]
  properties: [language_dependent]
  damage_type: emotional
  channel:
    mode: fire
    apply_on_cast: true
    retarget: true
    description: "Repeat the spell's effects against any valid target within range."
  description: "Hurl mocking words at a target, demoralizing them with stinging insults. The tier-1 successor is Biting Words."

Biting Words:
  type: spell
  tier: 1
  school: enchantment
  range: Close
  target: "1"
  attack_roll: true
  save:
    - attribute: wis
      fail: flustered
      success: "0"
  duration: rank turns
  skills: [perform_]
  properties: [language_dependent]
  damage_type: emotional
  prerequisite: Vicious Mockery
  effects:
    - "attribute/2 + 2 damage"
  channel:
    mode: fire
    apply_on_cast: true
    retarget: true
    description: "Repeat the spell's effects against any valid target within range."
  description: "An enhanced form of Vicious Mockery. Words bite deep — an attack roll lands the insult and deals damage in addition to applying the flustered effect on a failed Wisdom save."

Create Illusion:
  type: spell
  tier: [0, 1, 2, 3]
  name:
    - Create Illusionary Sound
    - Create Illusionary Image
    - Create Minor Illusion
    - Minor Figment
  school: resonance
  range: Close
  target: "1"
  save:
    - attribute: int
      fail: believes_illusion
      success: "0"
  duration: rank turns
  skills: [arcana, perform_]
  effect_hash:
    senses:
      - sound
      - visual
      - sound and visual
      - sound, visual, and tactile
  variant_overrides:
    - null
    - { range: Medium }
    - { range: Medium }
    - { range: Long }
  channel:
    mode: fire
    apply_on_cast: false
    description: "Maintain the illusion or alter what it presents."
  description: "Create an illusion within range that engages {senses}. Creatures interacting with the illusion may make an Intelligence save to disbelieve it."

Ward:
  type: spell
  tier: [0, 1, 2, 3, 4, 5]
  prefix:
    - Trivial
    - Lesser
    - Standard
    - Improved
    - Advanced
    - Superior
  school: resonance
  polarity: positive
  range: Touch
  target: "1"
  duration: "rank turns"
  skills: [healing, nature]
  effect_hash:
    temp_hp: [3, 5, 8, 12, 16, 20]
  variant_overrides:
    - null
    - { duration: "rank*10 turns" }
    - { duration: "rank*10 minutes" }
    - { duration: "rank hours" }
    - { duration: "rank days" }
    - { duration: permanent }
  description: "Grants the target {temp_hp} temporary hit points for the duration."

Detect Magic:
  type: spell
  tier: [0, 1, 2, 3, 4, 5]
  name:
    - Detect Overt Magic
    - Detect Stationary Magic
    - Detect Magic Signatures
    - See Magic
    - Identify Magic
    - Read Magic
  school: augury
  activation_time: 2 turns
  range: Self
  target: self
  duration: rank minutes
  skills: [perform_, arcana]
  variant_overrides:
    - { description: "Detects magical auras within range, but only after 1 minute of focused concentration on the area." }
    - { description: "Reveals stationary magical auras instantly. Auras attached to moving creatures or objects remain hidden." }
    - { description: "Identifies the caster of a spell cast within the last day, and identifies the maker of a magic item." }
    - { description: "Reveals all magical auras within range including moving auras. Identifies magical signatures up to 1 week after the spell was cast or the item was made." }
    - { description: "Identifies magic items, spell effects active on creatures, and the nature of any magical phenomenon within range." }
    - { description: "Sees all magic at once and undetectably; reveals magical traps, illusions, and hidden enchantments without alerting their owners." }
  description: "Detects magical auras. The information revealed grows with the spell's tier."

Light:
  type: spell
  tier: [0, 1, 2, 3, 4, 5]
  prefix: [null, Bright, Greater, Brilliant, Radiant, Searing]
  school: resonance
  range: Touch
  target: "1"
  duration: rank hours
  skills: [arcana, perform_]
  effect_hash:
    radius: [20, 30, 40, 50, 60, 80]
  variant_overrides:
    - null
    - null
    - null
    - null
    - null
    - range: Close
      target: "1+rank"
      save:
        - attribute: wis
          fail: blind
          success: dazzled
      description: "The caster controls the light's direction and intensity, projecting a focused beam at one or more enemies. Targets caught in the beam must make a Wisdom save: failure leaves them blinded; success leaves them dazzled. The light still illuminates a {radius}-foot area around its anchor point."
  description: "Causes a touched point to glow like a torch, casting bright light in a {radius}-foot radius."

Disguise Self:
  type: spell
  tier: [0, 1, 2, 3]
  name:
    - Lesser Disguise Self
    - Disguise Self
    - Greater Disguise
    - Mass Disguise
  school: resonance
  range: Self
  target: self
  duration: rank hours
  skills: [arcana, perform_]
  variant_overrides:
    - null
    - null
    - { range: Touch, target: "1" }
    - range: Touch
      target: "1+rank/2"
      description: "Alter the appearance of multiple targets — including their clothing, armor, weapons, and equipment — to look like different people of the same creature type. The caster may spend a main action on any subsequent turn to change any target's disguise."
  description: "Alter your appearance — including clothing, armor, weapons, and equipment — to look like a different person of the same creature type. You can seem 1 foot shorter or taller, thinner or fatter, and you may add or obscure minor features."

Resistance:
  type: spell
  tier: [0, 1, 2, 3, 4, 5]
  prefix:
    - Trivial
    - Lesser
    - Simple
    - Improved
    - Advanced
    - Superior
  school: pneumancy
  range: Close
  target: "1"
  duration: 1 minute
  skills: [perform_, arcana, healing, nature]
  modifiers:
    - target: save
      type: Guidance
      descriptors: [all]
      add: 1
  variant_overrides:
    - null
    - { duration: rank minutes }
    - { duration: rank*10 minutes }
    - { duration: rank hours }
    - { duration: 1 day }
    - { duration: rank days }
  description: "Grants the target a +1 Guidance bonus to all saving throws for the duration."

Magic Vestments:
  type: spell
  tier: [0, 1, 2, 3]
  prefix: [Fleeting, Temporary, null, Extended]
  school: resonance
  activation_time: bonus
  range: Close
  target: "1"
  duration: 1 turn
  items: [oil]
  modifiers:
    - target: damage_reduction
      type: Guidance
      add: 3
  variant_overrides:
    - null
    - { duration: rank turns }
    - { duration: rank minutes }
    - { duration: rank hours }
  description: "Grants the target a +3 damage reduction for the duration."

Recharge:
  type: spell
  tier: [0, 1, 2, 3, 4, 5]
  prefix: [Faint, Minor, Basic, Moderate, Improved, Greater]
  school: universal
  polarity: positive
  range: Touch
  target: "1"
  save:
    - attribute: cha
      fail: "0"
      success: "0"
  duration: instant
  skills: [arcana, perform_]
  effect_hash:
    mana: [2, 4, 8, 16, 32, 64]
    minimum_saturation: tier*4
    saturation: tier*10
  description: "Restores {mana} points of mana to the touched target. May be used to charge magic items, or as an attack against creatures already saturated with magic — those targets make a Charisma save."

Sacred Flame:
  type: spell
  tier: 0
  school: pneumancy
  range: Close
  target: "1"
  attack_roll: true
  damage_type: radiant
  duration: rank turns
  channel:
    mode: fire
    apply_on_cast: true
    retarget: true
    attack_roll: true
    description: "Make another ranged radiant attack against any valid target within range."
  description: "Make a ranged attack that does radiant damage to the target."

Command:
  type: spell
  tier: 1
  school: enchantment
  range: Close
  target: "1"
  save:
    - attribute: wis
      fail: compelled
      success: "0"
  duration: "1 turn"
  skills: [arcana, perform_]
  properties: [language_dependent]
  description: "Give the target a simple command. The DM adjudicates what counts as a simple command and how the target carries it out."

Divine Favor:
  type: spell
  tier: 1
  school: pneumancy
  activation_time: bonus
  range: Touch
  target: object
  duration: "1 turn"
  description: "Adds the Radiant weapon enchantment to the touched weapon until the end of the turn. Radiant is an Equipment weapon enchantment analogous to Flaming; it adds radiant damage to attacks made with the weapon."

Shield of Faith:
  type: spell
  tier: 1
  school: convergence
  activation_time: bonus
  range: Close
  target: "1"
  duration: rank turns
  channel:
    mode: reservoir
    retarget: true
  reservoir:
    fill:
      source: channel_dice
      ratio: 1
    discharge:
      action: reaction
      amount: "2..dice_cap"
      description: "When an attack is made against the target, spend {amount} Reservoir dice to fuel a block Roll against the attack."
  description: "Conjures a floating magical shield next to the target. While channeled, the caster may discharge Reservoir dice as reactions to block attacks made against the target."

Spiritual Weapon:
  type: spell
  tier: 2
  school: convergence
  range: Medium
  target: "1"
  attack_roll: true
  damage_type: force
  duration: "rank turns"
  channel:
    mode: auto
    description: "Each turn on the caster's turn, the weapon makes one attack against its current target using a number of dice equal to its Reservoir. The Reservoir is not consumed. The caster may spend a Main Action on a later turn to redirect the weapon to a new target."
  reservoir:
    fill:
      source: channel_dice
      ratio: 1
    reset: persistent
  description: "Conjures a floating magical weapon that strikes the designated opponent. The weapon takes the form of the weapon you are holding or one favored by your deity. Each turn the weapon makes one attack against its target automatically, using the caster's spell check. If the weapon goes beyond the spell's range or out of the caster's sight, it returns to the caster and hovers."

Spiritual Hammer:
  type: spell
  tier: 2
  school: convergence
  range: Medium
  target: "1"
  attack_roll: true
  damage_type: force
  duration: "rank turns"
  channel:
    mode: auto
    description: "Each turn on the caster's turn, the hammer makes one attack against its current target using a number of dice equal to its Reservoir. The Reservoir is not consumed. The caster may spend a Main Action on a later turn to redirect the hammer to a new target."
  reservoir:
    fill:
      source: channel_dice
      ratio: 1
    reset: persistent
  description: "War-domain variant of Spiritual Weapon. Conjures a floating warhammer of divine force that strikes the designated opponent. On a critical strike the target must make a Toughness save against the spell's TN or be staggered until the start of its next turn."

Hold Person:
  type: spell
  tier: 2
  school: enchantment
  range: Close
  target: "1"
  save:
    - attribute: wis
      fail: paralyzed
      success: "0"
  target_escape_save:
    action: full turn
    attribute: wis
  duration: "rank turns"
  description: "Paralyzes a single creature on a failed Wisdom save."

Silence:
  type: spell
  tier: 2
  school: resonance
  range: Medium
  target: "1"
  area:
    shape: circle
    size: 4
    anchor: target
    on_enter:
      - attribute: wis
        fail: silenced
        success: "0"
  save:
    - attribute: wis
      fail: silenced
      success: "0"
  duration: "rank turns"
  skills: [perform_]
  description: "Complete silence prevails in a 20-foot radius sphere centered on the target. The area moves with the target. No sound issues from, enters, or passes through the area; verbal-component spells cannot be cast. An unwilling creature target attempts a Wisdom save to negate the spell. Items in a creature's possession or magic items that emit sound receive the benefit of the target's save."

Standard Surgery:
  type: spell
  tier: 1
  school: pneumancy
  activation_time: "360 minutes"
  range: Touch
  target: "1"
  duration: instant
  skills: [healing]
  effect_hash:
    saturation_per_major_cured: 10
    minimum_saturation_per_major_cured: 5
  description: "Target helpless or willing creature immediately loses all temporary hitpoints and takes an amount of moderate damage equal to double its major damage. Any attempt to prevent this damage causes the spell to fail. At the end of casting a spell check is rolled and each success cures 1 point of major damage. This spell causes 10 points of magic toxicity per major point cured, with a minimum of 5 points of magic toxicity per point cured."

Message:
  type: spell
  tier: 0
  school: resonance
  range: Medium
  target: "rank"
  duration: "rank*10 minutes"
  description: "You can whisper messages and hear whispered replies while targets are within range."

Silent Portal:
  type: spell
  tier: 0
  school: resonance
  range: Close
  target: object
  duration: "rank turns"
  description: "Target door or window makes no sound when opened or closed. This does not prevent other sounds such as objects falling from the door frame."

Hideous Laughter:
  type: spell
  tier: 1
  school: enchantment
  range: Medium
  target: "1"
  save:
    - attribute: wis
      fail: laughing_fit
      success: "0"
  target_escape_save:
    action: full turn
    attribute: wis
  duration: "rank turns"
  description: "Target creature falls prone in gales of laughter on a failed Wisdom save and is unable to act on their next turn."

Illusion of Calm:
  type: spell
  tier: 1
  school: resonance
  range: Self
  target: self
  save:
    - attribute: int
      save_target: observers
      fail: believes_illusion
      success: "0"
  duration: "rank minutes"
  description: "Create an illusion of yourself that hides your real actions. You can control the apparent actions of your illusion but it must remain exactly where you are. Can be used as a reaction in combat to evade attacks."

Speak with Plants:
  type: spell
  tier: 1
  school: augury
  range: Close
  target: self
  duration: "rank minutes"
  skills: [nature]
  description: "Surrounding vegetation gains temporary sentience and can recall the events of the last 24 hours. They still retain any other limitations such as lack of sight, but can remember touch, temperature, and the feeling of light. As temporarily sentient plants they can make small movements of their leaves and branches but are not compelled to."

Auditory Hallucination:
  type: spell
  tier: 1
  school: enchantment
  range: Medium
  target: "rank"
  save:
    - attribute: wis
      fail: believes_illusion
      success: "0"
  duration: "rank turns"
  skills: [arcana, perform_]
  channel:
    mode: fire
    apply_on_cast: false
    description: "Adjust the sounds the targets hear."
  description: "Targets will hear any sound you can imagine. The sounds the creature hears will be based upon their knowledge not yours such as the sound of their chieftain's voice. All targets hear the same hallucination."

Entangle:
  type: spell
  tier: 1
  school: transmutation
  range: Long
  area:
    shape: circle
    size: 8
    texture: entangle
    on_enter:
      - attribute: str
        fail: entangled
        fumble: restrained
        success: "0"
    on_end_of_turn:
      - attribute: str
        fail: entangled
        fumble: restrained
        success: "0"
  save:
    - attribute: str
      fail: entangled
      fumble: restrained
      success: "0"
  duration: "rank minutes"
  skills: [nature]
  description: "Plant life grows and animates creating difficult terrain in a 40-foot spread. Spent dice are used each turn on your turn to make athletics checks against targets in effect."

Mage Hand:
  type: spell
  tier: 0
  school: transmutation
  range: Close
  target: object
  duration: rank turns
  channel:
    mode: maintain
  description: "You point your finger at an object and can lift it and move it at will from a distance. As a move action, you can propel the object as far as 15 feet in any direction, though the spell ends if the distance between you and the object ever exceeds the spell's range."

Summon Mount:
  type: spell
  tier: 1
  school: convergence
  activation_time: full turn
  range: Close
  duration: "rank hours"
  description: "You summon a light horse or a pony (your choice) to serve you as a mount. The steed serves willingly and well. The mount comes with a bit and bridle and a riding saddle."

Friends:
  type: spell
  tier: 0
  school: enchantment
  range: Close
  target: "1"
  save:
    - attribute: wis
      fail: guidance_effect
      success: "0"
  duration: rank turns
  skills: [arcana, perform_]
  channel:
    mode: fire
    apply_on_cast: true
    retarget: true
    description: "Maintain the Friends effect against the targeted creatures."
  description: "Designated creatures must make a Wisdom save. Targets that fail suffer a penalty to their effective save against Charisma-based skill checks made by the caster and the caster's allies, for the duration. Identifying the spell automatically counts as making the save."

Grasp:
  type: spell
  tier: 1
  school: transmutation
  activation_time: reaction
  range: Close
  target: "1"
  duration: rank turns
  skills: [perform_]
  channel:
    mode: reservoir
    apply_on_cast: true
  reservoir:
    fill:
      source: channel_dice
      ratio: 1
    discharge:
      action: reaction
      amount: "2..dice_cap"
      description: "When the target makes a climb check, discharge {amount} Reservoir dice to add the caster's successes to the target's check."
  description: "The caster becomes a supporting roll on the target's climb check, adding their successes to the target's check. The initial cast resolves as a reaction to a climb check and applies the boost immediately; subsequent channels fill the Reservoir for additional boosts."

Ears of the City:
  type: spell
  tier: 1
  school: augury
  activation_time: full turn
  range: Self
  target: self
  duration: "1 turn"
  skills: [arcana, perform_]
  description: "The caster sees and hears a stream of past scenes and pieces of conversations from lower-tier creatures within the building they occupy, maximum 100 feet. The caster gains the benefit of a 'gather information' check in a single turn rather than hours using the caster's spell check instead of persuasion."

Timely Inspiration:
  type: spell
  tier: 1
  school: enchantment
  activation_time: reaction
  range: Close
  target: "1"
  duration: instant
  skills: [perform_]
  description: "The caster becomes a supporting roll on the target's attack or skill check, adding their successes to the target's check."

Web:
  type: spell
  tier: 2
  school: transmutation
  range: Long
  area:
    shape: circle
    size: 4
    texture: web
    on_enter:
      - attribute: dex
        fail: restrained
        success: "0"
    on_end_of_turn:
      - attribute: dex
        fail: restrained
        success: "0"
  save:
    - attribute: dex
      fail: restrained
      success: "0"
  duration: "rank minutes"
  description: "Web creates a many-layered mass of strong, sticky strands. These strands trap those caught in them. The strands are similar to spiderwebs but far larger and tougher. These masses must be anchored to two or more solid and diametrically opposed points or else the web collapses upon itself and disappears. Creatures caught within a web become grappled by the sticky fibers. Attacking a creature in a web doesn't cause you to become grappled."

Create Pit:
  type: spell
  tier: 2
  school: convergence
  range: Close
  area:
    shape: square
    size: 2
    on_enter:
      - attribute: dex
        fail: in_pit
        success: "0"
  save:
    - attribute: dex
      fail: in_pit
      success: "0"
  effect_hash:
    depth: rank                  # in 5-foot squares; caller plumbs into in_pit's Active Effect metadata
    penalty: tier                # Athletics-check Guidance Penalty when escaping
    falling_modifier: 0          # per-10-feet adjustment to Falling Damage Per 10 Feet
  duration: "rank turns"

Create Spiked Pit:
  type: spell
  tier: 2
  school: convergence
  range: Close
  area:
    shape: square
    size: 2
    on_enter:
      - attribute: dex
        fail: in_pit
        success: "0"
  save:
    - attribute: dex
      fail: in_pit
      success: "0"
  effect_hash:
    depth: rank                  # in 5-foot squares
    penalty: tier                # Athletics-check Guidance Penalty when escaping
    falling_modifier: 1          # +1 damage per 10 feet from the spikes at the bottom
  duration: "rank turns"
  description: "Identical to Create Pit, but the bottom of the pit is studded with spikes. Falling into the pit (or fumbling an Athletics check during escape) deals 3 damage per 10 feet instead of 2."
  description: "You create a 10-foot-by-10-foot extra-dimensional hole with a depth of 10 feet per two caster levels (maximum 30 feet). You must create the pit on a horizontal surface of sufficient size. Since it extends into another dimension, the pit has no weight and does not otherwise displace the original underlying material. You can create the pit in the deck of a ship as easily as in a dungeon floor or the ground of a forest. Any creature standing in the area where you first conjured the pit must make a Reflex saving throw to jump to safety in the nearest open space. In addition, the edges of the pit are sloped, and any creature ending its turn on a square adjacent to the pit must make a Reflex saving throw with a +2 bonus to avoid falling into it. Creatures subjected to an effect intended to push them into the pit (such as bull rush) do not get a saving throw to avoid falling in if they are affected by the pushing effect. Creatures who fall into the pit take falling damage as normal. The pit's coarse stone walls have a Climb DC of 25. When the duration of the spell ends, creatures within the hole rise up with the bottom of the pit until they are standing on the surface over the course of a single turn."

Sift:
  type: spell
  tier: 0
  school: augury
  range: Close
  area: { shape: square, size: 2 }
  duration: rank turns
  skills: [arcana, perform_]
  channel:
    mode: fire
    apply_on_cast: true
    description: "Continue sifting the area."
  description: "Instantly search a 10-foot cubic area."

Vacuous Vessel:
  type: spell
  tier: 0
  school: enchantment
  range: Touch
  target: object
  save:
    - attribute: wis
      save_target: observers
      fail: believes_illusion
      success: "0"
  duration: "rank turns"
  skills: [arcana, perform_]
  description: "This spell makes a single bag, chest, sack, or other container look and feel empty. It cannot be larger than 1 cubic foot per rank. Anyone examining it gets a Wisdom save to resist this enchantment."

Grease:
  type: spell
  tier: 1
  aspects: [object, area]
  school: transmutation
  range: Close
  target: ["1", null]
  area:
    - null
    - shape: square
      size: 2
      on_enter:
        - attribute: dex
          fail: prone
          success: "0"
      on_end_of_turn:
        - attribute: dex
          fail: prone
          success: "0"
  save:
    - attribute: dex
      fail: prone
      success: "0"
  duration: "rank turns"
  skills: [arcana, perform_]
  items: [oil]
  description: "Cast on an object (a single creature or held item), the target is coated in slick grease — they suffer a -2 situational penalty on Athletics checks, gain a +2 situational bonus on Escape Artist checks for the duration, and must make a Dexterity save on cast or fall prone. Cast on an area (a 10-foot square), the area is greased — creatures in the area when the spell is cast, ending their turn in the area, or moving through it must make a Dexterity save or fall prone."

Darkvision:
  type: spell
  tier: 2
  school: transmutation
  range: Touch
  target: "1"
  requires_willing: true
  duration: "rank*10 minutes"
  items: [potion]
  description: "Target creature can see in non-magical darkness as though there were bright light covering an area 5 feet per rank around them. This new sight is limited to black and white shapes and is unable to read flat text. Bright lights within the range of this spell can blind anyone using this spell."

Benign Transposition:
  type: spell
  tier: 1
  school: convergence
  range: Medium
  target: "2"
  requires_willing: true
  duration: instant
  description: "Two target creatures, of which you can be one, instantly swap positions. Both subjects must be within range. Objects carried by the creatures (up to the creatures' maximum loads) go with them, but other creatures do not, even if they are carried. The movement is instantaneous and does not provoke attacks of opportunity."

Repair:
  type: spell
  tier: 0
  school: transmutation
  activation_time: 5 minutes
  range: Touch
  target: "object up to rank*1 lb"
  duration: 1 hour
  skills: [craft_]
  resolution: dm
  description: "Make minor repairs to an object as though you had an appropriate crafting table and mundane tools. All work done using this spell is twice as fast as it would take using ordinary means. The DM picks the appropriate craft_ check based on the object."

Charm Person:
  type: spell
  tier: 1
  school: enchantment
  range: Close
  target: "1"
  save:
    - attribute: wis
      fail: charmed
      success: "0"
  duration: rank*10 minutes
  skills: [arcana, perform_]
  modifiers:
    - amount: -2
      type: Circumstance
      condition: "target lacks unaware condition"
      description: "-2 unless the target has the Unaware condition."
  description: "Influences the target's attitude toward the caster. On a failed save the target gains the charmed condition for the duration. The charmed condition is resolved entirely by the DM."

Healing Word:
  type: spell
  tier: 1
  school: pneumancy
  polarity: positive
  activation_time: reaction
  range: Close
  target: "1"
  duration: instant
  skills: [healing, nature, perform_]
  reaction_trigger: "ally about to take damage from a resolved attack"
  description: "Spoken as a reaction when an ally is about to take damage. Reduces the damage dealt by 1 per success on the Heal check."

Suggestion:
  type: spell
  tier: 2
  school: enchantment
  range: Medium
  target: "1"
  save:
    - attribute: wis
      fail: compelled
      success: "0"
  duration: rank*10 minutes
  skills: [arcana, perform_]
  properties: [language_dependent]
  modifiers:
    - amount: 2
      type: Circumstance
      condition: "request is reasonable (DM discretion)"
      description: "+2 if the suggested course of action sounds reasonable."
  description: "You influence the actions of the target creature by suggesting a course of activity (limited to a sentence or two). The suggestion must be worded in such a manner as to make the activity sound reasonable. Asking the creature to do some obviously harmful act automatically negates the effect of the spell. The suggested course of activity can continue for the entire duration. If the suggested activity can be completed in a shorter time, the spell ends when the subject finishes what it was asked to do. You can instead specify conditions that will trigger a special activity during the duration. If the condition is not met before the spell duration expires, the activity is not performed."

Blind:
  type: spell
  tier: 2
  school: resonance
  range: Medium
  target: "1"
  save:
    - attribute: wis
      fail: blind
      success: "0"
  duration: permanent
  description: "A single target within range must make a Wisdom save or gain the blinded condition. The effect is permanent until removed by other means."

Protection from Poison:
  type: spell
  tier: 2
  school: pneumancy
  range: Touch
  target: "1"
  duration: "rank*10 minutes"
  skills: [healing, nature]
  modifiers:
    - target: save
      type: Guidance
      descriptors: [poison]
      add: 1
  description: "Grants the touched creature a +1 Guidance bonus on all Constitution saves against poison for the duration."

Obscuring Mist:
  type: spell
  tier: 1
  school: transmutation
  range: Medium
  area:
    shape: circle
    size: 2
    texture: mist
  duration: "rank minutes"
  resolution: dm
  description: "A 10-foot-radius cloud of mist billows out from a point within range. Sight is obscured for anyone trying to see into, out of, or through the mist. The DM adjudicates the resulting concealment on attacks and Perception checks. The mist's area is placed on the map as an area shape."

Expeditious Retreat:
  type: spell
  tier: 1
  school: transmutation
  range: Self
  target: self
  duration: "rank minutes"
  modifiers:
    - target: speed
      type: Guidance
      add: 30
  description: "Your speed increases by 30 feet (a +30 Guidance bonus to speed) for the duration."

Blindspot:
  type: spell
  tier: 2
  school: resonance
  range: Touch
  target: "1"
  requires_willing: true
  save:
    - attribute: wis
      save_target: observers
      fail: blindspot
      success: "0"
  duration: "rank minutes"
  description: "The touched creature becomes invisible, gaining the blindspot effect. Any creature attempting to perceive the target makes a Wisdom save; on a failure the target remains unseen by that observer, on a success that observer sees through the invisibility."

Darkness:
  type: spell
  tier: 2
  school: resonance
  range: Medium
  area:
    shape: circle
    size: 4
  duration: "rank minutes"
  resolution: dm
  description: "A 20-foot-radius area centered on a point within range is shrouded in magical gloom, lowering the light level there by two steps for the duration. The DM adjudicates the effects of the reduced light. The darkened area is placed on the map as an area shape."

Magic Weapon:
  type: spell
  tier: 2
  school: transmutation
  range: Touch
  target: object
  duration: "rank minutes"
  modifiers:
    - target: attack
      type: Guidance
      add: caster_tier
    - target: damage
      type: Guidance
      add: caster_tier
  effect_hash:
    caster_tier: caster_tier    # the casting Creature's Tier; plumbed into the Active Effect metadata so the modifiers resolve against the caster, not the wielder
  description: "Imbues the touched weapon with a Guidance enhancement bonus equal to the caster's Tier. Like an enhanced weapon, the bonus applies to both attack rolls and damage rolls made with the weapon. Lasts 1 minute per rank."

Blur:
  type: spell
  tier: 2
  school: resonance
  range: Touch
  target: "1"
  requires_willing: true
  duration: "rank minutes"
  effects:
    - "blurred"
  description: "The touched creature's outline blurs and wavers. For the duration the creature gains the blurred effect: every Critical Success rolled on an attack against it is rerolled, blunting decisive blows."
