# Item Icon Map
#
# Maps an Equipment Item Type (the catalog name) to its icon file under
# public/item_images/. Used by the Store and Inventory stubs to show art
# next to each item.
#
# Keys are the exact Item Type names from equipment_config.yaml. Values
# are filenames relative to public/item_images/. An Item Type with no
# entry here falls back to the slug convention (lowercased name, runs of
# non-alphanumerics collapsed to "_", e.g. "Long sword" -> long_sword.svg);
# if neither the mapped file nor the slug file exists, the stub shows an
# empty placeholder. Add an entry to override the slug default or to point
# several Item Types at one shared icon.
#
# Icons are from "D&D Item Icons by Gwill" (CC BY 3.0); see
# public/item_images/CREDITS.md.

