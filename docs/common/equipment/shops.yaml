# Generic Shop Catalog
#
# Each Generic Shop entry describes the shopkeeper's stocking
# rules. Stock is materialized at *Visit Generic Shop* time using
# the supplied `population` (5..50,000) — items with `min_pop`
# above the population are not stocked; quantity scales with
# population per item.
#
# Quantity formula:
#   quantity = qty_base + floor(qty_per_kpop * pop / 1000)
#
# Sample scaling for a Healing Potion (qty_base 2, qty_per_kpop 4):
#   pop    100 ->   2 +  0 =   2
#   pop  1,000 ->   2 +  4 =   6
#   pop  5,000 ->   2 + 20 =  22
#   pop 50,000 ->   2 + 200 = 202
#
# Wealth formula (the shop's purchasing budget — how much gold it
# has to buy from PCs):
#   gold = base_gold + floor(gold_per_sqrt_pop * sqrt(pop))
#
# Stock entries:
#   item              Item Type key from equipment_config.yaml.
#                     Every entry must resolve to a real catalog item.
#   min_pop           Population gate. Below this, item not stocked.
#   qty_base          Quantity at exactly min_pop.
#   qty_per_kpop      Extra quantity per 1,000 population.
#   tier              Optional tier override. For tier-array items
#                     (e.g. Healing Potion), the tier selects which
#                     variant the shopkeeper stocks.
#   properties        Optional list of Magical Properties (same shape as
#                     the inventory data files: a string, or {name,
#                     subtype}). Lets a Shop stock a magical weapon — e.g.
#                     a Flaming Long sword. Pair with a `tier` so the
#                     Property is legal (most weapon Properties need
#                     tier >= their min_tier). Unit Price uses the catalog
#                     Property cost.

generic_shops:

  alchemist_shop:
    name: Alchemist Shop
    base_gold: 80
    gold_per_sqrt_pop: 18
    stock:
      - { item: Healing Potion, tier: 0, min_pop:     5, qty_base: 2, qty_per_kpop: 4 }
      - { item: "Acid jar",            min_pop:   200, qty_base: 1, qty_per_kpop: 1 }
      - { item: "Alchemist's fire",    min_pop:   200, qty_base: 1, qty_per_kpop: 1 }
      - { item: Healing Potion, tier: 1, min_pop:  1000, qty_base: 1, qty_per_kpop: 0 }
      - { item: Healing Potion, tier: 2, min_pop: 10000, qty_base: 1, qty_per_kpop: 0 }

  weapons_shop:
    name: Weapons Shop
    base_gold: 150
    gold_per_sqrt_pop: 35
    stock:
      - { item: Dagger,        min_pop:    5, qty_base: 3, qty_per_kpop: 1 }
      - { item: Sling,         min_pop:    5, qty_base: 2, qty_per_kpop: 1 }
      - { item: Stone,         min_pop:    5, qty_base: 20, qty_per_kpop: 20 }
      - { item: Quarterstaff,  min_pop:    5, qty_base: 2, qty_per_kpop: 1 }
      - { item: Spear,         min_pop:   50, qty_base: 2, qty_per_kpop: 1 }
      - { item: Javelin,       min_pop:   50, qty_base: 3, qty_per_kpop: 2 }
      - { item: "Short sword", min_pop:  100, qty_base: 1, qty_per_kpop: 1 }
      - { item: Mace,          min_pop:  100, qty_base: 1, qty_per_kpop: 1 }
      - { item: Crossbow,      min_pop:  200, qty_base: 1, qty_per_kpop: 1 }
      - { item: Bolt,          min_pop:  200, qty_base: 20, qty_per_kpop: 15 }
      - { item: Longbow,       min_pop:  200, qty_base: 1, qty_per_kpop: 1 }
      - { item: Arrow,         min_pop:  200, qty_base: 20, qty_per_kpop: 15 }
      - { item: "Long sword",  min_pop:  300, qty_base: 1, qty_per_kpop: 1 }
      - { item: Warhammer,     min_pop:  300, qty_base: 1, qty_per_kpop: 1 }
      - { item: Rapier,        min_pop:  500, qty_base: 1, qty_per_kpop: 1 }
      - { item: Whip,          min_pop:  500, qty_base: 1, qty_per_kpop: 0 }
      - { item: "Hand crossbow", min_pop: 1000, qty_base: 1, qty_per_kpop: 0 }
      - { item: "Great sword", min_pop: 1000, qty_base: 1, qty_per_kpop: 0 }
      - { item: "Leather armor",  min_pop:  100, qty_base: 1, qty_per_kpop: 1 }
      - { item: "Studded leather", min_pop: 300, qty_base: 1, qty_per_kpop: 1 }
      - { item: "Chain shirt",    min_pop:  500, qty_base: 1, qty_per_kpop: 0 }
      - { item: "Hide armor",     min_pop:  500, qty_base: 1, qty_per_kpop: 0 }
      - { item: "Chain mail",     min_pop: 1000, qty_base: 1, qty_per_kpop: 0 }
      # Magical weapons (rare — large settlements only). Each lands 4 extra
      # dice of its damage type on a hit; Vicious also bites the wielder.
      - { item: "Long sword",  tier: 1, min_pop: 2000, qty_base: 1, qty_per_kpop: 0, properties: [{ name: Elemental, subtype: Fire }] }
      - { item: "Long sword",  tier: 1, min_pop: 3000, qty_base: 1, qty_per_kpop: 0, properties: [{ name: Elemental, subtype: Cold }] }
      - { item: Mace,          tier: 1, min_pop: 3000, qty_base: 1, qty_per_kpop: 0, properties: [{ name: Elemental, subtype: Acid }] }
      - { item: Warhammer,     tier: 1, min_pop: 3000, qty_base: 1, qty_per_kpop: 0, properties: [{ name: Elemental, subtype: Electricity }] }
      - { item: Rapier,        tier: 1, min_pop: 4000, qty_base: 1, qty_per_kpop: 0, properties: [{ name: Emotional }] }
      - { item: "Great sword", tier: 2, min_pop: 8000, qty_base: 1, qty_per_kpop: 0, properties: [{ name: Vicious }] }
      - { item: "Plate mail",     min_pop: 5000, qty_base: 1, qty_per_kpop: 0 }
      - { item: "Light wooden shield", min_pop: 100, qty_base: 2, qty_per_kpop: 1 }
      - { item: "Tower shield",        min_pop: 500, qty_base: 1, qty_per_kpop: 0 }

  general_store:
    name: General Store
    base_gold: 60
    gold_per_sqrt_pop: 12
    stock:
      - { item: Rations,        min_pop:    5, qty_base: 10, qty_per_kpop: 10 }
      - { item: Bedroll,        min_pop:    5, qty_base: 3, qty_per_kpop: 2 }
      - { item: Whetstone,      min_pop:    5, qty_base: 5, qty_per_kpop: 4 }
      - { item: Lute,           min_pop:  100, qty_base: 1, qty_per_kpop: 1 }
      - { item: Drums,          min_pop:  100, qty_base: 1, qty_per_kpop: 1 }
      - { item: Flute,          min_pop:  100, qty_base: 1, qty_per_kpop: 1 }
      - { item: Harp,           min_pop:  500, qty_base: 1, qty_per_kpop: 0 }
      - { item: "Thieves' tools", min_pop: 300, qty_base: 1, qty_per_kpop: 1 }
      - { item: "Ritual book",  min_pop: 1000, qty_base: 1, qty_per_kpop: 0 }
