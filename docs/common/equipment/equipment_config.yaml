    resilience_increment: 2
    thickness: 2
  Heavy:
    damage_reduction: 6
    resilience_increment: 3
    thickness: 3
  Shield:
    damage_reduction: null
    resilience_increment: null
    thickness: 1

# Materials. Effective Hardness = base_hardness + 2 * tier. The
# `hit_points` string is a formula Combat evaluates; `thickness`
# substitutes from the wearing Armor's Category Defaults.
