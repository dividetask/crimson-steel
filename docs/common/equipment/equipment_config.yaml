# Magical Weapon Properties. `applies_to` keys: `melee`, `ranged`,
# `ammo`. A Property with `has_subtype: true` has a Display block
# keyed by Subtype.
#
# `effects:` is an optional list of Active Effects the Property
# posts to Conditions when the carrier Stack is equipped. Each entry
# matches Conditions' Active Effect shape (target_key, bonus_type,
# amount, optional ends_on_round, optional metadata).
Weapon Properties:
  Elemental:
    min_tier: 1
    cost: 500
    applies_to: [melee, ranged, ammo]
    has_subtype: true
    subtypes: [Fire, Acid, Electricity, Cold]
    display:
      Fire: { word: Flaming }
      Acid: { word: Corrosive }
      Electricity: { word: Shocking }
      Cold: { word: Freezing }
    damage_rider:
      dice: 4
      on_success:
        kind: damage
        damage_type: from_subtype
        amount: 1
  Emotional:
    min_tier: 1
    cost: 500
    applies_to: [melee, ranged, ammo]
    has_subtype: false
    display:
      word: Wrathful
    damage_rider:
      dice: 4
      on_success:
        kind: damage
        damage_type: emotional
        amount: 1
  Radiant:
    min_tier: 1
    cost: 500
    applies_to: [melee, ranged, ammo]
    has_subtype: false
    display:
      word: Radiant
    damage_rider:
      dice: 4
      on_success:
        kind: damage
        damage_type: radiant
        amount: 1
  Subdual:
    min_tier: 1
    cost: 250
    applies_to: [melee, ranged, ammo]
    has_subtype: false
    display:
      word: Merciful
    damage_rider:
      dice: 4
      on_success:
        kind: named_effect
        name: shock
        amount: 2
    weapon_modifiers:
      threshold_delta: 5
  # Glory treats the wielder's Tier as `amount` higher when attacking a
  # higher-Tier opponent, shrinking the Tier gap (Δ) that drives the Tier
  # Mismatch Inherent damage reduction (encounter_design.md → "Tier Mismatch
  # modifiers") and lifting its Inherent Bonus on the attack check. A
  # weapon-only, single-target effect — it never rides a spell or area
  # attack. `tier_advantage` is read by Combat at attack time (not posted to
  # Conditions).
  Glory:
    min_tier: 1
    cost: 2000
    applies_to: [melee, ranged]
    has_subtype: false
    display:
      word: Glorious
    tier_advantage:
      amount: 1
  Vicious:
    min_tier: 2
    cost: 2000
    applies_to: [melee]
    has_subtype: false
    display:
      word: Vicious
    # Each rider Success deals Major damage to the target (the weapon's
    # own Damage Type, but the Severity is forced to Major). The bite is
    # double-edged: on a hit the wielder takes a minimum of 1 Minor
    # damage, plus 1 more Minor per rider die that came up a 1.
    damage_rider:
      dice: 4
      on_success:
        kind: damage
        damage_type: from_weapon
        amount: 1
        severity: major
      on_failure:
        kind: self_damage
        severity: minor
        amount: 1
        minimum: 1

# =====================================================================
# AMMUNITION
# =====================================================================
# Sold in bundles of `bundle_size`. Per-unit price =
#   (base_price / bundle_size) +
#   (Tier Surcharge + sum(Property cost)) / Magical Ammunition Divisor

Ammunition:
  Arrow:
    base_price: 5
    bundle_size: 20
    used_by: [Longbow, Shortbow]
  Bolt:
    base_price: 5
    bundle_size: 20
    used_by: [Crossbow, Hand crossbow]
  Stone:
    base_price: 1
    bundle_size: 20
    used_by: [Sling]

