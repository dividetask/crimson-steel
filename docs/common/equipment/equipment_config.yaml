# Equipment Configuration
#
# Tunable values plus the catalogs of Item Types and Magical
# Properties referenced by every other domain. Loot Tables live in
# `loot_tables.yaml` (plus any `loot_tables-*.yaml`), Ground Piles
# in `loot.yaml`, Shops in `shops.yaml`, and the Loot Archive in
# `notes_loot.yaml`.
#
# Rule keys use Title Case and are referenced from the design /
# glossary / tests by exactly these names. Catalog keys (Item Types,
# Property names, Material names, Slot names, Tag names) are
# lowercase / Title Case as authored; they are opaque strings to
# Equipment and are only compared for equality.
#
# Prices are in Gold (gp) as real numbers. 1 gp = 10 sp = 100 cp.

# =====================================================================
# TIER PRICING
# =====================================================================

# Flat per-Tier Gold surcharge added when an Item is made magical.
# Tier 0 has no surcharge. Per-Item-Type `tier_surcharge` blocks
# override this map.
Default Tier Surcharge:
  1: 250
  2: 1000
  3: 4000
  4: 16000
  5: 80000

# Flat per-Bonus Gold surcharge for Guidance Items, keyed by Bonus
# value. Used together with Default Tier Surcharge to price Guidance
# Items: `Default Tier Surcharge[tier] + Default Bonus Surcharge[bonus]`.
Default Bonus Surcharge:
  1: 500
  2: 1000
  3: 2000
  4: 4000
  5: 6500
  6: 9000
  7: 13500
  8: 18000
  9: 27000

# Divisor applied to a magical Ammunition Stack's magical cost.
# Per-unit magical cost = (Tier Surcharge + sum(Property cost)) /
# Magical Ammunition Divisor.
Magical Ammunition Divisor: 100

# Same idea for non-ammo Consumables (potions, oils, scrolls).
Consumable Surcharge Divisor: 10

# Multiplier applied to any Item Type flagged `innately_usable: true`
# (potions, oils — anything anyone can activate).
Innately Usable Price Multiplier: 2.0

# =====================================================================
# DISPLAY NAME
# =====================================================================

# Substituted into the Tier prefix with `{tier}`. Tier 0 omits the
# prefix entirely; Item Types whose Category appears in Tier Hidden
# For also omit it.
Tier Prefix Format: "+{tier}"

# Item Categories whose Generated Display Name suppresses the Tier
# prefix. Potions, for example, conventionally read "Potion of X"
# without a +N prefix.
Tier Hidden For:
  - Consumable

# When a Property's Display block does not declare a `position`,
# this is used. One of `prefix` or `suffix`.
Default Property Position: prefix

# =====================================================================
# ITEM CONSUMPTION
# =====================================================================
# Saturation imposed by *Consume Item* on Potions and Oils. Scrolls
# and Wands impose no saturation through Equipment.
#
# Both lists are indexed by Item Tier (0..5). Base is the saturation
# imposed when the target Creature's Tier is greater than or equal
# to the item's Tier; Minimum is the floor any caller-supplied
# reducer cannot push the final value below. When the target's Tier
# is strictly lower than the item's Tier, both Base and Minimum are
# multiplied by Lower Tier Multiplier.
#
# Example: a Tier 2 Potion on a target of Tier 2+ imposes 6
# saturation, reducible to 3. The same Potion on a target of Tier 1
# imposes 12 saturation, reducible to 6.
Consumable Saturation:
  Minimum: [1, 2, 3, 4, 5, 6]
  Base:    [2, 4, 6, 8, 10, 12]
  Lower Tier Multiplier: 2

# =====================================================================
# SLOTS
# =====================================================================
# Body slot strings an equippable Item or piece of Armor may occupy.
# Worn armor and held weapons use implicit slots (`body`, `hand`)
# and are not listed here. The Creatures domain enforces "one Item
# per Slot" at equip time.

Slots:
  - back
  - bag
  - belt
  - body
  - chest
  - feet
  - finger
  - hands
  - head
  - neck
  - shoulders
  - wrists

# Tattoo Slots — a parallel Slot namespace for Tattoos (see the Tattoos
# catalog block). A Tattoo occupies its body location like a worn Item,
# but in this separate namespace: a `chest` Tattoo does NOT conflict
# with chest Armor, only with another `chest` Tattoo. The Creatures
# domain enforces "one Tattoo per Tattoo Slot" independently of the
# worn-Item Slot rule above.
Tattoo Slots:
  - back
  - belt
  - body
  - chest
  - feet
  - finger
  - hands
  - head
  - neck
  - shoulders
  - wrists

# =====================================================================
# WEAPONS
# =====================================================================

# Weapon Categories — the weapon's weight class, which sets its default
# `speed` and `base_damage`. `base_damage` is the default damage formula
# evaluated by Combat (Equipment only stores the string). `speed` is the
# weapon's flat Combat-Pool surcharge for an attack: the cost to roll N
# dice is `speed + N` (a flat per-action surcharge, NOT a per-die
# multiplier). Resolution: a per-weapon `speed` → first Weapon Tag with
# `speed` → this Category default.
Weapon Categories:
  Ranged:
    base_damage: "str / 4"
    speed: 2
  One Handed:
    base_damage: "str / 4 - 2"
    speed: 2
  Two Handed:
    base_damage: "str / 2"
    speed: 3

# Weapon Tags — mundane structural tags, distinct from magical
# Weapon Properties. `damage_formula` overrides the Category
# default; the first Tag carrying one wins when a Weapon has
# multiple Tags. `speed` overrides the Category speed the same way.
Weapon Tags:
  thrown:
    damage_formula: "str / 4 - 2"
    description: A weapon balanced for throwing.
  light:
    damage_formula: "str / 4 - 2"
    speed: 1
    description: A light one-handed weapon.
  heavy:
    damage_formula: "str / 2 + 2"
    speed: 3
    description: A heavy weapon typically requiring both hands to wield.
  exotic:
    description: A weapon requiring specialized training.
  double_weapon:
    description: A weapon that can attack with both ends.
  lesslethal:
    description: On a successful hit, inflicts a non-lethal stunning effect.

# Damage Type defaults — a weapon's default `bleed` and `threshold` come
# from its Damage Type(s). Multi-Type Weapons use the highest Bleed and
# the lowest Threshold across their Damage Types. A per-weapon `bleed` /
# `threshold` overrides the Damage-Type default (an explicit `threshold:`
# wins even when null). On a hit, the Bleed actually inflicted is this
# value plus the damage dealt (see encounter_config.yaml → "actual bleed
# = Bleed Constant + damage dealt"), so a 0-Bleed weapon still bleeds for
# the damage it deals.
Damage Type Defaults:
  Slashing:
    bleed: 7
    threshold: 5
  Bludgeoning:
    bleed: 5
    threshold: 3
  Piercing:
    bleed: 3
    threshold: 4

# Reference Weapon catalog. The list is open — consuming projects add
# entries via override files. A weapon's defaults are derived, not
# repeated per entry: `speed` + `base_damage` from its `category` (weight
# class), and `bleed` + `threshold` from its `damage_type`. An entry only
# needs `category` and `damage_type`; it may additionally set any of
# `speed`, `base_damage`, `bleed`, or `threshold` to override the derived
# default for that one weapon.
Weapons:
  # Unarmed — every Creature can make this attack with no weapon equipped.
  # Speed 0, damage `str / 4 - 4`, Threshold 8 (overrides the Bludgeoning
  # default). Combat offers it implicitly; it is never carried as inventory.
  # `natural: true` marks it (and other natural attacks like claws/bite) as
  # unable to Parry without a special ability — see `natural` in the design.
  Unarmed:
    category: One Handed
    damage_type: Bludgeoning
    base_damage: "str / 4 - 4"
    speed: 0
    threshold: 8
    natural: true
    base_price: 0
  # Natural bites carried by beast subtypes. `affliction` names a
  # Conditions Affliction the bite injects on a hit; Combat offers a
  # poison input alongside damage / bleed in the attack resolution.
  Bite (Fangs):
    category: One Handed
    damage_type: Piercing
    base_damage: "str / 8"
    speed: 0
    natural: true
    affliction: spider_venom
    affliction_potency: 5   # injected Potency = this + damage dealt
    base_price: 0
  Bite (Jaws):
    category: One Handed
    damage_type: Piercing
    base_damage: "str / 2"
    speed: 0
    natural: true
    base_price: 0
  Longbow:
    category: Ranged
    damage_type: Piercing
    ammo_type: Arrow
    base_price: 50
  Crossbow:
    category: Ranged
    damage_type: Piercing
    ammo_type: Bolt
    base_price: 35
  Sling:
    category: Ranged
    damage_type: Bludgeoning
    ammo_type: Stone
    base_price: 1
  Javelin:
    category: Ranged
    damage_type: Piercing
    tags: [thrown]
    base_price: 4
  Mace:
    category: One Handed
    damage_type: Bludgeoning
    base_price: 10
  Warhammer:
    category: One Handed
    damage_type: Bludgeoning
    base_price: 15
  Long sword:
    category: One Handed
    damage_type: [Slashing, Piercing]
    base_price: 35
  Short sword:
    category: One Handed
    damage_type: [Slashing, Piercing]
    tags: [light]
    base_price: 8
  Rapier:
    category: One Handed
    damage_type: Piercing
    base_price: 25
  Dagger:
    category: One Handed
    damage_type: [Slashing, Piercing]
    tags: [light]
    base_price: 2
  Hand crossbow:
    category: Ranged
    damage_type: Piercing
    ammo_type: Bolt
    tags: [light]
    base_price: 25
  Whip:
    category: One Handed
    damage_type: Slashing
    base_damage: 0
    tags: [lesslethal]
    threshold: null
    base_price: 4
  Spear:
    category: Two Handed
    damage_type: Piercing
    base_price: 5
  Great sword:
    category: Two Handed
    damage_type: Slashing
    tags: [heavy]
    base_price: 60
  Quarterstaff:
    category: Two Handed
    damage_type: Bludgeoning
    tags: [double_weapon]
    base_price: 2
  Battleaxe:
    category: One Handed
    damage_type: Slashing
    base_price: 10
  Greataxe:
    category: Two Handed
    damage_type: Slashing
    tags: [heavy]
    base_price: 20
  Falchion:
    category: Two Handed
    damage_type: Slashing
    base_price: 75
  # Shortbow shares the Longbow's profile (Ranged, Piercing, Arrow ammo);
  # priced lower as the lighter, shorter-ranged bow.
  Shortbow:
    category: Ranged
    damage_type: Piercing
    ammo_type: Arrow
    base_price: 25
  # Bola — a thrown entangling weapon (10-ft range). Its damage field adds
  # nothing to the attack (`base_damage: 0`); a creature it hits must make a
  # Dexterity save or fall prone. `range_feet` and `on_hit_save` are
  # declarative — the save's Combat wiring is not yet implemented.
  Bola:
    category: Ranged
    damage_type: Bludgeoning
    base_damage: 0
    tags: [thrown]
    range_feet: 10
    on_hit_save:
      attribute: dex
      fail: prone
      success: "0"
    base_price: 5

# Magical Weapon Properties. `applies_to` keys: `melee`, `ranged`,
# `ammo`. A Property with `has_subtype: true` has a Display block
# keyed by Subtype.
#
# `effects:` is an optional list of Active Effects the Property
# posts to Conditions when the carrier Stack is equipped. Each entry
# matches Conditions' Active Effect shape (target_key, bonus_type,
# amount, optional ends_on_round, optional metadata).
Weapon Properties:
  Elemental:
    min_tier: 1
    cost: 500
    applies_to: [melee, ranged, ammo]
    has_subtype: true
    subtypes: [Fire, Acid, Electricity, Cold]
    display:
      Fire: { word: Flaming }
      Acid: { word: Corrosive }
      Electricity: { word: Shocking }
      Cold: { word: Freezing }
    damage_rider:
      dice: 4
      on_success:
        kind: damage
        damage_type: from_subtype
        amount: 1
  Emotional:
    min_tier: 1
    cost: 500
    applies_to: [melee, ranged, ammo]
    has_subtype: false
    display:
      word: Wrathful
    damage_rider:
      dice: 4
      on_success:
        kind: damage
        damage_type: emotional
        amount: 1
  Radiant:
    min_tier: 1
    cost: 500
    applies_to: [melee, ranged, ammo]
    has_subtype: false
    display:
      word: Radiant
    damage_rider:
      dice: 4
      on_success:
        kind: damage
        damage_type: radiant
        amount: 1
  Subdual:
    min_tier: 1
    cost: 250
    applies_to: [melee, ranged, ammo]
    has_subtype: false
    display:
      word: Merciful
    damage_rider:
      dice: 4
      on_success:
        kind: named_effect
        name: shock
        amount: 2
    weapon_modifiers:
      threshold_delta: 5
  # Glory treats the wielder's Tier as `amount` higher when attacking a
  # higher-Tier opponent, shrinking the Tier gap (Δ) that drives the Tier
  # Mismatch Inherent damage reduction (encounter_design.md → "Tier Mismatch
  # modifiers") and lifting its Inherent Bonus on the attack check. A
  # weapon-only, single-target effect — it never rides a spell or area
  # attack. `tier_advantage` is read by Combat at attack time (not posted to
  # Conditions).
  Glory:
    min_tier: 1
    cost: 2000
    applies_to: [melee, ranged]
    has_subtype: false
    display:
      word: Glorious
    tier_advantage:
      amount: 1
  Vicious:
    min_tier: 2
    cost: 2000
    applies_to: [melee]
    has_subtype: false
    display:
      word: Vicious
    # Each rider Success deals Major damage to the target (the weapon's
    # own Damage Type, but the Severity is forced to Major). The bite is
    # double-edged: on a hit the wielder takes a minimum of 1 Minor
    # damage, plus 1 more Minor per rider die that came up a 1.
    damage_rider:
      dice: 4
      on_success:
        kind: damage
        damage_type: from_weapon
        amount: 1
        severity: major
      on_failure:
        kind: self_damage
        severity: minor
        amount: 1
        minimum: 1

# =====================================================================
# AMMUNITION
# =====================================================================
# Sold in bundles of `bundle_size`. Per-unit price =
#   (base_price / bundle_size) +
#   (Tier Surcharge + sum(Property cost)) / Magical Ammunition Divisor

Ammunition:
  Arrow:
    base_price: 5
    bundle_size: 20
    used_by: [Longbow, Shortbow]
  Bolt:
    base_price: 5
    bundle_size: 20
    used_by: [Crossbow, Hand crossbow]
  Stone:
    base_price: 1
    bundle_size: 20
    used_by: [Sling]

# =====================================================================
# ARMOR
# =====================================================================

# Per-Category defaults. Shields carry null Damage Reduction and
# null Resilience Increment — Combat reads these specifically.
Armor Category Defaults:
  Clothing:
    damage_reduction: 0
    resilience_increment: 1
    thickness: 1
  Light:
    damage_reduction: 1
    resilience_increment: 1
    thickness: 1
  Medium:
    damage_reduction: 3
    resilience_increment: 2
    thickness: 2
  Heavy:
    damage_reduction: 6
    resilience_increment: 3
    thickness: 3
  Shield:
    damage_reduction: null
    resilience_increment: null
    thickness: 1

# Materials. Effective Hardness = base_hardness + 2 * tier. The
# `hit_points` string is a formula Combat evaluates; `thickness`
# substitutes from the wearing Armor's Category Defaults.
Materials:
  Cloth:
    hardness: 0
    hit_points: "5 * thickness"
  Leather:
    hardness: 2
    hit_points: "5 * thickness"
  Metal:
    hardness: 10
    hit_points: "30 * thickness"
  Wood:
    hardness: 5
    hit_points: "10 * thickness"

# Reference Armor catalog. Per-Item `metal: true` marks an Armor
# whose wearer counts as wearing Metal Armor for Damage Type
# interactions (notably Electricity per `combat_config.yaml`).
# Default false when omitted.
Armor:
  Leather armor:
    category: Light
    material: Leather
    base_price: 10
  Studded leather:
    category: Light
    material: Leather
    base_price: 25
  Chain shirt:
    category: Light
    material: Metal
    metal: true
    base_price: 100
  Hide armor:
    category: Medium
    material: Leather
    base_price: 15
  Chain mail:
    category: Medium
    material: Metal
    metal: true
    base_price: 150
  Plate mail:
    category: Heavy
    material: Metal
    metal: true
    base_price: 500
  Light wooden shield:
    category: Shield
    material: Wood
    base_price: 3
  Tower shield:
    category: Shield
    material: Metal
    metal: true
    base_price: 30
  Robes:
    category: Clothing
    material: Cloth
    base_price: 1

# Magical Armor Properties. `applies_to` keys: `all_armor` (any
# armor including shields) or `all_body` (any armor except shields).
Armor Properties:
  Fortification:
    min_tier: 1
    cost: 500
    applies_to: [all_body]
    has_subtype: false
    display:
      word: Fortified
    effects:
      - target_key: damage_resilience
        bonus_type: Guidance
        amount: 1
  Elemental Resistance:
    min_tier: 2
    cost: 2000
    applies_to: [all_armor]
    has_subtype: true
    subtypes: [Fire, Acid, Electricity, Cold]
    display:
      Fire: { word: Fireproof }
      Acid: { word: Acidproof }
      Electricity: { word: Grounded }
      Cold: { word: Coldproof }
    damage_resistance:
      damage_type: from_subtype
      amount: 5

# =====================================================================
# GUIDANCE ITEMS
# =====================================================================
# Each entry lists parallel `guidance_bonus` and `tier` arrays — the
# same Tier may correspond to multiple Bonus values. Unit Price uses
# `Default Tier Surcharge[tier] + Default Bonus Surcharge[bonus]`.

Items:
  Cloak of Resistance:
    slot: back
    spell: Resistance
    guidance_attribute: saves
    guidance_bonus: [1, 2, 3, 4, 5]
    tier: [1, 2, 3, 4, 5]
    description: Grants a Guidance Bonus to the wearer's saving throws.
  Belt of Strength:
    slot: belt
    guidance_attribute: str
    guidance_bonus: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    tier: [1, 1, 2, 2, 3, 3, 4, 4, 5]
    description: Grants a Guidance Bonus to the wearer's Strength.
  Belt of Dexterity:
    slot: belt
    guidance_attribute: dex
    guidance_bonus: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    tier: [1, 1, 2, 2, 3, 3, 4, 4, 5]
    description: Grants a Guidance Bonus to the wearer's Dexterity.
  Belt of Constitution:
    slot: belt
    guidance_attribute: con
    guidance_bonus: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    tier: [1, 1, 2, 2, 3, 3, 4, 4, 5]
    description: Grants a Guidance Bonus to the wearer's Constitution.
  Headband of Intelligence:
    slot: head
    guidance_attribute: int
    guidance_bonus: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    tier: [1, 1, 2, 2, 3, 3, 4, 4, 5]
    description: Grants a Guidance Bonus to the wearer's Intelligence.
  Headband of Wisdom:
    slot: head
    guidance_attribute: wis
    guidance_bonus: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    tier: [1, 1, 2, 2, 3, 3, 4, 4, 5]
    description: Grants a Guidance Bonus to the wearer's Wisdom.
  Headband of Charisma:
    slot: head
    guidance_attribute: cha
    guidance_bonus: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    tier: [1, 1, 2, 2, 3, 3, 4, 4, 5]
    description: Grants a Guidance Bonus to the wearer's Charisma.

# =====================================================================
# CURRENCY
# =====================================================================
# Currencies appear in Inventory as ordinary Item Stacks; merge by
# Item Type alone (every Currency Stack of the same type shares
# identity). `weight` is stored but not acted on.

Currency:
  Gold:
    symbol: gp
    value_in_gold: 1.0
    weight: 0.02
  Silver:
    symbol: sp
    value_in_gold: 0.1
    weight: 0.02
  Copper:
    symbol: cp
    value_in_gold: 0.01
    weight: 0.02

# =====================================================================
# CONSUMABLES AND BOOKS
# =====================================================================
# Consumable Items decrement Quantity by one when *Consume Item* is
# called against them. `inscribable: true` marks an Item Type as a
# Ritual book — its Stacks carry an Inscribed Spells list.
#
# Potions, oils, and scrolls are not enumerated here — the catalog
# is open and consuming projects add Potion / Oil / Scroll variants
# via override files. The entries below are the special-case
# consumables that do not follow the "Potion of X" naming.

Consumables:
  Alchemist's fire:
    category: Consumable
    base_price: 25
    innately_usable: true
  Acid jar:
    category: Consumable
    base_price: 25
    innately_usable: true

Books:
  Ritual book:
    category: Item
    slot: bag
    base_price: 15
    inscribable: true

