# Equipment Configuration
#
# Tunable values plus the catalogs of Item Types and Magical
# Properties referenced by every other domain. Loot Tables live in
# `loot_tables.yaml` (plus any `loot_tables-*.yaml`), Ground Piles
# in `loot.yaml`, Shops in `shops.yaml`, and the Loot Archive in
# `notes_loot.yaml`.
#
# Rule keys use Title Case and are referenced from the design /
# glossary / tests by exactly these names. Catalog keys (Item Types,
# Property names, Material names, Slot names, Tag names) are
# lowercase / Title Case as authored; they are opaque strings to
# Equipment and are only compared for equality.
#
# Prices are in Gold (gp) as real numbers. 1 gp = 10 sp = 100 cp.

# =====================================================================
# TIER PRICING
# =====================================================================

# Flat per-Tier Gold surcharge added when an Item is made magical.
# Tier 0 has no surcharge. Per-Item-Type `tier_surcharge` blocks
# override this map.
Default Tier Surcharge:
  1: 250
  2: 1000
  3: 4000
  4: 16000
  5: 80000

# Flat per-Bonus Gold surcharge for Guidance Items, keyed by Bonus
# value. Used together with Default Tier Surcharge to price Guidance
# Items: `Default Tier Surcharge[tier] + Default Bonus Surcharge[bonus]`.
Default Bonus Surcharge:
  1: 500
  2: 1000
  3: 2000
  4: 4000
  5: 6500
  6: 9000
  7: 13500
  8: 18000
  9: 27000

# Divisor applied to a magical Ammunition Stack's magical cost.
# Per-unit magical cost = (Tier Surcharge + sum(Property cost)) /
Magical Ammunition Divisor: 100
Consumable Surcharge Divisor: 10

# Multiplier applied to any Item Type flagged `innately_usable: true`
# (potions, oils — anything anyone can activate).
Innately Usable Price Multiplier: 2.0

# =====================================================================
# DISPLAY NAME
# =====================================================================

Tier Prefix Format: "+{tier}"
Tier Hidden For:
  - Consumable
Default Property Position: prefix

# =====================================================================
# ITEM CONSUMPTION
# =====================================================================
# Saturation imposed by *Consume Item* on Potions and Oils. Scrolls
# and Wands impose no saturation through Equipment.

Consumable Saturation:
  Minimum: [1, 2, 3, 4, 5, 6]
  Base:    [2, 4, 6, 8, 10, 12]
  Lower Tier Multiplier: 2

# =====================================================================
# SLOTS
# =====================================================================

