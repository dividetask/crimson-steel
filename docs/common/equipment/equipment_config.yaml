# =====================================================================
# TATTOOS
# =====================================================================
# A Tattoo is permanent body art that grants one or more Abilities. It
# occupies a Tattoo Slot (a parallel namespace to worn-Item Slots — see
# "Tattoo Slots" above), so a Tattoo never competes with Armor or worn
# gear for the same body location; it only competes with another Tattoo
# in the same Tattoo Slot. Tattoos are:
#   - always equipped (no `equipped` field; they have no un-equipped
#     state and are never toggled),
#   - permanent (they cannot be removed or unequipped), and
#   - granting (`grants` lists the Ability names conferred while borne —
#     which, being permanent, is always).
# The catalog is open; consuming projects add their own Tattoos.

Tattoos:
  # Example Tattoo — a chest tattoo granting the Sneak Attack Talent, but
  # only ever at Class Level 1 (so its bonus never scales with the
  # wearer's own level). A `grants` entry may be a plain Ability name, or
  # `{ ability:, class_level: }` to pin the level the Ability is granted at.
  Tattoo of the Viper:
    category: Tattoo
    slot: chest
    grants:
      - ability: Sneak Attack
        class_level: 1
    base_price: 5000
  # A face-slot Tattoo granting a +1 Guidance Bonus to Intelligence. Like
  # every Tattoo it is permanent — always borne, never (un)equipped — so it
  # posts its bonus without an `equipped` flag. `no_store` keeps it out of
  # shop provisioning (the DM places it). The Stack carries the Bonus value.
  Tattoo of the Fox:
    category: Tattoo
    slot: face
    guidance_attribute: int
    no_store: true
    description: "A small fox inked in fine lines behind the ear and along the hairline, kept hidden beneath the wearer's hair. The fox's cunning sharpens the mind, granting a +1 Guidance Bonus to Intelligence."

# =====================================================================
# POISON VIALS
# =====================================================================
# Poison Vials are NOT enumerated here. Like the Spell-Form Items
# (Scroll / Potion / Oil / Wand), they are autogenerated by the Catalog —
# one "Vial of <Poison>" per Affliction of category "poison" in
# `conditions/conditions_afflictions.yaml`. Each generated Vial is a
# Consumable carrying its `poison` (the Affliction key) and holds its
# doses as the Stack `quantity`. Structure only for now: applying a dose
# (to a weapon, or thrown / applied to a target) is not yet wired into
# Combat. A project may still author an explicit Vial entry under a
# `Poison Vials:` block to override a generated one.

# =====================================================================
# UNIQUE ITEMS
# =====================================================================
# One-of-a-kind named Items. They carry no `base_price` (no gold value)
# and `no_store: true` keeps them out of Store provisioning — the DM
# places them; they are never bought or sold. `grants` confers Abilities
# to the wielder while equipped (a plain Ability name, or
# `{ ability:, class_level: }`).
Unique Items:
  Kesser's Ring:
    inherits_from: Ring
    no_store: true
    grants: [Kesser's Gambit]
    description: "A plain band that hums with reversal. While worn, it grants Kesser's Gambit to the wielder."
  # A Ring that grants a defensive Parry Reaction (`grants_parry`), limited to
  # `uses_per_day` Parries (default 1). While worn and charged it offers,
  # against a melee attack, a Parry at the wielder's chosen melee weapon's Dice
  # Cap that spends no Combat Pool. The charge recharges at dawn (when the
  # in-world day advances) — tracked generically as a per-day item charge.
  Ring of Parry:
    inherits_from: Ring
    no_store: true
    grants_parry: true
    uses_per_day: 1
    description: "A duelist's band. Once per day it parries a single attack at the wielder's weapon Dice Cap, spending no Combat Pool. Recharges at dawn."
  # A worn Circlet that grants a castable Spell while equipped, exactly like a
  # Wand (`grants_spell` + `spell`): the spell joins the wearer's castable list,
  # channels the wearer's own Mana, and imposes no Magic Toxicity.
  Circlet of the Boughking:
    inherits_from: Hat
    no_store: true
    grants_spell: true
    spell: Entangle
    description: "A crown of living briar. While worn, the wearer may cast Entangle."
  # A spell-granting Ring — like a Wand, but conferring more than one Spell.
  # `grants_spell` + a `spells` list adds every named Spell to the wearer's
  # Cast list while equipped, each cast at the Spell's own Tier (not the
  # Ring's), channelling the wearer's own Mana with no Magic Toxicity.
  Ring of Shooting Stars:
    category: Item
    slot: finger
    no_store: true
    grants_spell: true
    spells: [Spark Shower, Shooting Stars]
    description: "A silver band set with a chip of fallen starmetal. While worn it lets the wearer cast Spark Shower and Shooting Stars using their own Mana, the way a Wand grants its spell — no charges, no Magic Toxicity. Functions only at night under open sky."
