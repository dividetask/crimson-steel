# Crimson Steel — Encounter tunables (currently Combat mode only).
#
# State (combatants, initiative, time tick, etc.) lives in
# `encounter_data.json`, not here. This file is rules only.
#
# All keys use Title Case as referenced from the design / glossary
# / tests. Override files in `data/` follow the convention in
# `file_conventions.md`.

Initiative Attribute: wis
Initiative Divisor: 2

Combat Pool Attribute: wis
Combat Pool Step: 4

# Turns per round indexed by Tier (Tier 0 → index 0)
# Tier Reference  0  1  2  3  4  5
Turns Per Round: [1, 1, 1, 2, 4, 8]

Free Action Minimum: 0
Reaction Action Minimum: 2
Bonus Action Minimum: 2
Main Action Minimum: 4

Flatfooted Bonus:
  type: Circumstance
  amount: 1

Unaware Bonus:
  type: Circumstance
  amount: 2

Helpless Bonus:
  type: Circumstance
  amount: 3

Flatfooted Suppressors:
  - uncanny_dodge

Set Value Spend Ratio: 1   #DELETE ME

Falling Damage Per 10 Feet: 2
Falling Damage Threshold: 5
Falling Damage Bleed Constant: 0

Trigger Conditions:
  attack_hits: "Fires when an attack lands. The triggering Ability's description names any additional conditions (target Flatfooted, specific weapon or natural attack, repeat hit on the same target, etc.) and the GM adjudicates whether the trigger should fire."
  attack_action: "Fires when the actor takes an Attack action. The triggering Ability's description names any additional conditions and the GM adjudicates."
  rolled_a_one: "Fires when at least one die in the actor's Roll came up as a Failure (value 1)."

damage_types:

  physical:
    severity: { runtime_bucketed: true }

  bludgeoning:
    parent: physical

  slashing:
    parent: physical

  piercing:
    parent: physical

  radiant:
    severity: moderate
    mechanics:
      - { kind: upgrade_severity, when: target_has_subtype:undead, to: major }

  elemental:

  fire:
    parent: elemental
    severity: moderate
    mechanics:
      - { kind: damage_per_hit, amount: 1 }

  cold:
    parent: elemental
    severity: minor
    mechanics:
      - { kind: inflict, effect: shock, amount: damage_dealt }

  acid:
    parent: elemental
    severity: moderate
    mechanics:
      - { kind: apply_acid_counter }

  electricity:
    parent: elemental
    severity: moderate
    mechanics:
      - { kind: bonus_successes_from, source: metal_armor_damage_reduction }

  emotional:
    severity: minor
    mechanics:
      - { kind: critical_value, amount: 3 }

  force:
    severity: moderate

Metal Armor Categories:
  - medium
  - heavy
