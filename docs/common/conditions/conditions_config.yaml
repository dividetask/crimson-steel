# Conditions Configuration
#
# Tunable values for the Conditions domain. Catalogs live alongside
# this file: `afflictions.yaml` (Affliction Rules) and
# `effect_names.yaml` (Effect Name definitions).
#
# Severity Categories themselves are owned by Combat (Minor, Moderate,
# Major, ordered least to most serious — see `combat_glossary.md`).
# Heal Cascades and Damage Absorption pour worst → best.
#
# Keys are Title Case and are referenced from the design / glossary
# / tests by exactly these names.

# ---- Affliction magnitude / save penalty ----
#
# Used in both the Magnitude formula (`1 + floor(potency / Potency
# Divisor)`) and the Potency Save Penalty (a Competency Penalty of
# `floor(potency / Potency Divisor)`) injected into every Affliction
# save. Global by design — Affliction Rules cannot override.
#
# "Potency" is the Affliction's strength counter, named distinctly
# from Damage Severity (Minor/Moderate/Major) to avoid confusion.
Potency Divisor: 10

# ---- Toxicity Threshold ----
#
# Determines the Threshold gating positive Magic-Toxicity-imposing
# effects, and the value used in the Toxicity Damage formula.
#
# Threshold = floor(attribute_value × tier_multiplier), where
#   attribute_value = the named Creature attribute
#   tier_multiplier = max(0.5, creature_tier) when Tier Scaled is
#                     true; 1 when Tier Scaled is false.
# The Tier 0 → 0.5 substitution matches the project-wide convention.
Toxicity Threshold:
  Attribute: cha
  Tier Scaled: true

# Severity of the Charisma Ability Damage inflicted when Magic
# Toxicity is pushed further past the Toxicity Threshold. The
# damage amount itself is the increase that lands above the
# threshold — see "Magic Toxicity Update" in the design.
Toxicity Damage Severity: major

# ---- Death Threshold ----
#
# A Creature is Dead when any of these is reached:
#   HP        ≥ floor(Death Multiplier × max_hit_points)
#   Attribute ≥ floor(Death Multiplier × attribute_score)  (any single attribute)
#   Toxicity  ≥ floor(Death Multiplier × Toxicity Threshold)
# A higher multiplier = harder to kill; a lower one = more lethal.
# Fractional values are permitted (e.g. 1.5 tunes lethality between
# the canonical 1× and 2× thresholds).
Death Multiplier: 2.0

# ---- Default Potency evolution ----
#
# Affliction Potency evolves each resolution by:
#   delta = −floor(decay)
#           − floor(successes × per_success)
#           + floor(failures × per_failure)
# Per-Affliction overrides allowed in `afflictions.yaml`.
# Values are integer or the literal "tier" (Tier 0 → 0.5, floored).

# Potency decrease per net save success.
Default Potency Per Success: 1

# Potency increase per net save failure.
Default Potency Per Failure: 1

# Per-resolution Potency reduction independent of save successes.
# Default tracks Tier so high-Tier creatures shrug afflictions faster.
Default Potency Decay: "tier"

# ---- Affliction scheduling ----
#
# When an Affliction is inflicted with a current round, its Next
# Resolution Round is set to `current_round + Frequency Rounds[freq]`.
# After each Resolve Affliction the same rule reschedules the
# survivor. List Pending Afflictions / Resolve Due Afflictions
# consult Next Resolution Round.
#
# Defaults assume Timekeeping's Round Length = 6s and Rounds Per
# Day = 14400. A consuming project with a different time scale (an
# FPS that wants minute-cadence Afflictions to fire every 10 in-game
# seconds, for example) overrides the values here without touching
# the Affliction catalog.
Frequency Rounds:
  round:  1
  minute: 10
  hour:   600
  day:    14400
  month:  432000     # 30 days
  year:   5256000    # 365 days

# ---- Natural Recovery ----
#
# Per-Recovery-Tick rules applied by APPLY_NATURAL_RECOVERY. Recovery
# Tick is the smallest unit of game time Natural Recovery advances by
# — distinct from Combat's Time Tick. `Recovery Tick` below sets its
# length in rounds (14400 = one Day at the default Round Length).
#
# Two Recovery Modes:
#   slow — traveling, training, idle non-care recovery.
#   fast — bed rest with active attention (a healer or nurse).
#
# Heal rates are expressed per (Damage Severity, Tier, Mode) as
# `[amount, tick_length]` pairs. Together they describe a rational
# rate: `amount` points per `tick_length` Recovery Ticks. Total healed
# at that Damage Severity is
# `floor((amount × recovery_ticks_elapsed) / tick_length)`. Partial
# progress is NOT retained between calls — a `tick_length` greater
# than `recovery_ticks_elapsed` heals zero.

Natural Recovery:

  # Length of one Recovery Tick, in rounds. A caller that has elapsed
  # rounds rather than Recovery Ticks divides by this value (floor)
  # before invoking APPLY_NATURAL_RECOVERY.
  Recovery Tick:    14400

  Mana Per Recovery Tick Divisor: 4
  Magic Toxicity Per Recovery Tick Divisor: 4

  Heal Rate:
    minor:
      - { slow: [1, 7],   fast: [2, 7]   }   # Tier 0
      - { slow: [1, 1],   fast: [2, 1]   }   # Tier 1
      - { slow: [2, 1],   fast: [4, 1]   }   # Tier 2
      - { slow: [3, 1],   fast: [6, 1]   }   # Tier 3
      - { slow: [4, 1],   fast: [8, 1]   }   # Tier 4
      - { slow: [5, 1],   fast: [10, 1]  }   # Tier 5
    moderate:
      - { slow: [1, 30],  fast: [2, 30]  }   # Tier 0
      - { slow: [1, 7],   fast: [2, 7]   }   # Tier 1
      - { slow: [2, 7],   fast: [4, 7]   }   # Tier 2
      - { slow: [3, 7],   fast: [6, 7]   }   # Tier 3
      - { slow: [4, 7],   fast: [8, 7]   }   # Tier 4
      - { slow: [5, 7],   fast: [10, 7]  }   # Tier 5
    major:
      - { slow: [0, 1],   fast: [0, 1]   }   # Tier 0
      - { slow: [1, 30],  fast: [2, 30]  }   # Tier 1
      - { slow: [2, 30],  fast: [4, 30]  }   # Tier 2
      - { slow: [3, 30],  fast: [6, 30]  }   # Tier 3
      - { slow: [4, 30],  fast: [8, 30]  }   # Tier 4
      - { slow: [5, 30],  fast: [10, 30] }   # Tier 5

  Ability Heal Rate:
    minor:
      - { slow: [1, 7],   fast: [2, 7]   }   # Tier 0
      - { slow: [1, 1],   fast: [2, 1]   }   # Tier 1
      - { slow: [2, 1],   fast: [4, 1]   }   # Tier 2
      - { slow: [3, 1],   fast: [6, 1]   }   # Tier 3
      - { slow: [4, 1],   fast: [8, 1]   }   # Tier 4
      - { slow: [5, 1],   fast: [10, 1]  }   # Tier 5
    moderate:
      - { slow: [1, 30],  fast: [2, 30]  }   # Tier 0
      - { slow: [1, 7],   fast: [2, 7]   }   # Tier 1
      - { slow: [2, 7],   fast: [4, 7]   }   # Tier 2
      - { slow: [3, 7],   fast: [6, 7]   }   # Tier 3
      - { slow: [4, 7],   fast: [8, 7]   }   # Tier 4
      - { slow: [5, 7],   fast: [10, 7]  }   # Tier 5
    major:
      - { slow: [0, 1],   fast: [0, 1]   }   # Tier 0
      - { slow: [1, 30],  fast: [2, 30]  }   # Tier 1
      - { slow: [2, 30],  fast: [4, 30]  }   # Tier 2
      - { slow: [3, 30],  fast: [6, 30]  }   # Tier 3
      - { slow: [4, 30],  fast: [8, 30]  }   # Tier 4
      - { slow: [5, 30],  fast: [10, 30] }   # Tier 5
