# Timekeeping Configuration

# Real-world seconds that one in-game Round represents.
Round Length: 6

# The Year corresponding to Day Index 0.
Default Starting Year: 4710

# Leap Year rule. A Year is a Leap Year when its number is divisible by
# this interval. Set to 0 to disable Leap Years entirely.
Leap Year Interval: 4

# 1-indexed Month number that gains an extra Day in Leap Years.
Leap Month: 2

# Length of each Month in Days, in calendar order.
Month Lengths: [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]

# Name of each Month, in calendar order. Length must match Month Lengths.
Month Names:
  - Frosten
  - Brindle
  - Thawmoon
  - Bloomtide
  - Greentide
  - Sunpeak
  - Highsun
  - Harvest
  - Goldfall
  - Mistwane
  - Stillfrost
  - Longnight

# Names of the Days of the Week, in cycle order. Day Index 0 is the
# first entry; the cycle has no relationship to Months.
Day of Week Names:
  - Restday
  - Toilday
  - Hearthday
  - Marketday
  - Tradeday
  - Feastday
  - Templeday
