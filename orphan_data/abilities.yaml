# Abilities orphan data
#
# Catalog mapping ability names to their displayed descriptions. Will
# migrate to the Abilities domain when it is designed. Keys match the
# ability names referenced from creatures_race.yaml,
# creatures_advancement.yaml, and other Aspect files.

abilities:
  bonus_feat: "Choose any 1st-level feat."
  bonus_racial_feat_halfling: "Choose any halfling feat."
  bonus_racial_feat_gnome: "Choose any gnome feat."

  magical_performance: "Learn a magical variant of any Performance skill, used both for mundane checks and to create a magical performance. Maintaining a performance takes a main action each turn; bardic spells can be cast as part of that action. Only advances on bard levels."
  bardic_spellcasting: "Cast a number of bardic spells as a main action while performing. Spells need not be prepared each day. Casting outside a performance takes twice as long."
  bardic_inspiration: "While performing, spend 1 mana (once per turn) to grant a pool of luck. Each point lets you or an ally reroll a single die before the initial check. Successes grant 1 luck (must be used before your next turn); a fumble awards luck to the DM instead."
  jack_of_all_trades: "Treat all skills (except restricted skills) as trained, with effective ranks equal to half your level on checks where you have no ranks."
  better_lucky_than_good: "Spend 3 mana during a round you cannot act (e.g. surprise round). Attacks against you (including spells) are made with half as many dice (min 3). Enemies are unconsciously aware of the penalty."
  performance_feat: "Gain Familiar, Social Spell, Spell Focus (Enchantment), or Spell Focus (Illusion) as a bonus feat."
  silver_tongue: "+1 inherent bonus to Persuasion and Deception checks; applies when using versatile performance."
  unsettling_words: "Spend a luck point from your performance before an enemy rolls; pick one of their dice to reroll."
  versatile_performance: "No description yet."

  weapon_training: "+1 attack bonus with all weapons, increasing by +1 every 4 levels."
  armor_training: "+1 to damage reduction and resilience while wearing armor, increasing by +1 every 4 levels."

  trapfinding: "Spend 1 mana to sense magical auras (including hidden magical traps); requires concentration. At level 5 and every 5 levels thereafter, gain a +1 competence bonus to Perception checks when searching for traps even without spending mana."
  sneak_attack: "Weapon attacks deal +1 damage against flat-footed creatures within 30 ft (+1 per 2 levels after 1st). Before rolling, you may impose an additional effect (e.g. extra bleed, halved movement) by raising the success requirement; the target makes a Constitution save with a penalty equal to your sneak-attack bonus."
  thieves_cant: "You know thieves' cant — a coded mix of dialect, jargon, and signs. Hide messages in normal conversation (twice as long to convey) and read the secret signs that mark danger, loot, or thieves' guild territory."
  danger_sense: "Spend 4 mana as a reaction when taking damage (even when unaware) to gain a +4 luck bonus to damage resilience against that damage."

  combat_trickery: "Gain a number of arcane spells from the Trickery list as innate spells. Cast them as a main action without preparation."
  mage_hand_legermain: "When you cast Mage Hand the hand can be invisible. Use it to stow or retrieve an item from a container worn or carried by another creature, or to use thieves' tools to pick locks and disarm traps at range."

  shield_bash: "Knock a target prone on a successful shield attack."
  second_wind: "Once per scene, recover 1d6 + level HP as a free action."
  arcane_focus: "Spend mana to add insight dice to a focus check."
  ritual_caster: "Cast spells from the ritual list without preparation."

  rage: "Active. Grants combat pool and bonuses to damage reduction and damage resilience."
  fast_movement: "Increases base walking speed by 10 feet."
  reckless_attacks: "Trade defense for offense; gain attack bonus while imposing a penalty to your own damage resilience."
  uncanny_dodge: "Cannot be caught flat-footed."
  primal_tenacity: "Reaction. Once per scene, halve incoming damage."
  combat_feat: "Gain a combat feat as a bonus."
  mindless_rage: "While raging, immune to charmed and frightened conditions."

  channel_divinity: "Spend mana to invoke a divine effect from your domain."
  turn_undead: "Channel divinity to drive away undead within range."
  hunters_mark: "Mark a target as a quarry; gain bonuses against it."
  quick_draw: "Draw a weapon as part of an attack action."
  wild_shape: "Transform into a beast form for a limited duration."
  spore_cloud: "Release a cloud of spores affecting nearby creatures."

  stunning_strike: "Spend mana on a successful unarmed attack to potentially stun the target."
  ki_pool: "A pool of ki points usable for various monk abilities."

  darkvision: "See in darkness as if it were dim light, up to 60 feet."
  low_light_vision: "See twice as far as a human in dim light."
  keen_senses: "+2 inherent bonus to Perception checks."
  cantrip: "Learn an additional tier 0 spell."
  fleet_of_foot: "Base walking speed increases by 5 feet."
  dwarven_toughness: "+1 HP per level."
  armor_proficiency_light: "Gain proficiency with light armor."
  ferocity: "Damage resilience +3, +5 HP."
  charm_resistance: "+1 inherent bonus against being charmed; immune to magical sleep."
  halfling_luck: "Once per check, reroll a single 1 rolled."
  brave: "+1 inherent bonus against fear-based checks."
  far_sight: "All distance penalties for sight-based perception checks are halved."
  natural_illusionist: "+1 inherent bonus to all illusion spells."
  speak_with_small_beasts: "Through sound and gestures, communicate simple ideas with Small or smaller beasts."
  tinkerer: "Gain Mending and Prestidigitation cantrips as spell-like abilities."
  artificers_lore: "Gain appraisal as a class skill and advance it for free each level. Use appraisal instead of history for checks related to magical or alchemical items."
  fey: "Counts as a fey creature rather than humanoid. Vulnerable to attacks from cold iron weapons."
  horns: "Use head and horns to make a natural attack. Uses full strength modifier rather than half on charging attacks."
  fey_resistance: "+1 inherent bonus to being charmed; immune to magical sleep."
  reveler: "Each level, advance persuasion or one performance skill for free."
  spell_like_ability_enchantment_illusion: "Choose an enchantment or illusion tier 0 spell from any list and cast it as a spell-like ability."
  undead_traits: "Placeholder; defined when Conditions or Equipment domain is written."
  staggered: "Combat pool is halved."
  slam: "A natural slam attack."
  improved_initiative: "+1 inherent bonus to Initiative."
  claws: "Natural light slashing attacks."
  bite: "A natural light piercing attack."
  rend: "On a successful hit with two natural attacks against the same target, deal additional damage."
  natural_armor: "+1 damage reduction."
  regeneration: "Heal a small amount of HP each round unless taking acid or fire damage."
  ghoul_fever: "Disease inflicted on bite. Targets must save against contraction."
  ghoul_paralysis: "Bite or claw can paralyze the target on a failed save."
  ghoul_stench: "Aura of stench imposing penalties on adjacent creatures."
  poison_bite: "Bite injects poison; target must save or take poison damage."
  energy_drain: "Drains life force from a target on a successful slam attack."
  create_spawn: "Creatures killed by this creature rise as undead under its control."
  resurrection_vulnerability: "Resurrection spells deal damage instead of healing."
  relentless: "When reduced to 0 HP, drop to 1 HP instead once per scene."
