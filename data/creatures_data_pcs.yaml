# Crimson Steel — Player Character roster (live campaign data).
#
# Migrated from the legacy `characters.json` export. Only Player
# Characters (group "PC") live here; enemies and NPCs are tracked in
# their own creatures_data_* files. PCs take ids 1..99.
#
# Translation notes (legacy JSON -> current schema):
#   * `ability_scores` -> `attributes`; the race array (e.g. ["dwarf",
#     "hill"]) collapses to a single sub-race key (hill_dwarf).
#   * The `classes` array becomes `advancement.classes`; spell display
#     names become snake_case Catalog keys under `choices.spellcasting`.
#   * Legacy `feats` are dropped (no schema home). Legacy `rituals` move
#     to a Ritual book in the character's inventory (equipment_data.yaml).
#   * Tier is derived from the player_character breakpoints (level 4 ->
#     Tier 2), so it is not hardcoded here.

