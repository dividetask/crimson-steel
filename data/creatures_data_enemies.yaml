# Crimson Steel — Active combat enemies (Rise of the Slavelords caravan).
#
# Instance records for the enemies imported from the live caravan-ambush
# combat. IDs (97-112) are preserved so the Encounter and Conditions
# overlays line up. `attributes` are BASE scores: from each effective score
# we backed out the racial adjustment (human +1 all; half_orc +0; orc +4
# Str/Con, -2 Int/Wis/Cha) and the per-Tier inherent minimum ([0,1,2,3,4,5]),
# so the recomputed Effective scores reproduce the source exactly. `tier` is
# pinned to match the source. Gear is not imported (Equipment subsystem).

