# Crimson Steel — Inventory and Item Tracking (live campaign data).
#
# Migrated from the legacy `equipment.json` export, PCs only (owner ids
# 1, 2, 3, 4, 40). Item type definitions live in `equipment_config.yaml`.
#
# Translation conventions:
#   * Standard catalog gear is keyed directly by its catalog name with NO
#     name override (Plate Armor -> Plate mail, Longbow, Rapier, etc.).
#     `bonus` becomes `tier`.
#   * Unique / named items use the closest generic base Item Type plus a
#     `name` override and `description` (e.g. Battleaxe -> "Last Laugh Axe").
#   * Spell consumables use the autogenerated Item Types: Cure -> Potion/
#     Scroll of Heal (tier = wound level), Invisibility -> Blindspot, etc.
#   * Plain (non-magical) oil -> Kerosene. Poisons use the Poison Vials.
#
# Known representation limits (no catalog mechanic for these — preserved
# as flavor via description):
#   * Elven Cloak's +1 Stealth and +1 Drums' Performance bonus (no skill-
#     guidance Item Type).
#   * Mirror Marble / Miscellaneous items modelled as Trinkets.
#   * The Fox's Cunning face tattoo is modelled as a Headband of
#     Intelligence (to keep its +1 INT); the Circlet of Bough-King (no
#     known effect) is therefore left carried rather than worn so the two
#     don't contend for the head slot.

