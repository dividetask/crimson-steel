# Rise of the Slavelords — The Hill Fort (Stockade) Creature Templates
#
# Named leaders of the slavers' hill fort: the fortified caravan terminus
# south of Highport where the party tracks the slave shipments. Pairs with
# a Stockade Patrol random encounter table (random_encounter_tables.yaml)
# and the signature gear in equipment_data.yaml — equipment owner ids match
# the named-leader creature ids below.
#
# ID space: this file uses 357-363. The base Rise-of-the-Slavelords
# creatures file uses 350-356; the PC/caravan equipment file uses owner
# ids 1-4, 40, and 1097-1112. None of those collide with the ids here.
#
# Crimson Steel reskin notes:
#   * All slavers worship Mortheth; cleric variants take him as deity with
#     domains from Artifice / Death / Earth / Greed / Ruin plus a wider
#     pool, exactly as the base slaver templates.
#   * The fort answers to the Koi syndicate.
#   * Tiers are pitched for a Tier-2 party: named leaders Tier 2-3. PRUNE
#     leader loot before handing it over; the party is already
#     artifact-heavy.

name: Rise of the Slavelords — Hill Fort

characters:

  # ============================================================
  # NAMED LEADERS — unique. Explicit signature gear lives in the
  # equipment data file under matching owner ids.
  # ============================================================

  # 357 — Minor slave-lord and overseer of the fort. Module analogue:
  # Markessa (MU5/F5). A scheming fighter-mage, most favored of the minor
  # lords. Runs interrogations herself; has captured spellcasters executed
  # and the rest sent to the cavelings. Cruel, vain, ambitious.
  # Signature spells (DM ref): charm person, hold person, mirror image,
  # web, magic missile, blindspot. Charms a front-liner, then lets the
  # fort's bodies do the dying.
  - id: 357
    name: Hill Fort Overseer
    metadata:
      creature_token: "/images/icons/elf mage token.webp"
      deity: Mortheth
    group: enemy
    tags: [enemy_template, fort_leader, category:rise_of_the_slavelords_fort]
    race: elf
    tier: 3
    attributes: { str: 12, dex: 16, con: 13, int: 18, wis: 12, cha: 15 }
    advancement:
      classes:
        wizard:
          level: 5
          skills: [arcana, deception, intimidate, sense_motive]
        fighter:
          level: 5
          skills: [athletics, perception]

  # 358 — Fort commander. Module analogue: Icar. BLIND, but has memorized
  # the fort and bolts his furniture in place; fights by sound and habit
  # (treat as full blindsight within the fort, heavy penalties in unfamiliar
  # ground). Holds a treasure cache.
  - id: 358
    name: Fort Commander Icar
    metadata:
      creature_token: "/images/icons/human fighter token.webp"
      deity: Mortheth
    group: enemy
    tags: [enemy_template, fort_leader, category:rise_of_the_slavelords_fort]
    race: human
    tier: 2
    attributes: { str: 17, dex: 14, con: 16, int: 11, wis: 15, cha: 10 }
    advancement:
      classes:
        fighter:
          level: 8
          skills: [athletics, intimidate, perception, sense_motive]

  # 359 — The Executioner. Icar's second; a hulking ogre headsman who
  # carries out Markessa/Overseer's sentences. Slow, brutal, obedient.
  - id: 359
    name: The Executioner
    metadata:
      creature_token: "/images/icons/ogre token.webp"
    group: enemy
    tags: [enemy_template, fort_leader, category:rise_of_the_slavelords_fort]
    race: ogre
    tier: 2
    attributes: { str: 19, dex: 8, con: 17, int: 6, wis: 8, cha: 5 }
    advancement:
      classes:
        fighter:
          level: 4
          skills: [athletics, intimidate]

  # 361 — Gatehouse captain. Module analogue: Gorbin Stalworth. Intruders
  # who are caught are dragged here for interrogation. CARRIES THE IRON
  # RING OF KEYS (fort doors, gates, and slave-cell shackles).
  - id: 361
    name: Gatehouse Captain Gorbin
    metadata:
      creature_token: "/images/icons/human guard token.webp"
      deity: Mortheth
    group: enemy
    tags: [enemy_template, fort_leader, category:rise_of_the_slavelords_fort]
    race: human
    tier: 2
    attributes: { str: 15, dex: 12, con: 14, int: 11, wis: 11, cha: 10 }
    advancement:
      classes:
        fighter:
          level: 5
          skills: [athletics, intimidate, perception]

  # 362 — Gorbin's lieutenant. Module analogue: Kairn, a half-orc.
  - id: 362
    name: Lieutenant Kairn
    metadata:
      creature_token: "/images/icons/orc rogue.webp"
      deity: Mortheth
    group: enemy
    tags: [enemy_template, fort_leader, category:rise_of_the_slavelords_fort]
    race: half_orc
    tier: 1
    attributes: { str: 16, dex: 13, con: 14, int: 9, wis: 10, cha: 8 }
    advancement:
      classes:
        fighter:
          level: 4
          skills: [athletics, intimidate]

  # 363 — Goblin witch-doctor, assistant to the Overseer. Module analogue:
  # Guliyet. Serves as one of the fort's clerics; wanders as a roaming
  # encounter. Cleric of Mortheth.
  - id: 363
    name: Witch-Doctor Guliyet
    metadata:
      creature_token: "/images/icons/goblin shaman token.webp"
      deity: Mortheth
    group: enemy
    tags: [enemy_template, fort_leader, category:rise_of_the_slavelords_fort]
    race: goblin
    tier: 1
    attributes: { str: 8, dex: 14, con: 11, int: 11, wis: 15, cha: 12 }
    advancement:
      classes:
        cleric:
          level: 4
          skills: [religion, intimidate, sense_motive, healing]
          choices: { deity: Mortheth }
          domain_picks:
            - { count: 2, from: [Artifice, Death, Earth, Greed, Ruin] }
            - { count: 1, from: [Plague, Vengeance, Despair, Cunning] }
